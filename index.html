<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noclipov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #c084fc;      /* Bright Nebula Purple */
    --secondary: #38bdf8;    /* Cosmic Cyan */
    --accent: #f472b6;       /* Stellar Pink */
    --txt: #e2e8f0;
    --muted: #8b95a8;
    --bg: #020006;           /* Deep Space Black */
    --card-bg: rgba(15, 10, 25, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--primary), var(--secondary));
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--accent), var(--primary)); }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, sans-serif;
    background: radial-gradient(1200px 800px at 50% -20%, #170a2e 0%, transparent 60%),
                radial-gradient(1000px 600px at 100% 120%, #061b2b 0%, transparent 60%), var(--bg);
    color: var(--txt);
    display: grid;
    place-items: center;
    padding: 32px 16px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Cosmic Aurora Background */
  .aurora {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
    filter: blur(120px); opacity: .3; will-change: transform;
  }
  .blob { position: absolute; border-radius: 50%; mix-blend-mode: screen; will-change: transform; }
  .b1 { width: 600px; height: 600px; background: #4c1d95; top: -200px; left: -150px; animation: drift1 25s ease-in-out infinite; }
  .b2 { width: 500px; height: 500px; background: #0e7490; bottom: -150px; right: -100px; animation: drift2 30s ease-in-out infinite; }
  .b3 { width: 400px; height: 400px; background: #831843; top: 40%; left: 60%; animation: drift3 35s ease-in-out infinite; opacity: .5; }

  @keyframes drift1 { 0%,100% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(100px,80px,0) scale(1.1); } }
  @keyframes drift2 { 0%,100% { transform: translate3d(0,0,0) scale(1.05); } 50% { transform: translate3d(-120px,-60px,0) scale(.95); } }
  @keyframes drift3 { 0%,100% { transform: translate3d(0,0,0) scale(.98); } 50% { transform: translate3d(-80px,90px,0) scale(1.15); } }

  #bg { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* Settings */
  .settings-container { position: fixed; top: 20px; right: 20px; z-index: 100; }
  .settings-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.08);
    color: var(--muted); display: grid; place-items: center;
    cursor: pointer; transition: all .3s; backdrop-filter: blur(10px);
  }
  .settings-btn:hover { color: #fff; background: rgba(255,255,255,.08); transform: rotate(90deg); }
  .settings-btn svg { width: 20px; height: 20px; }

  .settings-menu {
    position: absolute; top: 50px; right: 0; width: 220px;
    background: var(--card-bg); border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px; padding: 16px;
    backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0,0,0,.8);
    opacity: 0; pointer-events: none; transform: translateY(-10px);
    transition: all .3s cubic-bezier(.2,.8,.2,1);
  }
  .settings-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .settings-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  
  .effect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .effect-btn {
    background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.05);
    color: var(--muted); padding: 8px; border-radius: 10px;
    font-size: 12px; cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .effect-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
  .effect-btn.active { background: rgba(192,132,252,.15); border-color: rgba(192,132,252,.4); color: #fff; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--txt); padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  
  .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,.1); transition: .3s; border-radius: 20px; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background-color: var(--secondary); }
  input:checked + .slider:before { transform: translateX(16px); }

  /* Profile Card */
  .wrap { position: relative; z-index: 2; animation: rise 1s cubic-bezier(.2,.85,.25,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.97); filter: blur(6px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

  .card {
    position: relative; width: min(92vw, 380px); border-radius: 28px;
    background: var(--card-bg); border: 1px solid rgba(255,255,255,.06);
    backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 40px 100px -20px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.02) inset, 0 1px 0 rgba(255,255,255,.08) inset;
    transform-style: preserve-3d; transition: transform .4s cubic-bezier(.2,.8,.2,1);
    overflow: hidden; display: flex; flex-direction: column;
  }

  .card::before {
    content: ""; position: absolute; inset: 0; opacity: 0.03; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(400px circle at var(--mx,50%) var(--my,0%), rgba(192,132,252,.12), transparent 60%);
    opacity: 0; transition: opacity .4s; z-index: 0;
  }
  .card:hover::after { opacity: 1; }

  .card-content { position: relative; z-index: 1; padding: 36px 28px 24px; display: flex; flex-direction: column; align-items: center; }

  /* Avatar */
  .avatar { position: relative; width: 100px; height: 100px; margin: 0 auto 20px; transform: translateZ(40px); transition: transform .4s; }
  .card:hover .avatar { transform: translateZ(40px) translateY(-4px); }
  .avatar::before, .avatar::after { content: ""; position: absolute; border-radius: 50%; }
  .avatar::before { inset: -4px; background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--accent), var(--primary)); filter: blur(12px); opacity: .5; animation: spin 10s linear infinite; }
  .avatar::after { inset: -1px; background: conic-gradient(from 0deg, var(--primary), var(--secondary), var(--accent), var(--primary)); animation: spin 10s linear infinite; }
  .avatar-inner { position: absolute; inset: 3px; border-radius: 50%; z-index: 1; background: #020006; overflow: hidden; display: grid; place-items: center; font-size: 40px; font-weight: 700; color: #fff; }
  .avatar-inner img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; filter: brightness(.9); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Profile Info */
  .name-row { display: flex; align-items: center; justify-content: center; gap: 8px; transform: translateZ(26px); }
  .name {
    font-size: 26px; font-weight: 700; letter-spacing: -.03em;
    background: linear-gradient(100deg, #fff 10%, #d8b4fe 40%, #7dd3fc 60%, #fff 90%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: -250% 0; } }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); box-shadow: 0 0 10px var(--secondary); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .tagline { margin-top: 8px; font-size: 13px; color: var(--muted); letter-spacing: .01em; transform: translateZ(18px); }

  /* Socials */
  .socials { display: flex; gap: 10px; justify-content: center; margin: 24px 0 20px; transform: translateZ(22px); }
  .soc {
    width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px;
    color: #8b8fab; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.05);
    text-decoration: none; transition: all .3s cubic-bezier(.2,.8,.2,1);
  }
  .soc:hover { transform: translateY(-3px) scale(1.05); color: #fff; background: rgba(192,132,252,.15); border-color: rgba(192,132,252,.4); box-shadow: 0 8px 20px -8px rgba(192,132,252,.5); }
  .soc svg { width: 18px; height: 18px; }

  /* Player */
  .player-section { width: 100%; margin-top: 8px; transform: translateZ(30px); }
  .now-playing { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 10px; height: 14px; opacity: 0; transition: opacity .3s; }
  .now-playing.visible { opacity: 1; }
  .now-playing span { color: var(--txt); font-weight: 600; }

  .visualizer { display: flex; align-items: flex-end; gap: 2px; height: 10px; opacity: 0; transition: opacity .3s; }
  .now-playing.visible .visualizer { opacity: 1; }
  .visualizer div { width: 3px; background: var(--secondary); border-radius: 2px; height: 100%; transform-origin: bottom; }
  .playing .visualizer div:nth-child(1) { animation: eq .8s ease-in-out infinite alternate; }
  .playing .visualizer div:nth-child(2) { animation: eq .6s ease-in-out infinite alternate .1s; background: var(--primary); }
  .playing .visualizer div:nth-child(3) { animation: eq .9s ease-in-out infinite alternate .2s; }
  .playing .visualizer div:nth-child(4) { animation: eq .7s ease-in-out infinite alternate .15s; background: var(--accent); }
  @keyframes eq { 0% { transform: scaleY(.2); } 100% { transform: scaleY(1); } }

  .player { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.03); box-shadow: inset 0 2px 4px rgba(0,0,0,.1); }
  .music-btn {
    flex-shrink: 0; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
    color: #fff; background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none;
    cursor: pointer; transition: all .2s; box-shadow: 0 4px 12px rgba(192,132,252,.3);
  }
  .music-btn:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(192,132,252,.5); }
  .music-btn:active { transform: scale(.95); }
  .music-btn svg { width: 14px; height: 14px; }
  .music-btn.playing { background: linear-gradient(135deg, var(--accent), var(--primary)); box-shadow: 0 4px 12px rgba(244,114,182,.3); }

  .vol-wrap { flex-grow: 1; display: flex; align-items: center; padding: 0 4px; }
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; height: 16px; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: linear-gradient(to right, var(--primary), var(--secondary), var(--accent)) 0 0 / var(--vol-pct, 50%) 100% no-repeat, rgba(255,255,255,.08); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { height: 12px; width: 12px; border-radius: 50%; background: #fff; cursor: pointer; -webkit-appearance: none; margin-top: -4px; box-shadow: 0 0 8px rgba(255,255,255,.5); transition: transform .2s; }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.2); }
  input[type=range]::-moz-range-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,.08); border-radius: 2px; }
  input[type=range]::-moz-range-progress { height: 4px; background: linear-gradient(to right, var(--primary), var(--secondary), var(--accent)); border-radius: 2px; }
  input[type=range]::-moz-range-thumb { height: 12px; width: 12px; border-radius: 50%; background: #fff; cursor: pointer; border: none; box-shadow: 0 0 8px rgba(255,255,255,.5); transition: transform .2s; }
  input[type=range]:hover::-moz-range-thumb { transform: scale(1.2); }

  .vibe-selector { display: flex; background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.04); border-radius: 12px; padding: 3px; margin-top: 12px; }
  .vibe-btn { flex: 1; background: transparent; border: none; color: var(--muted); font-family: inherit; font-size: 11px; font-weight: 500; padding: 6px 0; border-radius: 9px; cursor: pointer; transition: all .3s; }
  .vibe-btn:hover { color: var(--txt); }
  .vibe-btn.active { color: #fff; background: rgba(255,255,255,.06); box-shadow: 0 2px 8px rgba(0,0,0,.1); }

  /* Context Menu */
  #ctx-menu {
    display: none; position: fixed; z-index: 9999; background: rgba(15, 17, 26, 0.9);
    backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; padding: 6px; min-width: 160px;
    box-shadow: 0 10px 30px rgba(0,0,0,.9); flex-direction: column; gap: 2px;
    animation: ctxIn .15s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes ctxIn { from { opacity: 0; transform: scale(.95) translateY(-5px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .ctx-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: var(--txt); font-size: 12px; font-weight: 500; text-decoration: none; border-radius: 8px; cursor: pointer; transition: background .2s; border: none; background: transparent; width: 100%; text-align: left; font-family: inherit; }
  .ctx-item:hover { background: rgba(192,132,252,.15); }
  .ctx-item svg { width: 14px; height: 14px; opacity: 0.7; }
  .ctx-item:hover svg { opacity: 1; }
  .ctx-sep { height: 1px; background: rgba(255,255,255,.06); margin: 4px 0; }

  @media (max-width:380px) {
    .vibe-btn { font-size: 10px; }
    .settings-container { top: 10px; right: 10px; }
  }
</style>
</head>
<body>

<div class="settings-container">
  <button class="settings-btn" id="settingsBtn" aria-label="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
  
  <div class="settings-menu" id="settingsMenu">
    <div class="settings-title">Фоновый эффект</div>
    <div class="effect-grid">
      <button class="effect-btn active" data-effect="stars">Звезды</button>
      <button class="effect-btn" data-effect="snow">Пыль</button>
      <button class="effect-btn" data-effect="rain">Дождь</button>
      <button class="effect-btn" data-effect="vertices">Созвездия</button>
    </div>
    <div class="toggle-row">
      <span>Звук дождя</span>
      <label class="switch">
        <input type="checkbox" id="rainSoundToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<div id="ctx-menu">
  <button class="ctx-item" onclick="location.reload()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.3L21 8"/></svg>
    Обновить
  </button>
  <button class="ctx-item" id="copyLinkBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    Копировать ссылку
  </button>
  <div class="ctx-sep"></div>
  <a class="ctx-item" href="https://github.com/noclipov" target="_blank">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg>
    GitHub Профиль
  </a>
</div>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<canvas id="bg"></canvas>

<div class="wrap">
  <section class="card" id="card">
    <div class="card-content">
      
      <div class="avatar">
        <div class="avatar-inner">
          <img src="https://github.com/noclipov.png" alt="noclipov" onerror="this.style.display='none'; this.parentElement.innerText='n';">
        </div>
      </div>

      <div class="name-row">
        <h1 class="name">noclipov</h1>
        <div class="status-dot" title="Online"></div>
      </div>
      
      <p class="tagline">where the light fades and echoes remain</p>

      <div class="socials">
        <a class="soc" href="https://github.com/noclipov" aria-label="GitHub" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg>
        </a>
      </div>

      <div class="player-section">
        <div class="now-playing" id="nowPlaying">
          <div class="visualizer"><div></div><div></div><div></div><div></div></div>
          <span id="vibeName">Ambient</span>
        </div>

        <div class="player">
          <button class="music-btn" id="musicBtn" aria-label="Включить музыку">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          
          <div class="vol-wrap">
            <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.5">
          </div>
        </div>

        <div class="vibe-selector">
          <button class="vibe-btn active" data-vibe="ambient">Ambient</button>
          <button class="vibe-btn" data-vibe="deep">Deep Space</button>
          <button class="vibe-btn" data-vibe="rain">Lo-Fi</button>
          <button class="vibe-btn" data-vibe="internet">Stream</button>
        </div>
      </div>

    </div>
  </section>

<!-- ЛОКАЛЬНЫЙ ФАЙЛ (Положите music.mp3 рядом с index.html) -->
<audio id="webAudio" loop crossorigin="anonymous">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
class TiltEffect {
  constructor(element) {
    this.card = element;
    this.isFine = matchMedia("(hover: hover) and (pointer: fine)").matches;
    this.raf = null;
    if (this.isFine) this.bind();
  }
  bind() {
    document.addEventListener("mousemove", this.onMove.bind(this));
    document.addEventListener("mouseleave", this.onLeave.bind(this));
  }
  onMove(e) {
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => {
      const r = this.card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;
      this.card.style.transform = `perspective(1000px) rotateX(${((0.5 - ny) * 6).toFixed(2)}deg) rotateY(${((nx - 0.5) * 8).toFixed(2)}deg)`;
      this.card.style.setProperty("--mx", `${(nx * 100).toFixed(1)}%`);
      this.card.style.setProperty("--my", `${(ny * 100).toFixed(1)}%`);
      this.raf = null;
    });
  }
  onLeave() {
    this.card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)";
    this.card.style.setProperty("--mx", "50%");
    this.card.style.setProperty("--my", "0%");
  }
}

class BackgroundEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d", { alpha: true });
    this.w = 0; this.h = 0;
    this.particles = [];
    this.effect = 'stars';
    this.animId = null;
    this.isActive = true;

    this.resize = this.resize.bind(this);
    this.draw = this.draw.bind(this);

    window.addEventListener('resize', this.resize);
    document.addEventListener("visibilitychange", () => {
      this.isActive = !document.hidden;
      if (this.isActive) this.loop();
    });

    this.resize();
    this.loop();
  }

  resize() {
    this.w = this.canvas.width = Math.floor(innerWidth * Math.min(window.devicePixelRatio || 1, 2));
    this.h = this.canvas.height = Math.floor(innerHeight * Math.min(window.devicePixelRatio || 1, 2));
    this.canvas.style.width = innerWidth + "px";
    this.canvas.style.height = innerHeight + "px";
    this.initParticles();
  }

  setEffect(mode) {
    this.effect = mode;
    this.initParticles();
    this.loop();
  }

  initParticles() {
    this.particles = [];
    let count = 0;
    if (this.effect === 'rain') count = Math.min(120, Math.max(50, innerWidth / 12));
    else if (this.effect === 'vertices') count = Math.min(45, Math.max(20, innerWidth / 30));
    else count = Math.min(100, Math.max(40, innerWidth / 15)); // Больше звезд

    for (let i = 0; i < count; i++) {
      this.particles.push({
        x: Math.random() * this.w,
        y: Math.random() * this.h,
        vx: (Math.random() - 0.5) * (this.effect === 'vertices' ? 0.3 : 0.05) * (innerWidth / 1000),
        vy: (this.effect === 'rain' ? (Math.random() * 15 + 10) : (this.effect === 'snow' ? (Math.random() * 0.3 + 0.1) : -(Math.random() * 0.1 + 0.02))) * (innerWidth / 1000),
        r: (Math.random() * 1.5 + 0.5) * (this.effect === 'snow' ? 1.5 : 1),
        a: Math.random() * 0.6 + 0.2,
        ph: Math.random() * Math.PI * 2,
        sp: Math.random() * 0.02 + 0.005,
        color: Math.random() > 0.5 ? '192,132,252' : (Math.random() > 0.5 ? '56,189,248' : '255,255,255')
      });
    }
  }

  draw() {
    this.ctx.clearRect(0, 0, this.w, this.h);
    
    for (let i = 0; i < this.particles.length; i++) {
      let p = this.particles[i];
      
      if (this.effect === 'snow') {
        p.ph += p.sp;
        p.x += p.vx + Math.sin(p.ph) * 0.3;
        p.y += p.vy;
      } else if (this.effect === 'rain') {
        p.x += p.vx;
        p.y += p.vy;
      } else if (this.effect === 'vertices') {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > this.w) p.vx *= -1;
        if (p.y < 0 || p.y > this.h) p.vy *= -1;
      } else {
        p.ph += p.sp;
        p.x += p.vx;
        p.y += p.vy;
      }

      if (p.y > this.h + 20) { p.y = -20; p.x = Math.random() * this.w; }
      if (p.y < -20) { p.y = this.h + 20; p.x = Math.random() * this.w; }
      if (p.x < -20) p.x = this.w + 20;
      if (p.x > this.w + 20) p.x = -20;

      if (this.effect === 'rain') {
        const gradient = this.ctx.createLinearGradient(p.x, p.y, p.x, p.y + 30);
        gradient.addColorStop(0, 'rgba(56,189,248,0)');
        gradient.addColorStop(1, 'rgba(56,189,248,0.5)');
        this.ctx.strokeStyle = gradient;
        this.ctx.lineWidth = 1.5;
        this.ctx.beginPath();
        this.ctx.moveTo(p.x, p.y);
        this.ctx.lineTo(p.x, p.y + 30);
        this.ctx.stroke();
      } else if (this.effect === 'snow') {
        this.ctx.fillStyle = `rgba(${p.color}, 0.6)`;
        this.ctx.shadowBlur = 10;
        this.ctx.shadowColor = `rgba(${p.color}, 0.5)`;
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        this.ctx.fill();
      } else if (this.effect === 'stars') {
        const alpha = p.a * (0.5 + 0.5 * Math.sin(p.ph));
        this.ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
        this.ctx.shadowBlur = 8;
        this.ctx.shadowColor = `rgba(${p.color}, 0.5)`;
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        this.ctx.fill();
      } else if (this.effect === 'vertices') {
        this.ctx.fillStyle = 'rgba(192,132,252,0.7)';
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        this.ctx.fill();
        
        for (let j = i + 1; j < this.particles.length; j++) {
          let p2 = this.particles[j];
          let dx = p.x - p2.x;
          let dy = p.y - p2.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < this.w * 0.15) {
            this.ctx.beginPath();
            this.ctx.moveTo(p.x, p.y);
            this.ctx.lineTo(p2.x, p2.y);
            this.ctx.strokeStyle = `rgba(192,132,252,${0.2 * (1 - dist / (this.w * 0.15))})`;
            this.ctx.lineWidth = 0.8;
            this.ctx.stroke();
          }
        }
      }
    }
    
    this.ctx.shadowBlur = 0;
    if (this.isActive) this.animId = requestAnimationFrame(this.draw);
  }

  loop() {
    cancelAnimationFrame(this.animId);
    if (this.isActive) this.draw();
  }
}

class AudioEngine {
  constructor() {
    this.ac = null;
    this.master = null;
    this.musicGain = null;
    this.rainGain = null;
    this.sendBus = null;
    this.playing = false;
    this.playingRain = false;
    this.vibe = "ambient";
    this.chordTimer = null;
    this.noteTimer = null;
    this.dropTimer = null;
    this.step = 0;
    this.oscs = [];
    this.noiseBuffer = null;
    
    this.webAudio = document.getElementById('webAudio');
    this.vibeName = document.getElementById('vibeName');
    
    this.vibes = {
      ambient: { name: "Ambient", chords: [[174.61, 220.00, 261.63, 329.63], [130.81, 164.81, 196.00, 246.94], [196.00, 246.94, 293.66, 349.23], [146.83, 174.61, 220.00, 261.63]], scale: [523.25, 587.33, 659.25, 783.99, 880.00], filter: 1800, dur: 12, cInt: 10000, bInt: 3500 },
      deep: { name: "Deep Space", chords: [[110.00, 130.81, 164.81, 196.00], [87.31, 110.00, 130.81, 155.56], [98.00, 123.47, 146.83, 174.61], [116.54, 146.83, 174.61, 207.65]], scale: [261.63, 293.66, 329.63, 392.00, 440.00], filter: 800, dur: 16, cInt: 12000, bInt: 6000 },
      rain: { name: "Lo-Fi Rain", chords: [[146.83, 174.61, 220.00, 261.63], [130.81, 164.81, 196.00, 233.08], [110.00, 130.81, 164.81, 196.00], [98.00, 123.47, 146.83, 174.61]], scale: [440.00, 523.25, 587.33, 659.25, 783.99], filter: 1200, dur: 10, cInt: 8000, bInt: 2000 },
      internet: { name: "Local Stream" }
    };
  }

  init() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC();

    this.master = this.ac.createGain();
    this.musicGain = this.ac.createGain();
    this.rainGain = this.ac.createGain();
    
    this.musicGain.gain.value = parseFloat(document.getElementById('volSlider').value) * 0.35;
    this.rainGain.gain.value = 0;

    this.master.connect(this.ac.destination);
    this.musicGain.connect(this.master);
    this.rainGain.connect(this.master);

    const delay = this.ac.createDelay(1.5);
    delay.delayTime.value = 0.5;
    const fb = this.ac.createGain(); fb.gain.value = 0.4;
    const damp = this.ac.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 1200;
    const wet = this.ac.createGain(); wet.gain.value = 0.5;

    delay.connect(damp);
    damp.connect(fb); fb.connect(delay);
    damp.connect(wet); wet.connect(this.musicGain);
    this.sendBus = delay;

    this.buildRain();
  }

  buildRain() {
    // 1. Создаем буфер белого шума
    const bufferSize = this.ac.sampleRate * 2;
    this.noiseBuffer = this.ac.createBuffer(1, bufferSize, this.ac.sampleRate);
    const data = this.noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    // 2. Базовый гул (Pink Noise имитация)
    const rainNode = this.ac.createBufferSource();
    rainNode.buffer = this.noiseBuffer;
    rainNode.loop = true;
    
    const lp = this.ac.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 500;
    
    const noiseVol = this.ac.createGain();
    noiseVol.gain.value = 0.1;
    
    rainNode.connect(lp);
    lp.connect(noiseVol);
    noiseVol.connect(this.rainGain);
    rainNode.start(0);

    // 3. Шипение (High frequency hiss)
    const hissNode = this.ac.createBufferSource();
    hissNode.buffer = this.noiseBuffer;
    hissNode.loop = true;
    
    const bp = this.ac.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 4000; bp.Q.value = 0.5;
    
    const hissVol = this.ac.createGain();
    hissVol.gain.value = 0.05;
    
    hissNode.connect(bp);
    bp.connect(hissVol);
    hissVol.connect(this.rainGain);
    hissNode.start(0);
  }

  playDrop() {
    if (!this.ac || this.rainGain.gain.value === 0) return;
    const t0 = this.ac.currentTime;
    
    // Реалистичная капля: короткий всплеск шума с фильтрацией
    const dropNode = this.ac.createBufferSource();
    dropNode.buffer = this.noiseBuffer;
    
    const bp = this.ac.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(800 + Math.random() * 1200, t0);
    bp.Q.value = 1.5;
    
    const gain = this.ac.createGain();
    // Резкая атака и быстрое затухание
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.4 + Math.random() * 0.2, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1 + Math.random() * 0.1);

    dropNode.connect(bp);
    bp.connect(gain);
    gain.connect(this.rainGain);
    
    dropNode.start(t0);
    dropNode.stop(t0 + 0.3);
  }

  startRainDrops() {
    if (!this.playingRain) return;
    this.playDrop();
    // Случайный интервал между каплями (30 - 150 мс)
    const nextDrop = 30 + Math.random() * 120;
    this.dropTimer = setTimeout(() => this.startRainDrops(), nextDrop);
  }

  playChord(freqs, dur) {
    const t0 = this.ac.currentTime + 0.05;
    freqs.forEach((f, i) => {
      const osc1 = this.ac.createOscillator();
      const osc2 = this.ac.createOscillator();
      osc1.type = osc2.type = "sine";
      osc1.frequency.value = f;
      osc2.frequency.value = f + 0.5; 
      
      this.oscs.push(osc1, osc2);

      const g = this.ac.createGain();
      const peak = 0.12 / (1 + i * 0.3);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 4.0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      const pan = this.ac.createStereoPanner ? this.ac.createStereoPanner() : null;
      if (pan) {
        pan.pan.value = (i % 2 ? 0.5 : -0.5);
        osc1.connect(g); osc2.connect(g);
        g.connect(pan); pan.connect(this.musicGain); pan.connect(this.sendBus);
      } else {
        osc1.connect(g); osc2.connect(g);
        g.connect(this.musicGain); g.connect(this.sendBus);
      }
      
      osc1.start(t0); osc2.start(t0);
      osc1.stop(t0 + dur + 0.5); osc2.stop(t0 + dur + 0.5);
    });
  }

  playBell(scale) {
    const t0 = this.ac.currentTime + 0.05;
    const f = scale[Math.floor(Math.random() * scale.length)];
    const osc = this.ac.createOscillator();
    osc.type = "sine"; 
    osc.frequency.value = f;
    this.oscs.push(osc);

    const env = this.ac.createGain();
    env.gain.setValueAtTime(0.0001, t0);
    env.gain.exponentialRampToValueAtTime(0.04, t0 + 0.5);
    env.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.5);

    osc.connect(env);
    env.connect(this.musicGain);
    env.connect(this.sendBus);
    
    osc.start(t0); osc.stop(t0 + 4.0);
  }

  killMusic() {
    this.oscs.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
    this.oscs = [];
    if (this.musicGain) this.musicGain.gain.cancelScheduledValues(this.ac.currentTime);
  }

  startGen() {
    this.init();
    if (this.ac.state === "suspended") this.ac.resume();
    this.playing = true;
    this.step = 0;
    const cfg = this.vibes[this.vibe];

    const now = this.ac.currentTime;
    this.musicGain.gain.cancelScheduledValues(now);
    this.musicGain.gain.setValueAtTime(0.0001, now);
    this.musicGain.gain.linearRampToValueAtTime(parseFloat(document.getElementById('volSlider').value) * 0.35, now + 2.0);

    this.playChord(cfg.chords[0], cfg.dur);
    this.step = 1;

    this.chordTimer = setInterval(() => {
      this.playChord(cfg.chords[this.step % cfg.chords.length], cfg.dur);
      this.step++;
    }, cfg.cInt);

    this.noteTimer = setInterval(() => {
      if (Math.random() < 0.6) this.playBell(cfg.scale);
    }, cfg.bInt);
  }

  stopGen() {
    this.playing = false;
    clearInterval(this.chordTimer);
    clearInterval(this.noteTimer);
    
    if (!this.ac) return;
    const now = this.ac.currentTime;
    this.musicGain.gain.cancelScheduledValues(now);
    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, now);
    this.musicGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
    
    setTimeout(() => this.killMusic(), 200);
  }

  setVibe(vibe) {
    const wasPlaying = this.playing || !this.webAudio.paused;
    this.stopGen();
    this.webAudio.pause();
    this.vibe = vibe;
    this.vibeName.textContent = this.vibes[vibe].name;

    if (wasPlaying) {
      setTimeout(() => {
        if (this.vibe === 'internet') {
          this.webAudio.volume = parseFloat(document.getElementById('volSlider').value);
          this.webAudio.play().catch(e => {
            console.log("Локальный файл music.mp3 не найден. Переключаюсь на Ambient.");
            UI.handleStreamError();
          });
          UI.updatePlayState(true);
        } else {
          this.startGen();
          UI.updatePlayState(true);
        }
      }, 250);
    } else {
      UI.updatePlayState(false);
    }
  }

  toggleRain(isOn) {
    this.init();
    if (this.ac.state === "suspended") this.ac.resume();
    
    const now = this.ac.currentTime;
    this.rainGain.gain.cancelScheduledValues(now);
    this.rainGain.gain.setValueAtTime(this.rainGain.gain.value, now);
    
    if (isOn) {
      this.playingRain = true;
      this.rainGain.gain.linearRampToValueAtTime(0.4, now + 2.0);
      this.startRainDrops();
    } else {
      this.playingRain = false;
      this.rainGain.gain.linearRampToValueAtTime(0.0001, now + 1.5);
      clearTimeout(this.dropTimer);
    }
  }

  togglePlay() {
    if (this.vibe === 'internet') {
      if (this.webAudio.paused) {
        this.webAudio.volume = parseFloat(document.getElementById('volSlider').value);
        this.webAudio.play().catch(e => {
          console.log("Локальный файл music.mp3 не найден.");
          UI.handleStreamError();
        });
        return true;
      } else {
        this.webAudio.pause();
        return false;
      }
    } else {
      if (this.playing) { this.stopGen(); return false; }
      this.startGen(); return true;
    }
  }

  setVolume(val) {
    if (this.vibe === 'internet') {
      this.webAudio.volume = val;
    } else {
      if (!this.ac) return;
      this.musicGain.gain.setTargetAtTime(val * 0.35, this.ac.currentTime, 0.1);
    }
  }
}

const UI = {
  init() {
    this.engine = new AudioEngine();
    this.bg = new BackgroundEngine(document.getElementById('bg'));
    new TiltEffect(document.getElementById('card'));

    this.els = {
      settingsBtn: document.getElementById('settingsBtn'),
      settingsMenu: document.getElementById('settingsMenu'),
      rainToggle: document.getElementById('rainSoundToggle'),
      musicBtn: document.getElementById('musicBtn'),
      iconPlay: document.getElementById('iconPlay'),
      iconPause: document.getElementById('iconPause'),
      volSlider: document.getElementById('volSlider'),
      nowPlaying: document.getElementById('nowPlaying'),
      vibeBtns: document.querySelectorAll('.vibe-btn'),
      effectBtns: document.querySelectorAll('.effect-btn'),
      ctxMenu: document.getElementById('ctx-menu'),
      copyLinkBtn: document.getElementById('copyLinkBtn'),
      webAudio: document.getElementById('webAudio')
    };

    this.bindEvents();
    this.handleVolume();
    this.els.nowPlaying.classList.add("visible");
  },

  handleStreamError() {
    // Если файла нет, переключаем на Ambient
    this.els.vibeBtns.forEach(b => b.classList.remove('active'));
    document.querySelector('[data-vibe="ambient"]').classList.add('active');
    this.engine.setVibe('ambient');
    this.engine.startGen();
    this.updatePlayState(true);
  },

  bindEvents() {
    const { els, engine, bg } = this;

    els.settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      els.settingsMenu.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!els.settingsMenu.contains(e.target) && e.target !== els.settingsBtn) {
        els.settingsMenu.classList.remove('open');
      }
    });

    els.effectBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        els.effectBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        bg.setEffect(e.target.dataset.effect);
      });
    });

    els.rainToggle.addEventListener('change', (e) => engine.toggleRain(e.target.checked));

    els.musicBtn.addEventListener('click', () => {
      const isOn = engine.togglePlay();
      this.updatePlayState(isOn);
    });

    els.vibeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        els.vibeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        engine.setVibe(btn.dataset.vibe);
      });
    });

    els.volSlider.addEventListener('input', () => this.handleVolume());

    // Если браузер не может найти/воспроизвести music.mp3
    els.webAudio.addEventListener('error', () => {
      if (this.engine.vibe === 'internet') this.handleStreamError();
    });

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      els.ctxMenu.style.display = "flex";
      let x = e.clientX, y = e.clientY;
      if (x + 180 > window.innerWidth) x -= 180;
      if (y + 140 > window.innerHeight) y -= 140;
      els.ctxMenu.style.left = `${x}px`;
      els.ctxMenu.style.top = `${y}px`;
    });
    document.addEventListener("click", (e) => {
      if (!els.ctxMenu.contains(e.target)) els.ctxMenu.style.display = "none";
    });
    
    els.copyLinkBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      const original = els.copyLinkBtn.innerHTML;
      els.copyLinkBtn.innerText = 'Скопировано!';
      setTimeout(() => els.copyLinkBtn.innerHTML = original, 2000);
    });
  },

  handleVolume() {
    const val = this.els.volSlider.value;
    this.els.volSlider.style.setProperty('--vol-pct', `${val * 100}%`);
    this.engine.setVolume(val);
  },

  updatePlayState(isPlaying) {
    if (isPlaying) {
      this.els.musicBtn.classList.add("playing");
      this.els.nowPlaying.classList.add("visible", "playing");
      this.els.iconPlay.style.display = "none";
      this.els.iconPause.style.display = "block";
    } else {
      this.els.musicBtn.classList.remove("playing");
      this.els.nowPlaying.classList.remove("playing");
      this.els.nowPlaying.classList.add("visible");
      this.els.iconPlay.style.display = "block";
      this.els.iconPause.style.display = "none";
    }
  }
};

document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
