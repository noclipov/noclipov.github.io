<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noclipov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#7c3aed;
    --cyan:#0891b2;
    --pink:#db2777;
    --txt:#c5c7df;
    --muted:#7a7d96;
    --bg:#030408;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  /* ---------- КАСТОМНЫЙ СКРОЛЛБАР ---------- */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg);
  }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--violet), var(--cyan));
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--pink), var(--violet));
  }
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--violet) var(--bg);
  }

  html,body{ height:100%; }

  body{
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background:
      radial-gradient(1000px 600px at 50% -10%, #111422 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 110%, #0a121d 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    display:grid;
    place-items:center;
    padding:32px 16px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ФОН (менее яркий) ---------- */
  .aurora{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    filter:blur(100px); opacity:.35; /* Снижена яркость */
  }
  .blob{ position:absolute; border-radius:50%; mix-blend-mode:screen; will-change:transform; }
  .b1{ width:500px; height:500px; background:#4c1d95; top:-150px; left:-100px; animation:drift1 22s ease-in-out infinite; }
  .b2{ width:450px; height:450px; background:#164e63; bottom:-150px; right:-100px; animation:drift2 28s ease-in-out infinite; }
  .b3{ width:380px; height:380px; background:#831843; top:45%; left:65%; animation:drift3 34s ease-in-out infinite; opacity:.6; }

  @keyframes drift1{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%    { transform:translate3d(100px,60px,0) scale(1.1); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate3d(0,0,0) scale(1.05); }
    50%    { transform:translate3d(-120px,-60px,0) scale(.95); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate3d(0,0,0) scale(.98); }
    50%    { transform:translate3d(-80px,90px,0) scale(1.15); }
  }

  #bg{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- КАРТОЧКА ---------- */
  .wrap{ position:relative; z-index:2; animation:rise 1s cubic-bezier(.2,.85,.25,1) both; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(34px) scale(.96); filter:blur(8px); }
    to  { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }

  .card{
    position:relative;
    width:min(92vw, 360px);
    padding:40px 32px 28px;
    border-radius:32px;
    background:linear-gradient(165deg, rgba(255,255,255,.04), rgba(255,255,255,.01) 40%, rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    backdrop-filter:blur(24px) saturate(140%);
    box-shadow:
      0 40px 100px -20px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.02) inset,
      0 1px 0 rgba(255,255,255,.06) inset;
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
    text-align:center;
  }

  .card::before{
    content:"";
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%), rgba(124,58,237,.12), transparent 65%);
    opacity:0; transition:opacity .45s;
  }
  .card:hover::before{ opacity:1; }

  .card::after{
    content:"";
    position:absolute; left:20%; right:20%; top:-1px; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(139,92,246,.5), rgba(8,145,178,.4), transparent);
    filter:blur(.5px); opacity:.6;
  }

  /* ---------- АВАТАР ---------- */
  .avatar{
    position:relative;
    width:104px; height:104px;
    margin:0 auto 24px;
    transform:translateZ(40px);
  }
  .avatar::before{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    filter:blur(12px); opacity:.4;
    animation:spin 12s linear infinite;
  }
  .avatar::after{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    animation:spin 12s linear infinite;
  }
  .avatar-inner{
    position:absolute; inset:3px; border-radius:50%; z-index:1;
    background:#0a0b16;
    overflow:hidden;
    display:grid; place-items:center;
    font-size:40px; font-weight:700;
    color:#fff;
    text-shadow:0 0 20px rgba(139,92,246,.8);
  }
  .avatar-inner img{
    width:100%; height:100%; object-fit:cover;
    border-radius:50%;
    filter: brightness(.9); /* Чуть приглушаем аватарку */
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- ПРОФИЛЬ ---------- */
  .name-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    transform:translateZ(26px);
  }

  .name{
    font-size:28px;
    font-weight:700;
    letter-spacing:-.03em;
    background:linear-gradient(100deg, #d1d5db 10%, #a78bfa 40%, #22d3ee 60%, #d1d5db 90%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    animation:shimmer 7s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-250% 0; } }

  .status-dot{
    width:10px; height:10px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow: 0 0 10px var(--cyan), 0 0 16px rgba(8,145,178,.3);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(.85); opacity:.6; }
  }

  .tagline{
    margin-top:10px;
    font-size:13px;
    line-height:1.6;
    color:var(--muted);
    letter-spacing:.01em;
    transform:translateZ(18px);
  }

  /* ---------- СОЦ-КНОПКИ ---------- */
  .socials{
    display:flex; gap:12px; justify-content:center;
    margin:28px 0 24px;
    transform:translateZ(22px);
  }
  .soc{
    width:44px; height:44px;
    display:grid; place-items:center;
    border-radius:15px;
    color:#8b8fab;
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);
    text-decoration:none;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), color .3s, background .3s, border-color .3s, box-shadow .3s;
  }
  .soc:hover{
    transform:translateY(-3px) scale(1.04);
    color:#fff;
    background:rgba(8,145,178,.1);
    border-color:rgba(8,145,178,.3);
    box-shadow:0 8px 24px -10px rgba(8,145,178,.6);
  }
  .soc:active{ transform:translateY(-1px) scale(.98); }
  .soc svg{ width:19px; height:19px; }

  /* ---------- АУДИО-ПЛЕЕР ---------- */
  .player-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    transform: translateZ(30px);
    width: 100%;
  }

  .player{
    display:flex; align-items:center; gap:12px;
    padding:10px 14px;
    border-radius:16px;
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);
    transition:border-color .3s, background .3s;
  }
  .player:hover{
    background:rgba(255,255,255,.04);
    border-color:rgba(255,255,255,.08);
  }

  .music-btn{
    flex-shrink:0;
    width:34px; height:34px;
    display:grid; place-items:center;
    border-radius:50%;
    color:#cfd2e8;
    background:linear-gradient(135deg, rgba(124,58,237,.15), rgba(8,145,178,.1));
    border:1px solid rgba(139,92,246,.2);
    cursor:pointer;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  .music-btn:hover{
    color:#fff;
    border-color:rgba(139,92,246,.6);
    box-shadow:0 0 16px rgba(124,58,237,.3);
    transform:scale(1.05);
  }
  .music-btn:active{ transform:scale(.95); }
  .music-btn svg{ width:14px; height:14px; margin-left:2px; }
  .music-btn.playing svg{ margin-left:0; }

  /* ПОЛЗУНОК ГРОМКОСТИ (Градиент, без потери цвета) */
  .vol-wrap{
    flex-grow:1;
    display:flex; align-items:center;
  }
  
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    background:transparent;
    height: 20px;
    display: flex;
    align-items: center;
  }
  input[type=range]:focus{ outline:none; }
  
  /* Стили для дорожки (Webkit) */
  input[type=range]::-webkit-slider-runnable-track{
    width:100%;
    height:4px;
    cursor:pointer;
    /* Используем кастомное свойство --vol-pct, заданное через JS */
    background: linear-gradient(to right, var(--violet), var(--cyan), var(--pink)) 0 0 / var(--vol-pct, 50%) 100% no-repeat, rgba(255,255,255,.08);
    border-radius:2px;
  }
  
  input[type=range]::-webkit-slider-thumb{
    height:12px;
    width:12px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    -webkit-appearance:none;
    margin-top:-4px;
    box-shadow:0 0 10px rgba(139,92,246,.6);
    transition:transform .2s, box-shadow .2s;
  }
  /* Убираем изменение цвета фона при наведении, делаем только свечение */
  input[type=range]:hover::-webkit-slider-thumb{
    transform:scale(1.2);
    box-shadow:0 0 16px rgba(34,211,238,.8);
  }

  /* Стили для дорожки (Firefox) */
  input[type=range]::-moz-range-track{
    width:100%;
    height:4px;
    cursor:pointer;
    background:rgba(255,255,255,.08);
    border-radius:2px;
  }
  input[type=range]::-moz-range-progress {
    height:4px;
    background: linear-gradient(to right, var(--violet), var(--cyan), var(--pink));
    border-radius:2px;
  }
  input[type=range]::-moz-range-thumb{
    height:12px;
    width:12px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    border:none;
    box-shadow:0 0 10px rgba(139,92,246,.6);
    transition:transform .2s, box-shadow .2s;
  }
  input[type=range]:hover::-moz-range-thumb{
    transform:scale(1.2);
    box-shadow:0 0 16px rgba(34,211,238,.8);
  }

  /* Селектор настроения (Vibe) */
  .vibe-selector {
    display: flex;
    justify-content: center;
    gap: 6px;
  }
  .vibe-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,.05);
    color: var(--muted);
    font-family: inherit;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .3s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .vibe-btn:hover {
    color: var(--txt);
    border-color: rgba(255,255,255,.15);
  }
  .vibe-btn.active {
    color: #fff;
    background: rgba(255,255,255,.06);
    border-color: rgba(139,92,246,.4);
    box-shadow: 0 0 10px rgba(124,58,237,.2);
  }

  /* ---------- КАСТОМНОЕ КОНТЕКСТНОЕ МЕНЮ ---------- */
  #ctx-menu {
    display: none;
    position: fixed;
    z-index: 9999;
    background: rgba(15, 17, 26, 0.85);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 6px;
    min-width: 160px;
    box-shadow: 0 10px 30px rgba(0,0,0,.8);
    flex-direction: column;
    gap: 2px;
    animation: ctxIn 0.15s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes ctxIn {
    from { opacity: 0; transform: scale(0.95) translateY(-5px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .ctx-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    color: var(--txt);
    font-size: 12.5px;
    font-weight: 500;
    text-decoration: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .2s, color .2s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .ctx-item:hover {
    background: rgba(124, 58, 237, 0.2);
    color: #fff;
  }
  .ctx-item svg { width: 14px; height: 14px; opacity: 0.7; }
  .ctx-item:hover svg { opacity: 1; }
  .ctx-sep { height: 1px; background: rgba(255,255,255,.05); margin: 4px 0; }

  /* ---------- АДАПТИВ ---------- */
  @media (max-width:420px){
    .card{ padding:32px 24px 24px; border-radius:26px; }
    .name{ font-size:25px; }
    .avatar{ width:92px; height:92px; }
    .socials{ margin:24px 0 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

</div>

<div class="aurora">

  <div class="blob b2"></div>

<div class="wrap">

    <!-- Улучшенный плеер с вариациями -->
    <div class="player-container">
      <div class="player">
        <button class="music-btn" id="musicBtn" aria-label="Включить музыку">

  </section>
</div>

<!-- Аудио элемент для стриминга из интернета -->
<audio id="webAudio" loop crossorigin="anonymous">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">

<script>
(() => {
  "use strict";

  /* =========================================================
     1. КАСТОМНОЕ КОНТЕКСТНОЕ МЕНЮ
     ========================================================= */
  const ctxMenu = document.getElementById("ctx-menu");

  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    ctxMenu.style.display = "flex";
    
    // Позиционирование, чтобы меню не уходило за экран
    const menuWidth = 180;
    const menuHeight = 140;
    let x = e.clientX;
    let y = e.clientY;

    if (x + menuWidth > window.innerWidth) x -= menuWidth;
    if (y + menuHeight > window.innerHeight) y -= menuHeight;

    ctxMenu.style.left = `${x}px`;
    ctxMenu.style.top = `${y}px`;
  });

  document.addEventListener("click", (e) => {
    if (!ctxMenu.contains(e.target)) {
      ctxMenu.style.display = "none";
    }
  });

  /* =========================================================
     2. ЧАСТИЦЫ НА ФОНЕ
     ========================================================= */
  const canvas = document.getElementById("bg");
  const c2d = canvas.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, parts = [];

  function resizeCanvas() {
    W = canvas.width  = Math.floor(innerWidth  * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width  = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    const count = Math.round(Math.min(70, Math.max(30, innerWidth / 20)));
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (Math.random() * 1.1 + 0.4) * DPR,
      vy: -(Math.random() * 0.12 + 0.03) * DPR,
      vx: (Math.random() - 0.5) * 0.06 * DPR,
      a: Math.random() * 0.35 + 0.1, // Сделали частицы тусклее
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.01 + 0.002
    }));
  }

  function drawStars() {
    c2d.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.ph += p.sp;
      if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      const alpha = p.a * (0.6 + 0.4 * Math.sin(p.ph));
      c2d.beginPath();
      c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c2d.fillStyle = "rgba(180,190,230," + alpha.toFixed(3) + ")";
      c2d.shadowBlur = 8 * DPR;
      c2d.shadowColor = "rgba(124,58,237,0.5)";
      c2d.fill();
    }
    c2d.shadowBlur = 0;
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  drawStars();
  addEventListener("resize", resizeCanvas);

  /* =========================================================
     3. 3D-НАКЛОН
     ========================================================= */
  const card = document.getElementById("card");
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let raf = null;

  function move(e) {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;

      const rx = (0.5 - ny) * 7;
      const ry = (nx - 0.5) * 9;

      card.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      card.style.setProperty("--mx", (nx * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (ny * 100).toFixed(1) + "%");
    });
  }

  function reset() {
    card.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg)";
    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "0%");
  }

  if (fine) {
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseleave", reset);
  }

  /* =========================================================
     4. МУЗЫКА (Генератор + Стрим)
     ========================================================= */
  const webAudio = document.getElementById('webAudio');
  
  const Music = (() => {
    let ac = null;
    let masterGain = null;
    let volumeGain = null;
    let sendBus = null;
    let playing = false;
    let chordTimer = null;
    let noteTimer = null;
    let step = 0;
    let currentVibe = "ambient";

    // Конфигурации для разных вайбов
    const VIBES = {
      ambient: {
        chords: [[174.61, 220.00, 261.63], [130.81, 164.81, 196.00], [196.00, 246.94, 293.66], [146.83, 174.61, 220.00]],
        scale: [523.25, 587.33, 659.25, 783.99, 880.00],
        filter: 1800,
        chordDur: 10.0,
        chordInt: 8000,
        bellInt: 3500
      },
      deep: {
        chords: [[110.00, 130.81, 164.81], [87.31, 110.00, 130.81], [98.00, 123.47, 146.83], [116.54, 146.83, 174.61]],
        scale: [261.63, 293.66, 329.63, 392.00, 440.00],
        filter: 800, // Очень глухой звук
        chordDur: 14.0,
        chordInt: 10000,
        bellInt: 6000
      },
      rain: {
        chords: [[146.83, 174.61, 220.00], [130.81, 164.81, 196.00], [110.00, 130.81, 164.81], [98.00, 123.47, 146.83]],
        scale: [440.00, 523.25, 587.33, 659.25, 783.99],
        filter: 1200,
        chordDur: 8.0,
        chordInt: 6000,
        bellInt: 2000
      }
    };

    function init() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();

      masterGain = ac.createGain();
      masterGain.gain.value = 0;

      volumeGain = ac.createGain();
      volumeGain.gain.value = parseFloat(document.getElementById('volSlider').value) * 0.35;

      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = VIBES[currentVibe].filter;
      lp.Q.value = 0.2;

      masterGain.connect(lp);
      lp.connect(volumeGain);
      volumeGain.connect(ac.destination);

      const delay = ac.createDelay(1.5);
      delay.delayTime.value = currentVibe === 'deep' ? 0.9 : 0.5;
      
      const fb = ac.createGain();
      fb.gain.value = 0.4;

      const damp = ac.createBiquadFilter();
      damp.type = "lowpass";
      damp.frequency.value = 1000;

      const wet = ac.createGain();
      wet.gain.value = 0.6;

      delay.connect(damp);
      damp.connect(fb);
      fb.connect(delay);
      damp.connect(wet);
      wet.connect(masterGain);

      sendBus = delay;
    }

    function playChord(freqs, dur) {
      const t0 = ac.currentTime + 0.1;
      
      freqs.forEach((f, i) => {
        const osc = ac.createOscillator();
        osc.type = "sine";
        osc.frequency.value = f;

        const g = ac.createGain();
        const peak = 0.15 / (1 + i * 0.5);

        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 4.0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
        if (pan) {
          pan.pan.value = (i % 2 ? 0.6 : -0.6);
          osc.connect(g); g.connect(pan); pan.connect(masterGain); pan.connect(sendBus);
        } else {
          osc.connect(g); g.connect(masterGain); g.connect(sendBus);
        }

        osc.start(t0);
        osc.stop(t0 + dur + 0.5);
      });
    }

    function playBell(scale) {
      const t0 = ac.currentTime + 0.05;
      const f = scale[Math.floor(Math.random() * scale.length)];

      const o1 = ac.createOscillator();
      o1.type = "sine";
      o1.frequency.value = f;

      const env = ac.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(0.03, t0 + 0.8);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.0);

      o1.connect(env);
      env.connect(masterGain);
      env.connect(sendBus);

      o1.start(t0); o1.stop(t0 + 4.5);
    }

    function startGen() {
      init();
      if (ac.state === "suspended") ac.resume();

      playing = true;
      step = 0;
      const cfg = VIBES[currentVibe];

      const now = ac.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
      masterGain.gain.linearRampToValueAtTime(1.0, now + 3.0);

      playChord(cfg.chords[0], cfg.chordDur);
      step = 1;

      chordTimer = setInterval(() => {
        playChord(cfg.chords[step % cfg.chords.length], cfg.chordDur);
        step++;
      }, cfg.chordInt);

      noteTimer = setInterval(() => {
        if (Math.random() < 0.6) playBell(cfg.scale);
      }, cfg.bellInt);
    }

    function stopGen() {
      playing = false;
      clearInterval(chordTimer);
      clearInterval(noteTimer);
      chordTimer = noteTimer = null;

      if (!ac) return;
      const now = ac.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 2.0);
    }

    function setVibe(vibe) {
      currentVibe = vibe;
      if (playing) {
        // Если играет, мягко останавливаем и запускаем новый
        const wasPlaying = playing;
        stopGen();
        webAudio.pause();
        if (wasPlaying) {
          setTimeout(() => startGen(), 1000);
        }
      }
    }

    return {
      toggle() {
        if (currentVibe === 'internet') {
          if (webAudio.paused) {
            webAudio.volume = parseFloat(document.getElementById('volSlider').value);
            webAudio.play();
            return true;
          } else {
            webAudio.pause();
            return false;
          }
        } else {
          if (playing) { stopGen(); return false; }
          startGen(); return true;
        }
      },
      setVolume(val) {
        if (currentVibe === 'internet') {
          webAudio.volume = val;
        } else if (ac && volumeGain) {
          volumeGain.gain.setTargetAtTime(val * 0.35, ac.currentTime, 0.1);
        }
      },
      setVibe,
      get isPlaying() { return currentVibe === 'internet' ? !webAudio.paused : playing; }
    };
  })();

  /* =========================================================
     5. УПРАВЛЕНИЕ UI ПЛЕЕРОМ
     ========================================================= */
  const btn = document.getElementById("musicBtn");
  const iconPlay = document.getElementById("iconPlay");
  const iconPause = document.getElementById("iconPause");
  const volSlider = document.getElementById("volSlider");
  const vibeBtns = document.querySelectorAll(".vibe-btn");

  // Ползунок громкости (градиент)
  function handleVolumeChange() {
    const val = volSlider.value;
    // Обновляем CSS-переменную для градиента
    volSlider.style.setProperty('--vol-pct', `${val * 100}%`);
    Music.setVolume(val);
  }

  volSlider.addEventListener('input', handleVolumeChange);
  
  // Инициализация стиля ползунка (чтобы градиент сразу был)
  handleVolumeChange();

  // Кнопка Play/Pause
  function updatePlayState(isPlaying) {
    if (isPlaying) {
      btn.classList.add("playing");
      iconPlay.style.display = "none";
      iconPause.style.display = "block";
    } else {
      btn.classList.remove("playing");
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
    }
  }

  btn.addEventListener("click", () => {
    const isOn = Music.toggle();
    updatePlayState(isOn);
  });

  // Переключение вайбов
  vibeBtns.forEach(b => {
    b.addEventListener("click", () => {
      vibeBtns.forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      
      const vibe = b.dataset.vibe;
      Music.setVibe(vibe);
      
      // Сбрасываем кнопку Play в исходное положение
      updatePlayState(false);
      if (vibe === 'internet') {
         // Для интернета используем другой звук, сбрасываем Web Audio
      } else {
         webAudio.pause();
      }
    });
  });

  // Обработка окончания трека интернета (хотя loop=true)
  webAudio.addEventListener('play', () => updatePlayState(true));
  webAudio.addEventListener('pause', () => updatePlayState(false));

})();
</script>
</body>
</html>
