<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noclipov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#8b5cf6;
    --cyan:#06b6d4;
    --pink:#ec4899;
    --txt:#e2e8f0;
    --muted:#94a3b8;
    --bg:#05060a;
    --card-bg:rgba(15, 18, 30, 0.6);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  /* ---------- КАСТОМНЫЙ СКРОЛЛБАР ---------- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--violet), var(--cyan));
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, var(--pink), var(--violet));
  }

  html,body{ height:100%; }

  body{
    font-family:"Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1000px 600px at 50% -10%, #111424 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 110%, #0a121d 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    display:grid;
    place-items:center;
    padding:32px 16px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ФОН ---------- */
  .aurora{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    filter:blur(100px); opacity:.3;
  }
  .blob{ position:absolute; border-radius:50%; mix-blend-mode:screen; will-change:transform; }
  .b1{ width:500px; height:500px; background:#4c1d95; top:-150px; left:-100px; animation:drift1 22s ease-in-out infinite; }
  .b2{ width:450px; height:450px; background:#164e63; bottom:-150px; right:-100px; animation:drift2 28s ease-in-out infinite; }
  .b3{ width:380px; height:380px; background:#831843; top:45%; left:65%; animation:drift3 34s ease-in-out infinite; opacity:.6; }

  @keyframes drift1 { 0%,100%{ transform:translate3d(0,0,0) scale(1); } 50%{ transform:translate3d(100px,60px,0) scale(1.1); } }
  @keyframes drift2 { 0%,100%{ transform:translate3d(0,0,0) scale(1.05); } 50%{ transform:translate3d(-120px,-60px,0) scale(.95); } }
  @keyframes drift3 { 0%,100%{ transform:translate3d(0,0,0) scale(.98); } 50%{ transform:translate3d(-80px,90px,0) scale(1.15); } }

  #bg{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- КАРТОЧКА ---------- */
  .wrap{ position:relative; z-index:2; animation:rise 1s cubic-bezier(.2,.85,.25,1) both; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(30px) scale(.97); filter:blur(6px); }
    to  { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }

  .card{
    position:relative;
    width:min(92vw, 380px);
    border-radius:28px;
    background: var(--card-bg);
    border:1px solid rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    box-shadow:
      0 40px 100px -20px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.1) inset;
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* Шумовая текстура (делает стекло премиальным) */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 0;
  }

  /* Блик от курсора */
  .card::after{
    content:"";
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%), rgba(139,92,246,.12), transparent 60%);
    opacity:0; transition:opacity .4s;
    z-index: 0;
  }
  .card:hover::after{ opacity:1; }

  /* Контент внутри карточки (поверх текстур) */
  .card-content {
    position: relative;
    z-index: 1;
    padding: 36px 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- АВАТАР ---------- */
  .avatar{
    position:relative;
    width:100px; height:100px;
    margin:0 auto 20px;
    transform:translateZ(40px);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .avatar { transform: translateZ(40px) translateY(-4px); }
  
  .avatar::before{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    filter:blur(12px); opacity:.5;
    animation:spin 10s linear infinite;
  }
  .avatar::after{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    animation:spin 10s linear infinite;
  }
  .avatar-inner{
    position:absolute; inset:3px; border-radius:50%; z-index:1;
    background:#0a0b16;
    overflow:hidden;
    display:grid; place-items:center;
    font-size:40px; font-weight:700;
    color:#fff;
  }
  .avatar-inner img{
    width:100%; height:100%; object-fit:cover;
    border-radius:50%;
    filter: brightness(.95);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- ПРОФИЛЬ ---------- */
  .name-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    transform:translateZ(26px);
  }

  .name{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.03em;
    background:linear-gradient(100deg, #fff 10%, #c4b5fd 40%, #67e8f9 60%, #fff 90%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-250% 0; } }

  .status-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

  .tagline{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.01em;
    transform:translateZ(18px);
  }

  /* ---------- СОЦ-КНОПКИ ---------- */
  .socials{
    display:flex; gap:10px; justify-content:center;
    margin:24px 0 20px;
    transform:translateZ(22px);
  }
  .soc{
    width:40px; height:40px;
    display:grid; place-items:center;
    border-radius:12px;
    color:#8b8fab;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    text-decoration:none;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  .soc:hover{
    transform:translateY(-3px) scale(1.05);
    color:#fff;
    background:rgba(139,92,246,.15);
    border-color:rgba(139,92,246,.4);
    box-shadow:0 8px 20px -8px rgba(139,92,246,.6);
  }
  .soc svg{ width:18px; height:18px; }

  /* ---------- ПЛЕЕР ---------- */
  .player-section {
    width: 100%;
    margin-top: 8px;
    transform: translateZ(30px);
  }

  .now-playing {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    height: 14px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .now-playing.visible { opacity: 1; }
  .now-playing span { color: var(--txt); font-weight: 600; }

  /* Визуализатор (эквалайзер) */
  .visualizer {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 10px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .now-playing.visible .visualizer { opacity: 1; }
  .visualizer div {
    width: 3px;
    background: var(--cyan);
    border-radius: 2px;
    height: 100%;
    transform-origin: bottom;
  }
  .playing .visualizer div:nth-child(1) { animation: eq 0.8s ease-in-out infinite alternate; }
  .playing .visualizer div:nth-child(2) { animation: eq 0.6s ease-in-out infinite alternate 0.1s; background: var(--violet); }
  .playing .visualizer div:nth-child(3) { animation: eq 0.9s ease-in-out infinite alternate 0.2s; }
  .playing .visualizer div:nth-child(4) { animation: eq 0.7s ease-in-out infinite alternate 0.15s; background: var(--pink); }
  
  @keyframes eq {
    0% { transform: scaleY(0.2); }
    100% { transform: scaleY(1); }
  }

  .player{
    display:flex; align-items:center; gap:12px;
    padding:8px 12px;
    border-radius:16px;
    background:rgba(0,0,0,.2);
    border:1px solid rgba(255,255,255,.04);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
  }

  .music-btn{
    flex-shrink:0;
    width:36px; height:36px;
    display:grid; place-items:center;
    border-radius:50%;
    color:#fff;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    border:none;
    cursor:pointer;
    transition:all .2s;
    box-shadow: 0 4px 12px rgba(139,92,246,.4);
  }
  .music-btn:hover{
    transform:scale(1.05);
    box-shadow: 0 6px 16px rgba(139,92,246,.6);
  }
  .music-btn:active{ transform:scale(.95); }
  .music-btn svg{ width:14px; height:14px; }
  .music-btn.playing { background: linear-gradient(135deg, var(--pink), var(--violet)); box-shadow: 0 4px 12px rgba(236,72,153,.4); }

  /* Ползунок громкости */
  .vol-wrap{
    flex-grow:1;
    display:flex; align-items:center;
    padding: 0 4px;
  }
  
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    background:transparent;
    height: 16px;
  }
  input[type=range]:focus{ outline:none; }
  
  input[type=range]::-webkit-slider-runnable-track{
    width:100%;
    height:4px;
    cursor:pointer;
    background: linear-gradient(to right, var(--violet), var(--cyan), var(--pink)) 0 0 / var(--vol-pct, 50%) 100% no-repeat, rgba(255,255,255,.1);
    border-radius:2px;
  }
  
  input[type=range]::-webkit-slider-thumb{
    height:12px; width:12px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    -webkit-appearance:none;
    margin-top:-4px;
    box-shadow:0 0 8px rgba(255,255,255,.6);
    transition:transform .2s;
  }
  input[type=range]:hover::-webkit-slider-thumb{ transform:scale(1.2); }

  input[type=range]::-moz-range-track{
    width:100%; height:4px; cursor:pointer;
    background:rgba(255,255,255,.1); border-radius:2px;
  }
  input[type=range]::-moz-range-progress{
    height:4px; background: linear-gradient(to right, var(--violet), var(--cyan), var(--pink)); border-radius:2px;
  }
  input[type=range]::-moz-range-thumb{
    height:12px; width:12px; border-radius:50%;
    background:#fff; cursor:pointer; border:none;
    box-shadow:0 0 8px rgba(255,255,255,.6);
    transition:transform .2s;
  }
  input[type=range]:hover::-moz-range-thumb{ transform:scale(1.2); }

  /* Segmented Control (Выбор вайба) */
  .vibe-selector {
    display: flex;
    background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 12px;
    padding: 3px;
    margin-top: 12px;
    position: relative;
  }
  
  .vibe-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 0;
    border-radius: 9px;
    cursor: pointer;
    transition: all .3s;
    position: relative;
    z-index: 1;
  }
  .vibe-btn:hover { color: var(--txt); }
  .vibe-btn.active {
    color: #fff;
    background: rgba(255,255,255,.08);
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }

  /* ---------- КАСТОМНОЕ КОНТЕКСТНОЕ МЕНЮ ---------- */
  #ctx-menu {
    display: none;
    position: fixed;
    z-index: 9999;
    background: rgba(15, 17, 26, 0.9);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    padding: 6px;
    min-width: 160px;
    box-shadow: 0 10px 30px rgba(0,0,0,.9);
    flex-direction: column;
    gap: 2px;
    animation: ctxIn 0.15s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes ctxIn {
    from { opacity: 0; transform: scale(0.95) translateY(-5px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    color: var(--txt);
    font-size: 12px; font-weight: 500;
    text-decoration: none; border-radius: 8px;
    cursor: pointer; transition: background .2s;
    border: none; background: transparent; width: 100%; text-align: left;
    font-family: inherit;
  }
  .ctx-item:hover { background: rgba(139,92,246,.2); }
  .ctx-item svg { width: 14px; height: 14px; opacity: 0.7; }
  .ctx-item:hover svg { opacity: 1; }
  .ctx-sep { height: 1px; background: rgba(255,255,255,.08); margin: 4px 0; }

  @media (max-width:380px){
    .vibe-btn { font-size: 10px; }
  }
</style>
</head>
<body>

<!-- Контекстное меню -->

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.3L21 8"/></svg>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>

    GitHub Профиль
  </a>
</div>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<canvas id="bg"></canvas>

<div class="wrap">
  <section class="card" id="card">
    <div class="card-content">
      
      <div class="avatar">

          <img src="https://github.com/noclipov.png" alt="noclipov" onerror="this.style.display='none'; this.parentElement.innerText='n';">

        </a>
      </div>

      <!-- Плеер -->
      <div class="player-section">
        <div class="now-playing" id="nowPlaying">
          <div class="visualizer">
            <div></div><div></div><div></div><div></div>
          </div>
          <span id="vibeName">Ambient</span>
        </div>

        <div class="player">
          <button class="music-btn" id="musicBtn" aria-label="Включить музыку">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>

          <button class="vibe-btn" data-vibe="internet">Stream</button>
        </div>
      </div>

    </div>
  </section>
</div>

<audio id="webAudio" loop crossorigin="anonymous">

<script>
(() => {
  "use strict";

  /* =========================================================
     1. КАСТОМНОЕ КОНТЕКСТНОЕ МЕНЮ
     ========================================================= */
  const ctxMenu = document.getElementById("ctx-menu");
  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    ctxMenu.style.display = "flex";
    let x = e.clientX, y = e.clientY;
    if (x + 180 > window.innerWidth) x -= 180;
    if (y + 140 > window.innerHeight) y -= 140;
    ctxMenu.style.left = `${x}px`;
    ctxMenu.style.top = `${y}px`;
  });
  document.addEventListener("click", (e) => {
    if (!ctxMenu.contains(e.target)) ctxMenu.style.display = "none";
  });

  /* =========================================================
     2. ФОН
     ========================================================= */
  const canvas = document.getElementById("bg");
  const c2d = canvas.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, parts = [];

  function resizeCanvas() {
    W = canvas.width = Math.floor(innerWidth * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    const count = Math.round(Math.min(60, Math.max(25, innerWidth / 22)));
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() * 1.1 + 0.4) * DPR,
      vy: -(Math.random() * 0.12 + 0.03) * DPR,
      vx: (Math.random() - 0.5) * 0.06 * DPR,
      a: Math.random() * 0.3 + 0.1,
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.01 + 0.002
    }));
  }

  function drawStars() {
    c2d.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.ph += p.sp;
      if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      const alpha = p.a * (0.6 + 0.4 * Math.sin(p.ph));
      c2d.beginPath();
      c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c2d.fillStyle = `rgba(180,190,230,${alpha.toFixed(3)})`;
      c2d.shadowBlur = 8 * DPR;
      c2d.shadowColor = "rgba(139,92,246,0.4)";
      c2d.fill();
    }
    c2d.shadowBlur = 0;
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  drawStars();
  addEventListener("resize", resizeCanvas);

  /* =========================================================
     3. 3D-НАКЛОН
     ========================================================= */
  const card = document.getElementById("card");
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let raf = null;

  function move(e) {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;

      const rx = (0.5 - ny) * 6;
      const ry = (nx - 0.5) * 8;

      card.style.transform = `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      card.style.setProperty("--mx", (nx * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (ny * 100).toFixed(1) + "%");
    });
  }

  function reset() {
    card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)";
    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "0%");
  }

  if (fine) {
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseleave", reset);
  }

  /* =========================================================
     4. МУЗЫКА (Исправленное переключение)
     ========================================================= */
  const webAudio = document.getElementById('webAudio');
  const nowPlaying = document.getElementById('nowPlaying');
  const vibeName = document.getElementById('vibeName');

  const Music = (() => {
    let ac = null;
    let masterGain = null;
    let volumeGain = null;
    let sendBus = null;
    let playing = false;
    let chordTimer = null;
    let noteTimer = null;
    let step = 0;
    let currentVibe = "ambient";
    let activeOscs = []; // Трекинг активных осцилляторов

    const VIBES = {
      ambient: {
        name: "Ambient",
        chords: [[174.61, 220.00, 261.63], [130.81, 164.81, 196.00], [196.00, 246.94, 293.66], [146.83, 174.61, 220.00]],
        scale: [523.25, 587.33, 659.25, 783.99, 880.00],
        filter: 1800, chordDur: 10.0, chordInt: 8000, bellInt: 3500
      },
      deep: {
        name: "Deep Space",
        chords: [[110.00, 130.81, 164.81], [87.31, 110.00, 130.81], [98.00, 123.47, 146.83], [116.54, 146.83, 174.61]],
        scale: [261.63, 293.66, 329.63, 392.00, 440.00],
        filter: 800, chordDur: 14.0, chordInt: 10000, bellInt: 6000
      },
      rain: {
        name: "Lo-Fi Rain",
        chords: [[146.83, 174.61, 220.00], [130.81, 164.81, 196.00], [110.00, 130.81, 164.81], [98.00, 123.47, 146.83]],
        scale: [440.00, 523.25, 587.33, 659.25, 783.99],
        filter: 1200, chordDur: 8.0, chordInt: 6000, bellInt: 2000
      },
      internet: { name: "Internet Stream" }
    };

    function init() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();

      masterGain = ac.createGain();
      masterGain.gain.value = 0;
      volumeGain = ac.createGain();
      volumeGain.gain.value = parseFloat(document.getElementById('volSlider').value) * 0.35;

      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = VIBES[currentVibe].filter || 1800;
      lp.Q.value = 0.2;

      masterGain.connect(lp);
      lp.connect(volumeGain);
      volumeGain.connect(ac.destination);

      const delay = ac.createDelay(1.5);
      delay.delayTime.value = currentVibe === 'deep' ? 0.9 : 0.5;
      const fb = ac.createGain(); fb.gain.value = 0.4;
      const damp = ac.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 1000;
      const wet = ac.createGain(); wet.gain.value = 0.6;

      delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(wet); wet.connect(masterGain);
      sendBus = delay;
    }

    function playChord(freqs, dur) {
      const t0 = ac.currentTime + 0.05;
      freqs.forEach((f, i) => {
        const osc = ac.createOscillator();
        osc.type = "sine";
        osc.frequency.value = f;
        activeOscs.push(osc); // Запоминаем

        const g = ac.createGain();
        const peak = 0.15 / (1 + i * 0.5);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 4.0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
        if (pan) {
          pan.pan.value = (i % 2 ? 0.6 : -0.6);
          osc.connect(g); g.connect(pan); pan.connect(masterGain); pan.connect(sendBus);
        } else {
          osc.connect(g); g.connect(masterGain); g.connect(sendBus);
        }
        osc.start(t0); osc.stop(t0 + dur + 0.5);
      });
    }

    function playBell(scale) {
      const t0 = ac.currentTime + 0.05;
      const f = scale[Math.floor(Math.random() * scale.length)];
      const o1 = ac.createOscillator();
      o1.type = "sine";
      o1.frequency.value = f;
      activeOscs.push(o1);

      const env = ac.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(0.03, t0 + 0.8);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.0);

      o1.connect(env); env.connect(masterGain); env.connect(sendBus);
      o1.start(t0); o1.stop(t0 + 4.5);
    }

    function killAllSounds() {
      activeOscs.forEach(o => {
        try { o.stop(); o.disconnect(); } catch(e){}
      });
      activeOscs = [];
      if (masterGain) masterGain.gain.cancelScheduledValues(ac.currentTime);
    }

    function startGen() {
      init();
      if (ac.state === "suspended") ac.resume();

      playing = true;
      step = 0;
      const cfg = VIBES[currentVibe];

      const now = ac.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(0.0001, now);
      masterGain.gain.linearRampToValueAtTime(1.0, now + 2.0);

      playChord(cfg.chords[0], cfg.chordDur);
      step = 1;

      chordTimer = setInterval(() => {
        playChord(cfg.chords[step % cfg.chords.length], cfg.chordDur);
        step++;
      }, cfg.chordInt);

      noteTimer = setInterval(() => {
        if (Math.random() < 0.6) playBell(cfg.scale);
      }, cfg.bellInt);
    }

    function stopGen() {
      playing = false;
      clearInterval(chordTimer);
      clearInterval(noteTimer);
      chordTimer = noteTimer = null;

      if (!ac) return;
      const now = ac.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      // Быстрое затухание (0.15 сек) вместо 2 сек, чтобы не было каши
      masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
      
      setTimeout(() => {
        killAllSounds();
      }, 200);
    }

    function setVibe(vibe) {
      const wasPlaying = playing || !webAudio.paused;
      stopGen();
      webAudio.pause();
      
      currentVibe = vibe;
      vibeName.textContent = VIBES[vibe].name;

      if (wasPlaying) {
        setTimeout(() => {
          if (currentVibe === 'internet') {
            webAudio.volume = parseFloat(document.getElementById('volSlider').value);
            webAudio.play();
            updatePlayState(true);
          } else {
            startGen();
            updatePlayState(true);
          }
        }, 250); // Небольшая пауза для плавности
      } else {
        updatePlayState(false);
      }
    }

    return {
      toggle() {
        if (currentVibe === 'internet') {
          if (webAudio.paused) {
            webAudio.volume = parseFloat(document.getElementById('volSlider').value);
            webAudio.play();
            return true;
          } else {
            webAudio.pause();
            return false;
          }
        } else {
          if (playing) { stopGen(); return false; }
          startGen(); return true;
        }
      },
      setVolume(val) {
        if (currentVibe === 'internet') {
          webAudio.volume = val;
        } else if (ac && volumeGain) {
          volumeGain.gain.setTargetAtTime(val * 0.35, ac.currentTime, 0.1);
        }
      },
      setVibe
    };
  })();

  /* =========================================================
     5. UI ПЛЕЕРА
     ========================================================= */
  const btn = document.getElementById("musicBtn");
  const iconPlay = document.getElementById("iconPlay");
  const iconPause = document.getElementById("iconPause");
  const volSlider = document.getElementById("volSlider");
  const vibeBtns = document.querySelectorAll(".vibe-btn");

  function handleVolumeChange() {
    const val = volSlider.value;
    volSlider.style.setProperty('--vol-pct', `${val * 100}%`);
    Music.setVolume(val);
  }
  volSlider.addEventListener('input', handleVolumeChange);
  handleVolumeChange();

  function updatePlayState(isPlaying) {
    if (isPlaying) {
      btn.classList.add("playing");
      nowPlaying.classList.add("visible", "playing");
      iconPlay.style.display = "none";
      iconPause.style.display = "block";
    } else {
      btn.classList.remove("playing");
      nowPlaying.classList.remove("playing");
      // Оставляем надпись Now Playing видимой, если пользователь взаимодействовал
      if (vibeName.textContent) nowPlaying.classList.add("visible");
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
    }
  }

  btn.addEventListener("click", () => {
    const isOn = Music.toggle();
    updatePlayState(isOn);
  });

  vibeBtns.forEach(b => {
    b.addEventListener("click", () => {
      vibeBtns.forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      Music.setVibe(b.dataset.vibe);
    });
  });

  webAudio.addEventListener('play', () => updatePlayState(true));
  webAudio.addEventListener('pause', () => updatePlayState(false));

  // Инициализация надписи
  nowPlaying.classList.add("visible");

})();
</script>
</body>
</html>
