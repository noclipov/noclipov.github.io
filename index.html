<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<title>noclipov</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
		<style>
			:root {
				--primary: #a78bfa;
				--secondary: #22d3ee;
				--accent: #f472b6;
				--txt: #f8fafc;
				--muted: #94a3b8;
				--bg: #03040a;
				--card-bg: rgba(15, 18, 28, 0.7);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				-webkit-tap-highlight-color: transparent;
				user-select: none;
				-webkit-user-select: none;
			}

			::-webkit-scrollbar {
				width: 6px;
			}
			::-webkit-scrollbar-track {
				background: var(--bg);
			}
			::-webkit-scrollbar-thumb {
				background: var(--primary);
				border-radius: 10px;
			}

			html,
			body {
				height: 100%;
				overflow: hidden;
			}

			body {
				font-family:
					'Plus Jakarta Sans',
					-apple-system,
					sans-serif;
				background:
					radial-gradient(
						1200px 800px at 50% -20%,
						#0f1123 0%,
						transparent 60%
					),
					radial-gradient(
						1000px 600px at 100% 120%,
						#07111a 0%,
						transparent 60%
					),
					var(--bg);
				color: var(--txt);
				display: grid;
				place-items: center;
				position: relative;
				-webkit-font-smoothing: antialiased;
			}

			/* Background & Atmosphere */
			.aurora {
				position: fixed;
				inset: 0;
				overflow: hidden;
				pointer-events: none;
				z-index: 0;
				filter: blur(100px);
				opacity: 0.2;
			}
			.blob {
				position: absolute;
				border-radius: 50%;
				mix-blend-mode: screen;
			}
			.b1 {
				width: 70vw;
				height: 70vw;
				background: #4c1d95;
				top: -20%;
				left: -10%;
				animation: drift 25s infinite alternate;
			}
			.b2 {
				width: 60vw;
				height: 60vw;
				background: #0e7490;
				bottom: -20%;
				right: -10%;
				animation: drift 30s infinite alternate-reverse;
			}

			@keyframes drift {
				0% {
					transform: translate(0, 0) scale(1);
				}
				100% {
					transform: translate(10%, 10%) scale(1.1);
				}
			}

			#bg {
				position: fixed;
				inset: 0;
				z-index: 1;
				pointer-events: none;
			}

			.vignette {
				position: fixed;
				inset: 0;
				z-index: 2;
				pointer-events: none;
				background: radial-gradient(
					circle at center,
					transparent 20%,
					rgba(0, 0, 0, 0.85) 100%
				);
			}

			.grain {
				position: fixed;
				inset: 0;
				z-index: 3;
				pointer-events: none;
				opacity: 0.04;
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
			}

			/* Profile Card */
			.card {
				position: relative;
				z-index: 4;
				width: min(90vw, 380px);
				border-radius: 32px;
				background: linear-gradient(
					145deg,
					rgba(20, 24, 39, 0.8),
					rgba(10, 12, 20, 0.9)
				);
				border: 1px solid rgba(255, 255, 255, 0.08);
				backdrop-filter: blur(40px) saturate(150%);
				box-shadow:
					0 40px 100px -20px rgba(0, 0, 0, 0.95),
					0 0 0 1px rgba(255, 255, 255, 0.03) inset;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 40px 24px 32px;
				animation: rise 1s cubic-bezier(0.2, 0.85, 0.25, 1) both;
				overflow: hidden;
			}

			.card::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 1px;
				background: linear-gradient(
					90deg,
					transparent,
					rgba(167, 139, 250, 0.5),
					transparent
				);
			}

			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(30px) scale(0.95);
				}
				to {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}

			.avatar-wrapper {
				position: relative;
				margin-bottom: 24px;
			}
			.avatar {
				position: relative;
				width: 110px;
				height: 110px;
				border-radius: 50%;
				padding: 3px;
				background: linear-gradient(
					135deg,
					var(--primary),
					var(--secondary),
					var(--accent)
				);
				box-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
			}
			.avatar-inner {
				width: 100%;
				height: 100%;
				border-radius: 50%;
				background: #03040a;
				overflow: hidden;
				display: grid;
				place-items: center;
				font-size: 40px;
				font-weight: 800;
				border: 2px solid #03040a;
			}
			.avatar-inner img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				filter: brightness(0.9);
				transition: transform 0.5s;
			}
			.avatar:hover .avatar-inner img {
				transform: scale(1.1);
				filter: brightness(1.1);
			}

			.name {
				font-size: 30px;
				font-weight: 800;
				letter-spacing: -0.03em;
				background: linear-gradient(
					100deg,
					#fff 10%,
					#c4b5fd 40%,
					#67e8f9 60%,
					#fff 90%
				);
				background-size: 250% 100%;
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				animation: shimmer 8s linear infinite;
			}
			@keyframes shimmer {
				to {
					background-position: -250% 0;
				}
			}

			.tagline {
				margin-top: 8px;
				font-size: 14px;
				color: var(--muted);
				font-weight: 500;
				text-align: center;
			}

			/* Now Playing Widget */
			.card-widget {
				margin-top: 28px;
				width: 100%;
				padding: 16px 20px;
				background: rgba(0, 0, 0, 0.4);
				border-radius: 20px;
				border: 1px solid rgba(255, 255, 255, 0.04);
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			.widget-info {
				display: flex;
				flex-direction: column;
				max-width: 60%;
			}
			.widget-label {
				font-size: 10px;
				text-transform: uppercase;
				color: var(--secondary);
				font-weight: 800;
				letter-spacing: 0.1em;
			}
			.widget-track {
				font-size: 14px;
				font-weight: 700;
				color: #fff;
				margin-top: 2px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			/* New Sleek Visualizer (5 Bars) */
			.visualizer {
				display: flex;
				align-items: center;
				gap: 3px;
				height: 24px;
			}
			.vis-bar {
				width: 4px;
				background: linear-gradient(to top, var(--primary), var(--secondary));
				border-radius: 4px;
				height: 15%;
				transition: height 0.08s ease-out;
				box-shadow: 0 0 8px rgba(34, 211, 238, 0.4);
			}

			/* Settings (Top Right) */
			.settings-btn {
				position: fixed;
				top: 20px;
				right: 20px;
				z-index: 100;
				width: 44px;
				height: 44px;
				border-radius: 50%;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				color: var(--muted);
				display: grid;
				place-items: center;
				cursor: pointer;
				backdrop-filter: blur(10px);
				transition: all 0.3s;
			}
			.settings-btn:hover {
				color: #fff;
				transform: rotate(90deg);
				background: rgba(255, 255, 255, 0.1);
			}

			.settings-menu {
				position: fixed;
				top: 70px;
				right: 20px;
				z-index: 99;
				width: 240px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 20px;
				padding: 16px;
				backdrop-filter: blur(30px);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
				opacity: 0;
				pointer-events: none;
				transform: translateY(-10px);
				transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			.settings-menu.open {
				opacity: 1;
				pointer-events: auto;
				transform: translateY(0);
			}
			.settings-title {
				font-size: 11px;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 8px;
				font-weight: 800;
				letter-spacing: 0.05em;
			}
			.grid-btns {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 6px;
				margin-bottom: 16px;
			}
			.s-btn {
				background: rgba(255, 255, 255, 0.03);
				border: 1px solid rgba(255, 255, 255, 0.06);
				color: var(--muted);
				padding: 8px;
				border-radius: 10px;
				font-size: 12px;
				cursor: pointer;
				transition: all 0.2s;
				font-family: inherit;
				font-weight: 600;
			}
			.s-btn:hover {
				background: rgba(255, 255, 255, 0.08);
				color: #fff;
			}
			.s-btn.active {
				background: rgba(167, 139, 250, 0.15);
				border-color: rgba(167, 139, 250, 0.4);
				color: #fff;
			}

			/* Toggle */
			.toggle-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: 13px;
				padding-top: 12px;
				border-top: 1px solid rgba(255, 255, 255, 0.08);
				font-weight: 600;
			}
			.switch {
				position: relative;
				width: 34px;
				height: 18px;
			}
			.switch input {
				opacity: 0;
			}
			.slider {
				position: absolute;
				inset: 0;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 20px;
				transition: 0.3s;
				cursor: pointer;
			}
			.slider::before {
				content: '';
				position: absolute;
				width: 14px;
				height: 14px;
				left: 2px;
				bottom: 2px;
				background: #fff;
				border-radius: 50%;
				transition: 0.3s;
			}
			input:checked + .slider {
				background: var(--secondary);
			}
			input:checked + .slider::before {
				transform: translateX(16px);
			}

			/* Desktop Triggers & Tabs */
			.panel-trigger {
				position: fixed;
				top: 50%;
				transform: translateY(-50%);
				z-index: 98;
				width: 60px;
				height: 200px;
			}
			.panel-trigger.left {
				left: 0;
			}
			.panel-trigger.right {
				right: 0;
			}

			.panel-tab {
				position: fixed;
				top: 50%;
				transform: translateY(-50%);
				z-index: 100;
				width: 24px;
				height: 60px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				display: flex;
				align-items: center;
				justify-content: center;
				cursor: pointer;
				color: var(--muted);
				backdrop-filter: blur(10px);
				transition:
					transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
					opacity 0.3s;
			}
			.panel-tab.left {
				left: 0;
				border-radius: 0 12px 12px 0;
				border-left: none;
			}
			.panel-tab.right {
				right: 0;
				border-radius: 12px 0 0 12px;
				border-right: none;
			}
			.panel-tab:hover {
				color: #fff;
			}

			.panel-tab.left.tab-hidden {
				transform: translate(-100%, -50%);
				opacity: 0;
				pointer-events: none;
			}
			.panel-tab.right.tab-hidden {
				transform: translate(100%, -50%);
				opacity: 0;
				pointer-events: none;
			}

			/* Panels - Desktop */
			.social-panel,
			.music-panel {
				position: fixed;
				top: 50%;
				transform: translateY(-50%);
				z-index: 99;
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 20px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				backdrop-filter: blur(30px);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
				transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
			}
			.social-panel {
				left: 0;
				transform: translate(-100%, -50%);
				border-radius: 0 24px 24px 0;
				border-left: none;
			}
			.music-panel {
				right: 0;
				transform: translate(100%, -50%);
				border-radius: 24px 0 0 24px;
				border-right: none;
				width: 240px;
			}

			.social-panel.open {
				transform: translate(0, -50%);
			}
			.music-panel.open {
				transform: translate(0, -50%);
			}

			.panel-title {
				font-size: 12px;
				text-transform: uppercase;
				color: var(--muted);
				font-weight: 800;
				letter-spacing: 0.1em;
				text-align: center;
				margin-bottom: 8px;
			}

			.soc-item {
				width: 48px;
				height: 48px;
				border-radius: 16px;
				background: rgba(255, 255, 255, 0.03);
				display: grid;
				place-items: center;
				color: var(--muted);
				cursor: pointer;
				transition: 0.3s;
				border: 1px solid transparent;
			}
			.soc-item:hover {
				background: rgba(167, 139, 250, 0.15);
				color: #fff;
				border-color: rgba(167, 139, 250, 0.3);
				transform: scale(1.05);
			}
			.soc-item svg {
				width: 22px;
				height: 22px;
			}

			/* Draggable Player */
			.floating-player {
				position: fixed;
				bottom: 24px;
				right: 24px;
				z-index: 100;
				display: flex;
				align-items: center;
				gap: 16px;
				padding: 12px 20px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 24px;
				backdrop-filter: blur(30px);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
				cursor: grab;
			}
			.floating-player:active {
				cursor: grabbing;
			}
			.floating-player:hover {
				border-color: rgba(255, 255, 255, 0.15);
			}

			.ctrl-btn {
				background: transparent;
				border: none;
				color: var(--muted);
				cursor: pointer;
				display: grid;
				place-items: center;
				transition: 0.2s;
				pointer-events: auto;
			}
			.ctrl-btn:hover {
				color: #fff;
			}
			.play-btn {
				width: 44px;
				height: 44px;
				border-radius: 50%;
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				color: #fff;
				box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
			}
			.play-btn:hover {
				transform: scale(1.05);
				box-shadow: 0 6px 20px rgba(167, 139, 250, 0.6);
			}
			.play-btn svg {
				width: 20px;
				height: 20px;
			}

			.track-info {
				display: flex;
				flex-direction: column;
				min-width: 90px;
				max-width: 120px;
				pointer-events: none;
			}
			.track-name {
				font-size: 13px;
				font-weight: 700;
				color: #fff;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.track-status {
				font-size: 10px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				font-weight: 600;
			}

			.vol-wrap {
				display: flex;
				align-items: center;
				gap: 8px;
				width: 80px;
				pointer-events: auto;
			}
			.vol-wrap svg {
				width: 14px;
				height: 14px;
				color: var(--muted);
			}
			input[type='range'] {
				-webkit-appearance: none;
				width: 100%;
				background: transparent;
				cursor: pointer;
			}
			input[type='range']::-webkit-slider-runnable-track {
				width: 100%;
				height: 4px;
				background: rgba(255, 255, 255, 0.15);
				border-radius: 2px;
			}
			input[type='range']::-webkit-slider-thumb {
				-webkit-appearance: none;
				height: 12px;
				width: 12px;
				border-radius: 50%;
				background: #fff;
				margin-top: -4px;
				box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
			}

			/* Context Menu */
			#ctx-menu {
				display: none;
				position: fixed;
				z-index: 300;
				background: rgba(15, 18, 28, 0.95);
				backdrop-filter: blur(16px);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 16px;
				padding: 6px;
				min-width: 180px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
				flex-direction: column;
				gap: 2px;
				animation: ctxIn 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			@keyframes ctxIn {
				from {
					opacity: 0;
					transform: scale(0.95) translateY(-5px);
				}
				to {
					opacity: 1;
					transform: scale(1) translateY(0);
				}
			}
			.ctx-item {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px 14px;
				color: var(--txt);
				font-size: 13px;
				font-weight: 600;
				text-decoration: none;
				border-radius: 10px;
				cursor: pointer;
				transition: background 0.2s;
				border: none;
				background: transparent;
				width: 100%;
				text-align: left;
				font-family: inherit;
			}
			.ctx-item:hover {
				background: rgba(167, 139, 250, 0.15);
			}
			.ctx-item svg {
				width: 16px;
				height: 16px;
				opacity: 0.7;
			}
			.ctx-item:hover svg {
				opacity: 1;
			}
			.ctx-sep {
				height: 1px;
				background: rgba(255, 255, 255, 0.08);
				margin: 4px 0;
			}

			/* QR Modal */
			.modal-overlay {
				position: fixed;
				inset: 0;
				z-index: 200;
				background: rgba(0, 0, 0, 0.8);
				backdrop-filter: blur(10px);
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: 0;
				pointer-events: none;
				transition: 0.3s;
			}
			.modal-overlay.open {
				opacity: 1;
				pointer-events: auto;
			}
			.modal-content {
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 24px;
				padding: 24px;
				display: flex;
				flex-direction: column;
				align-items: center;
				transform: translateY(20px);
				transition: 0.3s;
			}
			.modal-overlay.open .modal-content {
				transform: translateY(0);
			}
			.qr-wrapper {
				background: #0c0d12;
				padding: 16px;
				border-radius: 20px;
				margin-bottom: 16px;
				border: 1px solid rgba(255, 255, 255, 0.05);
			}
			#qr-image {
				display: block;
				width: 180px;
				height: 180px;
			}
			.modal-btn {
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				color: #fff;
				padding: 12px 32px;
				border-radius: 12px;
				text-decoration: none;
				font-weight: 700;
				font-size: 14px;
				transition: transform 0.2s;
				width: 100%;
				text-align: center;
			}
			.modal-btn:hover {
				transform: translateY(-2px);
			}

			/* Mobile Backdrop */
			.mobile-backdrop {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.6);
				backdrop-filter: blur(4px);
				z-index: 90;
				opacity: 0;

		<script>
			const CONFIG = {
				playlist: [
					{ title: 'марионетка познала безумие', src: 'music/track1.mp3' },
					{ title: 'Набросок (Alternative Version).', src: 'music/track2.mp3' },
					{ title: 'волны', src: 'music/track3.mp3' },
					{ title: 'Слишком хороший', src: 'music/track4.mp3' },
					{ title: 'я понял что значит любить', src: 'music/track5.mp3' },
					{ title: 'Метеорит', src: 'music/track6.mp3' },
					{ title: 'provod', src: 'music/track7.mp3' },
				],
				quotes: [
					'where the light fades and echoes remain',
					'lost in the cosmic silence',
					'drifting through the astral plane',
					'a soul wandering the neon void',
					'dust in the wind of a dying star',
					'echoes of a forgotten tomorrow',
					'in search of a new horizon',
					'beyond the edge of time',
				],
			};

			class BackgroundEngine {
				constructor(canvas) {
					this.canvas = canvas;
					this.ctx = canvas.getContext('2d');
					this.w = 0;
					this.h = 0;
					this.particles = [];
					this.effect = 'stars';
					this.animId = null;

					window.addEventListener('resize', () => this.resize());
					this.resize();
					this.loop();
				}

				resize() {
					this.w = this.canvas.width =
						innerWidth * (window.devicePixelRatio > 1 ? 2 : 1);
					this.h = this.canvas.height =
						innerHeight * (window.devicePixelRatio > 1 ? 2 : 1);
					this.canvas.style.width = innerWidth + 'px';
					this.canvas.style.height = innerHeight + 'px';
					this.initParticles();
				}

				setEffect(mode) {
					this.effect = mode;
					this.initParticles();
				}

				initParticles() {
					this.particles = [];
					let count = 0;
					if (this.effect === 'rain') count = Math.min(120, innerWidth / 12);
					else if (this.effect === 'vertices')
						count = Math.min(50, innerWidth / 25);
					else if (this.effect === 'warp')
						count = Math.min(250, innerWidth / 6);
					else count = Math.min(90, innerWidth / 18);

					for (let i = 0; i < count; i++) {
						this.particles.push({
							x: Math.random() * this.w,
							y: Math.random() * this.h,
							vx: (Math.random() - 0.5) * (this.effect === 'rain' ? 1.5 : 0.3),
							vy:
								this.effect === 'rain'
									? 18 + Math.random() * 10
									: this.effect === 'warp'
										? 0
										: -(Math.random() * 0.4 + 0.1),
							r:
								this.effect === 'snow' || this.effect === 'bubbles'
									? Math.random() * 3 + 1
									: Math.random() * 2,
							a: Math.random() * 0.6 + 0.2,
							length: Math.random() * 30 + 20,
							phase: Math.random() * Math.PI * 2,
							speed: Math.random() * 0.03 + 0.01,
							z: Math.random() * this.w,
						});
					}
				}

				draw() {
					this.ctx.clearRect(0, 0, this.w, this.h);
					this.ctx.shadowBlur = 0;

					if (this.effect === 'rain') {
						this.ctx.strokeStyle = 'rgba(180, 200, 230, 0.25)';
						this.ctx.lineWidth = 1.2;
						this.ctx.lineCap = 'round';
					} else {
						this.ctx.shadowBlur = 12;
						this.ctx.shadowColor = 'rgba(167, 139, 250, 0.4)';
					}

					for (let i = 0; i < this.particles.length; i++) {
						let p = this.particles[i];

						if (this.effect === 'rain') {
							p.x += p.vx;
							p.y += p.vy;
						} else if (this.effect === 'vertices') {
							p.x += p.vx;
							p.y += p.vy;
							if (p.x < 0 || p.x > this.w) p.vx *= -1;
							if (p.y < 0 || p.y > this.h) p.vy *= -1;
						} else if (this.effect === 'warp') {
							p.z -= 8;
							if (p.z <= 1) {
								p.z = this.w;
								p.x = (Math.random() - 0.5) * this.w;
								p.y = (Math.random() - 0.5) * this.h;
							}
						} else if (this.effect === 'bubbles') {
							p.phase += p.speed;
							p.x += Math.sin(p.phase) * 0.8;
							p.y -= 0.8;
						} else {
							p.x += p.vx;
							p.y += p.vy;
						}

						if (this.effect !== 'warp' && this.effect !== 'vertices') {
							if (p.x < -50) p.x = this.w + 50;
							if (p.x > this.w + 50) p.x = -50;
							if (p.y < -50) p.y = this.h + 50;
							if (p.y > this.h + 50) p.y = -50;
						}

						if (this.effect === 'rain') {
							this.ctx.beginPath();
							this.ctx.moveTo(p.x, p.y);
							this.ctx.lineTo(p.x - p.vx * 3, p.y - p.length);
							this.ctx.stroke();
						} else if (this.effect === 'vertices') {
							this.ctx.fillStyle = 'rgba(34, 211, 238, 0.6)';
							this.ctx.beginPath();
							this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
							this.ctx.fill();
							for (let j = i + 1; j < this.particles.length; j++) {
								let p2 = this.particles[j];
								let dx = p.x - p2.x,
									dy = p.y - p2.y;
								let dist = Math.sqrt(dx * dx + dy * dy);
								if (dist < this.w * 0.15) {
									this.ctx.beginPath();
									this.ctx.moveTo(p.x, p.y);
									this.ctx.lineTo(p2.x, p2.y);
									this.ctx.strokeStyle = `rgba(34, 211, 238, ${0.2 * (1 - dist / (this.w * 0.15))})`;
									this.ctx.lineWidth = 1;
									this.ctx.stroke();
								}
							}
						} else if (this.effect === 'warp') {
							const px = (p.x / p.z) * this.w + this.w / 2;
							const py = (p.y / p.z) * this.h + this.h / 2;
							const radius = Math.max(0.1, (1 - p.z / this.w) * 4);
							this.ctx.fillStyle = `rgba(255,255,255,${1 - p.z / this.w})`;
							this.ctx.beginPath();
							this.ctx.arc(px, py, radius, 0, Math.PI * 2);
							this.ctx.fill();
						} else if (this.effect === 'bubbles') {
							this.ctx.strokeStyle = `rgba(167, 139, 250, ${p.a})`;
							this.ctx.beginPath();
							this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
							this.ctx.stroke();
						} else {
							this.ctx.fillStyle = `rgba(255,255,255,${p.a * (0.6 + 0.4 * Math.sin(Date.now() * 0.002 + i))})`;
							this.ctx.beginPath();
							this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
							this.ctx.fill();
						}
					}
					this.ctx.shadowBlur = 0;
					this.animId = requestAnimationFrame(() => this.draw());
				}

				loop() {
					cancelAnimationFrame(this.animId);
					this.draw();
				}
			}

			class AudioEngine {
				constructor() {
					this.ac = null;
					this.masterGain = null;
					this.musicGain = null;
					this.rainGain = null;
					this.analyser = null;
					this.isPlaying = false;
					this.isPlayingRain = false;
					this.mode = 'ambient';
					this.playlist = CONFIG.playlist;
					this.currentTrack = 0;
					this.isPlaylistMode = false;
					this.webAudio = document.getElementById('webAudio');
					this.rainTimer = null;
					this.mediaSource = null;

					this.vibes = {
						ambient: {
							chords: [
								[174.61, 220.0, 261.63],
								[130.81, 164.81, 196.0],
								[146.83, 174.61, 220.0],
							],
						},
						deep: {
							chords: [
								[110.0, 130.81, 164.81],
								[87.31, 110.0, 130.81],
								[98.0, 123.47, 146.83],
							],
						},
						rain: {
							chords: [
								[146.83, 174.61, 220.0],
								[130.81, 164.81, 196.0],
								[110.0, 130.81, 164.81],
							],
						},
					};
				}

				init() {
					if (this.ac) return;
					const AC = window.AudioContext || window.webkitAudioContext;
					this.ac = new AC();

					this.masterGain = this.ac.createGain();
					this.musicGain = this.ac.createGain();
					this.rainGain = this.ac.createGain();
					this.analyser = this.ac.createAnalyser();
					this.analyser.fftSize = 64;

					this.musicGain.gain.value = 0.3;
					this.rainGain.gain.value = 0;

					this.musicGain.connect(this.masterGain);
					this.rainGain.connect(this.masterGain);
					this.masterGain.connect(this.analyser);
					this.analyser.connect(this.ac.destination);
				}

				buildRain() {
					if (this.rainInitialized) return;
					this.rainInitialized = true;
					const bufferSize = this.ac.sampleRate * 2;
					const buffer = this.ac.createBuffer(
						1,
						bufferSize,
						this.ac.sampleRate,
					);
					const data = buffer.getChannelData(0);
					let lastOut = 0;
					for (let i = 0; i < bufferSize; i++) {
						let white = Math.random() * 2 - 1;
						data[i] = (lastOut + 0.02 * white) / 1.02;
						lastOut = data[i];
						data[i] *= 3.5;
					}
					const rainNode = this.ac.createBufferSource();
					rainNode.buffer = buffer;
					rainNode.loop = true;
					const filter = this.ac.createBiquadFilter();
					filter.type = 'lowpass';
					filter.frequency.value = 600;
					rainNode.connect(filter);
					filter.connect(this.rainGain);
					rainNode.start(0);
				}

				playThunder() {
					if (!this.ac) return;
					const t0 = this.ac.currentTime;
					const osc = this.ac.createOscillator();
					const gain = this.ac.createGain();
					osc.type = 'sine';
					osc.frequency.setValueAtTime(60, t0);
					osc.frequency.exponentialRampToValueAtTime(30, t0 + 1.5);
					gain.gain.setValueAtTime(0, t0);
					gain.gain.linearRampToValueAtTime(0.8, t0 + 0.2);
					gain.gain.exponentialRampToValueAtTime(0.01, t0 + 2.5);
					osc.connect(gain);
					gain.connect(this.rainGain);
					osc.start(t0);
					osc.stop(t0 + 3);
				}

				startRainSounds() {
					this.init();
					if (this.ac.state === 'suspended') this.ac.resume();
					this.buildRain();

					this.rainGain.gain.cancelScheduledValues(this.ac.currentTime);
					this.rainGain.gain.setValueAtTime(0, this.ac.currentTime);
					this.rainGain.gain.linearRampToValueAtTime(
						0.4,
						this.ac.currentTime + 2,
					);

					this.isPlayingRain = true;
					const scheduleThunder = () => {
						if (!this.isPlayingRain) return;
						this.playThunder();
						this.rainTimer = setTimeout(
							scheduleThunder,
							15000 + Math.random() * 20000,
						);
					};

					clearTimeout(this.rainTimer);
					this.rainTimer = setTimeout(scheduleThunder, 5000);
				}

				stopRainSounds() {
					if (!this.ac) return;
					this.isPlayingRain = false;
					this.rainGain.gain.cancelScheduledValues(this.ac.currentTime);
					this.rainGain.gain.setValueAtTime(
						this.rainGain.gain.value,
						this.ac.currentTime,
					);
					this.rainGain.gain.linearRampToValueAtTime(
						0,
						this.ac.currentTime + 1.5,
					);
					clearTimeout(this.rainTimer);
					this.rainTimer = null;
				}

				playChord(freqs) {
					const t0 = this.ac.currentTime;
					freqs.forEach((f, i) => {
						const osc = this.ac.createOscillator();
						osc.type = 'sine';
						osc.frequency.value = f;
						const g = this.ac.createGain();
						g.gain.setValueAtTime(0.0001, t0);
						g.gain.exponentialRampToValueAtTime(0.1 / (i + 1), t0 + 3);
						g.gain.exponentialRampToValueAtTime(0.0001, t0 + 10);
						osc.connect(g);
						g.connect(this.musicGain);
						osc.start(t0);
						osc.stop(t0 + 11);
					});
				}

				startGen() {
					this.init();
					if (this.ac.state === 'suspended') this.ac.resume();
					this.isPlaying = true;
					const chords = this.vibes[this.mode].chords;
					this.playChord(chords[0]);
					let step = 1;
					clearInterval(this.genTimer);
					this.genTimer = setInterval(() => {
						this.playChord(chords[step % chords.length]);
						step++;
					}, 8000);
				}

				stopGen() {
					this.isPlaying = false;
					clearInterval(this.genTimer);
				}

				setMode(mode) {
					this.stopGen();
					this.webAudio.pause();
					this.mode = mode;
					this.isPlaylistMode = mode === 'playlist';

					if (this.isPlaylistMode) {
						this.init();
						if (!this.mediaSource) {
							this.mediaSource = this.ac.createMediaElementSource(
								this.webAudio,
							);
							this.mediaSource.connect(this.masterGain);
						}
						if (this.playlist.length > 0) this.playTrack(this.currentTrack);
						else this.setMode('ambient');
					} else {
						this.startGen();
					}
					UI.updatePlayState(this.isPlaying || !this.webAudio.paused);
				}

				playTrack(index) {
					this.currentTrack = index;
					this.webAudio.src = this.playlist[index].src;
					this.webAudio.volume = parseFloat(
						document.getElementById('volSlider').value,
					);
					this.webAudio
						.play()
						.catch(() =>
							UI.updateTrackInfo(this.playlist[index].title, 'Ошибка файла'),
						);
					UI.updateTrackInfo(this.playlist[index].title, 'Локальный трек');
				}

				togglePlay() {
					if (this.isPlaylistMode) {
						if (this.webAudio.paused) {
							this.webAudio.play();
							return true;
						} else {
							this.webAudio.pause();
							return false;
						}
					} else {
						if (this.isPlaying) {
							this.stopGen();
							return false;
						} else {
							this.startGen();
							return true;
						}
					}
				}

				nextTrack() {
					if (this.isPlaylistMode)
						this.playTrack((this.currentTrack + 1) % this.playlist.length);
				}
				prevTrack() {
					if (this.isPlaylistMode)
						this.playTrack(
							(this.currentTrack - 1 + this.playlist.length) %
								this.playlist.length,
						);
				}

				setVolume(val) {
					if (this.isPlaylistMode) this.webAudio.volume = val;
					else if (this.ac)
						this.musicGain.gain.setTargetAtTime(
							val * 0.4,
							this.ac.currentTime,
							0.1,
						);
				}
			}

			const UI = {
				init() {
					this.engine = new AudioEngine();
					this.bg = new BackgroundEngine(document.getElementById('bg'));

					this.els = {
						player: document.getElementById('player'),
						settingsBtn: document.getElementById('settingsBtn'),
						mSettingsBtn: document.getElementById('mSettingsBtn'),
						settingsMenu: document.getElementById('settingsMenu'),
						leftTrigger: document.getElementById('leftTrigger'),
						rightTrigger: document.getElementById('rightTrigger'),
						leftTab: document.getElementById('leftTab'),
						rightTab: document.getElementById('rightTab'),
						socialPanel: document.getElementById('socialPanel'),
						musicPanel: document.getElementById('musicPanel'),
						mobileBackdrop: document.getElementById('mobileBackdrop'),
						rainToggle: document.getElementById('rainToggle'),
						playBtn: document.getElementById('playBtn'),
						iconPlay: document.getElementById('iconPlay'),
						iconPause: document.getElementById('iconPause'),
						trackName: document.getElementById('trackName'),
						trackStatus: document.getElementById('trackStatus'),
						widgetTrack: document.getElementById('widgetTrack'),
						qrModal: document.getElementById('qrModal'),
						qrTitle: document.getElementById('qrTitle'),
						qrLink: document.getElementById('qrLink'),
						qrImage: document.getElementById('qr-image'),
						tagline: document.getElementById('tagline'),
						ctxMenu: document.getElementById('ctx-menu'),
						copyLinkBtn: document.getElementById('copyLinkBtn'),
						visBars: document.querySelectorAll('.vis-bar'),
					};

					this.els.tagline.innerText =
						CONFIG.quotes[Math.floor(Math.random() * CONFIG.quotes.length)];

					this.setupDrag();
					this.bindEvents();
					this.updateVisualizer();
				},

				setupDrag() {
					const player = this.els.player;
					let isDragging = false;
					let startX, startY, startLeft, startTop;

					if (window.innerWidth < 768) return;

					const savedPos = localStorage.getItem('playerPos');
					if (savedPos) {
						try {
							const { left, top } = JSON.parse(savedPos);
							player.style.bottom = 'auto';
							player.style.right = 'auto';
							player.style.left = left + 'px';
							player.style.top = top + 'px';
						} catch (e) {}
					}

					player.addEventListener('mousedown', (e) => {
						if (e.target.closest('.ctrl-btn') || e.target.closest('input'))
							return;

						isDragging = true;
						const rect = player.getBoundingClientRect();
						startX = e.clientX;
						startY = e.clientY;
						startLeft = rect.left;
						startTop = rect.top;

						player.style.bottom = 'auto';
						player.style.right = 'auto';
						player.style.left = rect.left + 'px';
						player.style.top = rect.top + 'px';
						player.style.transition = 'none';
					});

					document.addEventListener('mousemove', (e) => {
						if (!isDragging) return;

						let newX = startLeft + (e.clientX - startX);
						let newY = startTop + (e.clientY - startY);

						const maxX = window.innerWidth - player.offsetWidth;
						const maxY = window.innerHeight - player.offsetHeight;

						newX = Math.max(0, Math.min(newX, maxX));
						newY = Math.max(0, Math.min(newY, maxY));

						player.style.left = newX + 'px';
						player.style.top = newY + 'px';
					});

					document.addEventListener('mouseup', () => {
						if (!isDragging) return;
						isDragging = false;
						player.style.transition = '';

						const rect = player.getBoundingClientRect();
						localStorage.setItem(
							'playerPos',
							JSON.stringify({ left: rect.left, top: rect.top }),
						);
					});
				},

				updateVisualizer() {
					requestAnimationFrame(() => this.updateVisualizer());
					if (
						!this.engine.analyser ||
						(!this.engine.isPlaying && this.engine.webAudio.paused)
					) {
						this.els.visBars.forEach((bar) => (bar.style.height = '15%'));
						return;
					}

					const dataArray = new Uint8Array(
						this.engine.analyser.frequencyBinCount,
					);
					this.engine.analyser.getByteFrequencyData(dataArray);

					// Мапим 5 полосок на разные частоты
					const step = Math.floor(dataArray.length / 5);
					for (let i = 0; i < 5; i++) {
						let value = dataArray[i * step];
						// Плавное затухание для более мягкого вида
						let height = Math.max(15, (value / 255) * 100);
						this.els.visBars[i].style.height = height + '%';
					}
				},

				bindEvents() {
					const { els, engine, bg } = this;

					// Settings
					const toggleSettings = () =>
						els.settingsMenu.classList.toggle('open');
					els.settingsBtn.onclick = toggleSettings;
					els.mSettingsBtn.onclick = toggleSettings;

					// Background effects
					document.querySelectorAll('[data-effect]').forEach((btn) => {
						btn.onclick = (e) => {
							document
								.querySelectorAll('[data-effect]')
								.forEach((b) => b.classList.remove('active'));
							e.target.classList.add('active');
							bg.setEffect(e.target.dataset.effect);
						};
					});

					// Rain sound
					els.rainToggle.onchange = (e) => {
						if (e.target.checked) engine.startRainSounds();
						else engine.stopRainSounds();
					};

					// Desktop Panels (Hover)
					let leftTimer, rightTimer;

					const openLeft = () => {
						if (window.innerWidth >= 768) {
							clearTimeout(leftTimer);
							els.socialPanel.classList.add('open');
							els.leftTab.classList.add('tab-hidden');
						}
					};
					const closeLeft = () => {
						if (window.innerWidth >= 768) {
							leftTimer = setTimeout(() => {
								els.socialPanel.classList.remove('open');
								els.leftTab.classList.remove('tab-hidden');
							}, 400);
						}
					};
					els.leftTrigger.addEventListener('mouseenter', openLeft);
					els.leftTrigger.addEventListener('mouseleave', closeLeft);
					els.socialPanel.addEventListener('mouseenter', openLeft);
					els.socialPanel.addEventListener('mouseleave', closeLeft);
					els.leftTab.addEventListener('mouseenter', openLeft);

					const openRight = () => {
						if (window.innerWidth >= 768) {
							clearTimeout(rightTimer);
							els.musicPanel.classList.add('open');
							els.rightTab.classList.add('tab-hidden');
						}
					};
					const closeRight = () => {
						if (window.innerWidth >= 768) {
							rightTimer = setTimeout(() => {
								els.musicPanel.classList.remove('open');
								els.rightTab.classList.remove('tab-hidden');
							}, 400);
						}
					};
					els.rightTrigger.addEventListener('mouseenter', openRight);
					els.rightTrigger.addEventListener('mouseleave', closeRight);
					els.musicPanel.addEventListener('mouseenter', openRight);
					els.musicPanel.addEventListener('mouseleave', closeRight);
					els.rightTab.addEventListener('mouseenter', openRight);

					// Mobile Panels (Click & Backdrop)
					const closeMobilePanels = () => {
						els.socialPanel.classList.remove('open');
						els.musicPanel.classList.remove('open');
						els.mobileBackdrop.classList.remove('active');
					};

					document.getElementById('mLeftBtn').onclick = (e) => {
						e.stopPropagation();
						els.musicPanel.classList.remove('open');
						els.socialPanel.classList.toggle('open');
						els.mobileBackdrop.classList.toggle(
							'active',
							els.socialPanel.classList.contains('open'),
						);
					};

					document.getElementById('mRightBtn').onclick = (e) => {
						e.stopPropagation();
						els.socialPanel.classList.remove('open');
						els.musicPanel.classList.toggle('open');
						els.mobileBackdrop.classList.toggle(
							'active',
							els.musicPanel.classList.contains('open'),
						);
					};

					els.mobileBackdrop.onclick = closeMobilePanels;

					// Music Modes
					document.querySelectorAll('[data-mode]').forEach((btn) => {
						btn.onclick = (e) => {
							document
								.querySelectorAll('[data-mode]')
								.forEach((b) => b.classList.remove('active'));
							e.target.classList.add('active');
							engine.setMode(e.target.dataset.mode);
							if (e.target.dataset.mode !== 'playlist') {
								const names = {
									ambient: 'Ambient',
									deep: 'Deep Space',
									rain: 'Lo-Fi',
								};
								this.updateTrackInfo(names[e.target.dataset.mode], 'Генератор');
							}
						};
					});

					// Player Controls
					els.playBtn.onclick = () => {
						const isPlaying = engine.togglePlay();
						this.updatePlayState(isPlaying);
					};
					document.getElementById('nextBtn').onclick = () => engine.nextTrack();
					document.getElementById('prevBtn').onclick = () => engine.prevTrack();

					document.getElementById('volSlider').oninput = (e) =>
						engine.setVolume(e.target.value);
					const webAudio = document.getElementById('webAudio');
					webAudio.onplay = () => this.updatePlayState(true);
					webAudio.onpause = () => this.updatePlayState(false);
					webAudio.onended = () => engine.nextTrack();

					// Socials
					document.querySelectorAll('.soc-item').forEach((item) => {
						item.onclick = () => {
							const url = item.dataset.url;
							els.qrTitle.innerText = item.dataset.name;
							els.qrLink.href = url;
							els.qrModal.classList.add('open');

							QRCode.toDataURL(
								url,
								{
									width: 200,
									margin: 2,
									color: { dark: '#a78bfa', light: '#0d111c' },
								},
								(err, url) => {
									if (!err) els.qrImage.src = url;
								},
							);
						};
					});

					els.qrModal.onclick = (e) => {
						if (e.target === els.qrModal) els.qrModal.classList.remove('open');
					};

					// Context Menu
					document.addEventListener('contextmenu', (e) => {
						e.preventDefault();
						els.ctxMenu.style.display = 'flex';
						let x = e.clientX,
							y = e.clientY;
						if (x + 180 > window.innerWidth) x -= 180;
						if (y + 160 > window.innerHeight) y -= 160;
						els.ctxMenu.style.left = `${x}px`;
						els.ctxMenu.style.top = `${y}px`;
					});
					document.addEventListener('click', (e) => {
						if (!els.ctxMenu.contains(e.target))
							els.ctxMenu.style.display = 'none';
					});

					els.copyLinkBtn.onclick = () => {
						navigator.clipboard.writeText(window.location.href);
						const original = els.copyLinkBtn.innerHTML;
						els.copyLinkBtn.innerText = 'Скопировано!';
						setTimeout(() => (els.copyLinkBtn.innerHTML = original), 2000);
					};
				},

				updatePlayState(isPlaying) {
					if (isPlaying) {
						this.els.iconPlay.style.display = 'none';
						this.els.iconPause.style.display = 'block';
						this.els.player.classList.add('playing');
					} else {
						this.els.iconPlay.style.display = 'block';
						this.els.iconPause.style.display = 'none';
						this.els.player.classList.remove('playing');
					}
				},

				updateTrackInfo(name, status) {
					this.els.trackName.innerText = name;
					this.els.trackStatus.innerText = status;
					this.els.widgetTrack.innerText = name;
				},
			};

			document.addEventListener('DOMContentLoaded', () => UI.init());
		</script>
	</body>
