<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noclipov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#8b5cf6;
    --cyan:#06b6d4;
    --pink:#ec4899;
    --txt:#e2e8f0;
    --muted:#94a3b8;
    --bg:#05060a;
    --card-bg:rgba(15, 18, 30, 0.65);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  /* ---------- КАСТОМНЫЙ СКРОЛЛБАР ---------- */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, var(--violet), var(--cyan));
    border-radius: 10px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--pink), var(--violet)); }

  html,body{ height:100%; }

  body{
    font-family:"Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1000px 600px at 50% -10%, #111424 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 110%, #0a121d 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    display:grid;
    place-items:center;
    padding:32px 16px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ФОН ---------- */
  .aurora{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    filter:blur(100px); opacity:.25;
    will-change: transform;
  }
  .blob{ position:absolute; border-radius:50%; mix-blend-mode:screen; will-change:transform; }
  .b1{ width:500px; height:500px; background:#4c1d95; top:-150px; left:-100px; animation:drift1 22s ease-in-out infinite; }
  .b2{ width:450px; height:450px; background:#164e63; bottom:-150px; right:-100px; animation:drift2 28s ease-in-out infinite; }
  .b3{ width:380px; height:380px; background:#831843; top:45%; left:65%; animation:drift3 34s ease-in-out infinite; opacity:.6; }

  @keyframes drift1 { 0%,100%{ transform:translate3d(0,0,0) scale(1); } 50%{ transform:translate3d(100px,60px,0) scale(1.1); } }
  @keyframes drift2 { 0%,100%{ transform:translate3d(0,0,0) scale(1.05); } 50%{ transform:translate3d(-120px,-60px,0) scale(.95); } }
  @keyframes drift3 { 0%,100%{ transform:translate3d(0,0,0) scale(.98); } 50%{ transform:translate3d(-80px,90px,0) scale(1.15); } }

  #bg{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- ШЕСТЕРЕНКА И НАСТРОЙКИ ---------- */
  .settings-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
  }
  .settings-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all .3s;
    backdrop-filter: blur(10px);
  }
  .settings-btn:hover {
    color: #fff;
    background: rgba(255,255,255,.1);
    transform: rotate(90deg);
  }
  .settings-btn svg { width: 20px; height: 20px; }

  .settings-menu {
    position: absolute;
    top: 50px; right: 0;
    width: 220px;
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 10px 30px rgba(0,0,0,.8);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);
    transition: all .3s cubic-bezier(.2,.8,.2,1);
  }
  .settings-menu.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .settings-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .effect-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .effect-btn {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    color: var(--muted);
    padding: 8px;
    border-radius: 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .effect-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .effect-btn.active {
    background: rgba(139,92,246,.2);
    border-color: rgba(139,92,246,.5);
    color: #fff;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--txt);
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  
  /* Свитч */
  .switch {
    position: relative; display: inline-block;
    width: 36px; height: 20px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(255,255,255,.1);
    transition: .3s; border-radius: 20px;
  }
  .slider:before {
    position: absolute; content: "";
    height: 14px; width: 14px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .3s; border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--cyan); }
  input:checked + .slider:before { transform: translateX(16px); }

  /* ---------- КАРТОЧКА ---------- */
  .wrap{ position:relative; z-index:2; animation:rise 1s cubic-bezier(.2,.85,.25,1) both; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(30px) scale(.97); filter:blur(6px); }
    to  { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }

  .card{
    position:relative;
    width:min(92vw, 380px);
    border-radius:28px;
    background: var(--card-bg);
    border:1px solid rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    box-shadow:
      0 40px 100px -20px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.1) inset;
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .card::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 0;
  }

  .card::after{
    content:"";
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%), rgba(139,92,246,.12), transparent 60%);
    opacity:0; transition:opacity .4s;
    z-index: 0;
  }
  .card:hover::after{ opacity:1; }

  .card-content {
    position: relative; z-index: 1;
    padding: 36px 28px 24px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ---------- АВАТАР ---------- */
  .avatar{
    position:relative;
    width:100px; height:100px;
    margin:0 auto 20px;
    transform:translateZ(40px);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .avatar { transform: translateZ(40px) translateY(-4px); }
  
  .avatar::before{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    filter:blur(12px); opacity:.5;
    animation:spin 10s linear infinite;
  }
  .avatar::after{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    animation:spin 10s linear infinite;
  }
  .avatar-inner{
    position:absolute; inset:3px; border-radius:50%; z-index:1;
    background:#0a0b16;
    overflow:hidden;
    display:grid; place-items:center;
    font-size:40px; font-weight:700;
    color:#fff;
  }
  .avatar-inner img{
    width:100%; height:100%; object-fit:cover;
    border-radius:50%;
    filter: brightness(.95);
    loading: lazy;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- ПРОФИЛЬ ---------- */
  .name-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    transform:translateZ(26px);
  }

  .name{
    font-size:26px; font-weight:700;
    letter-spacing:-.03em;
    background:linear-gradient(100deg, #fff 10%, #c4b5fd 40%, #67e8f9 60%, #fff 90%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-250% 0; } }

  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }

  .tagline{
    margin-top:8px; font-size:13px;
    color:var(--muted); letter-spacing:.01em;
    transform:translateZ(18px);
  }

  /* ---------- СОЦ-КНОПКИ ---------- */
  .socials{
    display:flex; gap:10px; justify-content:center;
    margin:24px 0 20px;
    transform:translateZ(22px);
  }
  .soc{
    width:40px; height:40px;
    display:grid; place-items:center;
    border-radius:12px;
    color:#8b8fab;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    text-decoration:none;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  .soc:hover{
    transform:translateY(-3px) scale(1.05);
    color:#fff;
    background:rgba(139,92,246,.15);
    border-color:rgba(139,92,246,.4);
    box-shadow:0 8px 20px -8px rgba(139,92,246,.6);
  }
  .soc svg{ width:18px; height:18px; }

  /* ---------- ПЛЕЕР ---------- */
  .player-section {
    width: 100%;
    margin-top: 8px;
    transform: translateZ(30px);
  }

  .now-playing {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 10px; height: 14px;
    opacity: 0; transition: opacity 0.3s;
  }
  .now-playing.visible { opacity: 1; }
  .now-playing span { color: var(--txt); font-weight: 600; }

  .visualizer {
    display: flex; align-items: flex-end; gap: 2px;
    height: 10px; opacity: 0; transition: opacity 0.3s;
  }
  .now-playing.visible .visualizer { opacity: 1; }
  .visualizer div {
    width: 3px; background: var(--cyan); border-radius: 2px; height: 100%;
    transform-origin: bottom;
  }
  .playing .visualizer div:nth-child(1) { animation: eq 0.8s ease-in-out infinite alternate; }
  .playing .visualizer div:nth-child(2) { animation: eq 0.6s ease-in-out infinite alternate 0.1s; background: var(--violet); }
  .playing .visualizer div:nth-child(3) { animation: eq 0.9s ease-in-out infinite alternate 0.2s; }
  .playing .visualizer div:nth-child(4) { animation: eq 0.7s ease-in-out infinite alternate 0.15s; background: var(--pink); }
  @keyframes eq { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }

  .player{
    display:flex; align-items:center; gap:12px;
    padding:8px 12px; border-radius:16px;
    background:rgba(0,0,0,.2);
    border:1px solid rgba(255,255,255,.04);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.2);
  }

  .music-btn{
    flex-shrink:0; width:36px; height:36px;
    display:grid; place-items:center;
    border-radius:50%; color:#fff;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    border:none; cursor:pointer;
    transition:all .2s;
    box-shadow: 0 4px 12px rgba(139,92,246,.4);
  }
  .music-btn:hover{ transform:scale(1.05); box-shadow: 0 6px 16px rgba(139,92,246,.6); }
  .music-btn:active{ transform:scale(.95); }
  .music-btn svg{ width:14px; height:14px; }
  .music-btn.playing { background: linear-gradient(135deg, var(--pink), var(--violet)); box-shadow: 0 4px 12px rgba(236,72,153,.4); }

  .vol-wrap{ flex-grow:1; display:flex; align-items:center; padding: 0 4px; }
  
  input[type=range]{
    -webkit-appearance:none; width:100%;
    background:transparent; height: 16px;
  }
  input[type=range]:focus{ outline:none; }
  input[type=range]::-webkit-slider-runnable-track{
    width:100%; height:4px; cursor:pointer;
    background: linear-gradient(to right, var(--violet), var(--cyan), var(--pink)) 0 0 / var(--vol-pct, 50%) 100% no-repeat, rgba(255,255,255,.1);
    border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    height:12px; width:12px; border-radius:50%;
    background:#fff; cursor:pointer; -webkit-appearance:none; margin-top:-4px;
    box-shadow:0 0 8px rgba(255,255,255,.6);
    transition:transform .2s;
  }
  input[type=range]:hover::-webkit-slider-thumb{ transform:scale(1.2); }
  input[type=range]::-moz-range-track{ width:100%; height:4px; cursor:pointer; background:rgba(255,255,255,.1); border-radius:2px; }
  input[type=range]::-moz-range-progress{ height:4px; background: linear-gradient(to right, var(--violet), var(--cyan), var(--pink)); border-radius:2px; }
  input[type=range]::-moz-range-thumb{
    height:12px; width:12px; border-radius:50%;
    background:#fff; cursor:pointer; border:none;
    box-shadow:0 0 8px rgba(255,255,255,.6);
    transition:transform .2s;
  }
  input[type=range]:hover::-moz-range-thumb{ transform:scale(1.2); }

  .vibe-selector {
    display: flex; background: rgba(0,0,0,.3);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 12px; padding: 3px; margin-top: 12px;
  }
  .vibe-btn {
    flex: 1; background: transparent; border: none;
    color: var(--muted); font-family: inherit;
    font-size: 11px; font-weight: 500;
    padding: 6px 0; border-radius: 9px; cursor: pointer;
    transition: all .3s;
  }
  .vibe-btn:hover { color: var(--txt); }
  .vibe-btn.active { color: #fff; background: rgba(255,255,255,.08); box-shadow: 0 2px 8px rgba(0,0,0,.2); }

  /* ---------- КАСТОМНОЕ КОНТЕКСТНОЕ МЕНЮ ---------- */
  #ctx-menu {
    display: none; position: fixed; z-index: 9999;
    background: rgba(15, 17, 26, 0.9);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 6px; min-width: 160px;
    box-shadow: 0 10px 30px rgba(0,0,0,.9);
    flex-direction: column; gap: 2px;
    animation: ctxIn 0.15s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes ctxIn { from { opacity: 0; transform: scale(0.95) translateY(-5px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .ctx-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; color: var(--txt);
    font-size: 12px; font-weight: 500;
    text-decoration: none; border-radius: 8px;
    cursor: pointer; transition: background .2s;
    border: none; background: transparent; width: 100%; text-align: left;
    font-family: inherit;
  }
  .ctx-item:hover { background: rgba(139,92,246,.2); }
  .ctx-item svg { width: 14px; height: 14px; opacity: 0.7; }
  .ctx-item:hover svg { opacity: 1; }
  .ctx-sep { height: 1px; background: rgba(255,255,255,.08); margin: 4px 0; }

  @media (max-width:380px){
    .vibe-btn { font-size: 10px; }
    .settings-container { top: 10px; right: 10px; }
  }
</style>
</head>
<body>

<!-- Настройки -->
<div class="settings-container">
  <button class="settings-btn" id="settingsBtn" aria-label="Настройки">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
  
  <div class="settings-menu" id="settingsMenu">
    <div class="settings-title">Фоновый эффект</div>
    <div class="effect-grid">
      <button class="effect-btn active" data-effect="stars">Звезды</button>
      <button class="effect-btn" data-effect="snow">Снег</button>
      <button class="effect-btn" data-effect="rain">Дождь</button>
      <button class="effect-btn" data-effect="vertices">Нейросеть</button>
    </div>
    
    <div class="toggle-row">
      <span>Шум дождя</span>
      <label class="switch">
        <input type="checkbox" id="rainSoundToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<!-- Контекстное меню -->
<div id="ctx-menu">
  <button class="ctx-item" onclick="location.reload()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.3L21 8"/></svg>
    Обновить
  </button>
  <button class="ctx-item" onclick="navigator.clipboard.writeText(window.location.href); this.innerText='Скопировано!'; setTimeout(()=>this.innerHTML='<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><path d=\'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\'/><path d=\'M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\'/></svg> Копировать ссылку\';, 2000)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    Копировать ссылку
  </button>
  <div class="ctx-sep"></div>
  <a class="ctx-item" href="https://github.com/noclipov" target="_blank">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg>
    GitHub Профиль
  </a>
</div>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<canvas id="bg"></canvas>

<div class="wrap">
  <section class="card" id="card">
    <div class="card-content">
      
      <div class="avatar">
        <div class="avatar-inner">
          <img src="https://github.com/noclipov.png" alt="noclipov" onerror="this.style.display='none'; this.parentElement.innerText='n';">
        </div>
      </div>

      <div class="name-row">
        <h1 class="name">noclipov</h1>
        <div class="status-dot" title="Online"></div>
      </div>
      
      <p class="tagline">where the light fades and echoes remain</p>

      <div class="socials">
        <a class="soc" href="https://github.com/noclipov" aria-label="GitHub" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/></svg>
        </a>
        <a class="soc" href="#" aria-label="Telegram">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 3.4 2.9 10.7c-.94.37-.93 1.7.02 2.04l4.7 1.66 1.8 5.55c.27.84 1.32 1.03 1.86.34l2.5-3.2 4.72 3.48c.72.53 1.75.13 1.9-.75l2.9-15.2c.17-.9-.72-1.6-1.4-1.22zM9.6 14.1l-.3 3.2-1.2-3.7 9.2-6.3-7.7 6.8z"/></svg>
        </a>
        <a class="soc" href="#" aria-label="Mail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3.2"/><path d="m3.4 7.6 7.6 5.4a1.8 1.8 0 0 0 2 0l7.6-5.4"/></svg>
        </a>
      </div>

      <div class="player-section">
        <div class="now-playing" id="nowPlaying">
          <div class="visualizer"><div></div><div></div><div></div><div></div></div>
          <span id="vibeName">Ambient</span>
        </div>

        <div class="player">
          <button class="music-btn" id="musicBtn" aria-label="Включить музыку">
            <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          
          <div class="vol-wrap">
            <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.5">
          </div>
        </div>

        <div class="vibe-selector">
          <button class="vibe-btn active" data-vibe="ambient">Ambient</button>
          <button class="vibe-btn" data-vibe="deep">Deep Space</button>
          <button class="vibe-btn" data-vibe="rain">Lo-Fi</button>
          <button class="vibe-btn" data-vibe="internet">Stream</button>
        </div>
      </div>

    </div>
  </section>
</div>

<audio id="webAudio" loop crossorigin="anonymous">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
  "use strict";

  /* =========================================================
     1. НАСТРОЙКИ И КОНТЕКСТНОЕ МЕНЮ
     ========================================================= */
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  
  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsMenu.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
      settingsMenu.classList.remove('open');
    }
  });

  const ctxMenu = document.getElementById("ctx-menu");
  document.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    ctxMenu.style.display = "flex";
    let x = e.clientX, y = e.clientY;
    if (x + 180 > window.innerWidth) x -= 180;
    if (y + 140 > window.innerHeight) y -= 140;
    ctxMenu.style.left = `${x}px`;
    ctxMenu.style.top = `${y}px`;
  });
  document.addEventListener("click", (e) => {
    if (!ctxMenu.contains(e.target)) ctxMenu.style.display = "none";
  });

  /* =========================================================
     2. ФОНОВЫЕ ЭФФЕКТЫ (Canvas)
     ========================================================= */
  const canvas = document.getElementById("bg");
  const c2d = canvas.getContext("2d", { alpha: true });
  let W = 0, H = 0;
  let particles = [];
  let currentEffect = 'stars';
  let animationFrameId;
  let isTabActive = true;

  // Остановка рендера при скрытой вкладке (Оптимизация)
  document.addEventListener("visibilitychange", () => {
    isTabActive = !document.hidden;
    if (isTabActive) loop();
  });

  function resizeCanvas() {
    W = canvas.width = Math.floor(innerWidth * Math.min(window.devicePixelRatio || 1, 2));
    H = canvas.height = Math.floor(innerHeight * Math.min(window.devicePixelRatio || 1, 2));
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
    initEffect(currentEffect);
  }

  function initEffect(mode) {
    currentEffect = mode;
    particles = [];
    
    // Оптимизированное количество частиц
    let count = 0;
    if (mode === 'stars' || mode === 'snow') count = Math.min(80, Math.max(30, innerWidth / 20));
    if (mode === 'rain') count = Math.min(150, Math.max(60, innerWidth / 10));
    if (mode === 'vertices') count = Math.min(50, Math.max(20, innerWidth / 30)); // Меньше частиц для O(N^2) связей

    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * (mode === 'vertices' ? 0.5 : 0.1) * (innerWidth / 1000),
        vy: (mode === 'rain' ? (Math.random() * 8 + 8) : (mode === 'snow' ? (Math.random() * 0.5 + 0.2) : -(Math.random() * 0.2 + 0.05))) * (innerWidth / 1000),
        r: (Math.random() * 1.5 + 0.5) * (mode === 'snow' ? 2 : 1),
        a: Math.random() * 0.5 + 0.1,
        ph: Math.random() * Math.PI * 2,
        sp: Math.random() * 0.02 + 0.01
      });
    }
  }

  function draw() {
    c2d.clearRect(0, 0, W, H);
    
    if (currentEffect === 'stars' || currentEffect === 'snow' || currentEffect === 'vertices') {
      c2d.fillStyle = currentEffect === 'snow' ? "rgba(255,255,255,0.7)" : "rgba(180,190,230,0.6)";
      c2d.shadowBlur = 8;
      c2d.shadowColor = "rgba(139,92,246,0.3)";
    } else if (currentEffect === 'rain') {
      c2d.strokeStyle = "rgba(160,180,220,0.3)";
      c2d.lineWidth = 1;
    }

    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      
      // Логика движения
      if (currentEffect === 'snow') {
        p.ph += p.sp;
        p.x += p.vx + Math.sin(p.ph) * 0.5;
        p.y += p.vy;
      } else if (currentEffect === 'rain') {
        p.x += p.vx;
        p.y += p.vy;
      } else if (currentEffect === 'vertices') {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
      } else {
        p.ph += p.sp;
        p.x += p.vx;
        p.y += p.vy;
      }

      // Сброс позиции
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      // Отрисовка
      if (currentEffect === 'rain') {
        c2d.beginPath();
        c2d.moveTo(p.x, p.y);
        c2d.lineTo(p.x, p.y + 15);
        c2d.stroke();
      } else if (currentEffect === 'snow') {
        c2d.beginPath();
        c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        c2d.fill();
      } else if (currentEffect === 'stars') {
        const alpha = p.a * (0.6 + 0.4 * Math.sin(p.ph));
        c2d.globalAlpha = alpha;
        c2d.beginPath();
        c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        c2d.fill();
        c2d.globalAlpha = 1;
      } else if (currentEffect === 'vertices') {
        c2d.globalAlpha = 0.6;
        c2d.beginPath();
        c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        c2d.fill();
        
        // Соединение линиями
        for (let j = i + 1; j < particles.length; j++) {
          let p2 = particles[j];
          let dx = p.x - p2.x;
          let dy = p.y - p2.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          
          if (dist < W * 0.15) { // Радиус связи
            c2d.beginPath();
            c2d.moveTo(p.x, p.y);
            c2d.lineTo(p2.x, p2.y);
            c2d.strokeStyle = `rgba(139,92,246,${0.2 * (1 - dist / (W * 0.15))})`;
            c2d.stroke();
          }
        }
        c2d.globalAlpha = 1;
      }
    }
    
    c2d.shadowBlur = 0;
    if (isTabActive) animationFrameId = requestAnimationFrame(draw);
  }

  function loop() {
    cancelAnimationFrame(animationFrameId);
    if (isTabActive) draw();
  }

  resizeCanvas();
  addEventListener("resize", resizeCanvas);
  loop();

  // Переключение эффектов
  document.querySelectorAll('.effect-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      initEffect(e.target.dataset.effect);
      loop();
    });
  });

  /* =========================================================
     3. 3D-НАКЛОН
     ========================================================= */
  const card = document.getElementById("card");
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let raf = null;

  function move(e) {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;

      const rx = (0.5 - ny) * 6;
      const ry = (nx - 0.5) * 8;

      card.style.transform = `perspective(1000px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
      card.style.setProperty("--mx", (nx * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (ny * 100).toFixed(1) + "%");
    });
  }

  function reset() {
    card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg)";
    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "0%");
  }

  if (fine) {
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseleave", reset);
  }

  /* =========================================================
     4. АУДИО СИСТЕМА (Музыка + Дождь)
     ========================================================= */
  const webAudio = document.getElementById('webAudio');
  const nowPlaying = document.getElementById('nowPlaying');
  const vibeName = document.getElementById('vibeName');
  const rainToggle = document.getElementById('rainSoundToggle');

  const AudioSystem = (() => {
    let ac = null;
    let masterGain = null;
    let musicVolumeGain = null;
    let rainVolumeGain = null;
    let sendBus = null;
    let playing = false;
    let chordTimer = null;
    let noteTimer = null;
    let step = 0;
    let currentVibe = "ambient";
    let activeOscs = [];
    let rainSource = null;
    let isRainPlaying = false;

    const VIBES = {
      ambient: { name: "Ambient", chords: [[174.61, 220.00, 261.63], [130.81, 164.81, 196.00], [196.00, 246.94, 293.66], [146.83, 174.61, 220.00]], scale: [523.25, 587.33, 659.25, 783.99, 880.00], filter: 1800, chordDur: 10.0, chordInt: 8000, bellInt: 3500 },
      deep: { name: "Deep Space", chords: [[110.00, 130.81, 164.81], [87.31, 110.00, 130.81], [98.00, 123.47, 146.83], [116.54, 146.83, 174.61]], scale: [261.63, 293.66, 329.63, 392.00, 440.00], filter: 800, chordDur: 14.0, chordInt: 10000, bellInt: 6000 },
      rain: { name: "Lo-Fi Rain", chords: [[146.83, 174.61, 220.00], [130.81, 164.81, 196.00], [110.00, 130.81, 164.81], [98.00, 123.47, 146.83]], scale: [440.00, 523.25, 587.33, 659.25, 783.99], filter: 1200, chordDur: 8.0, chordInt: 6000, bellInt: 2000 },
      internet: { name: "Internet Stream" }
    };

    function init() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();

      masterGain = ac.createGain();
      masterGain.gain.value = 1.0;

      musicVolumeGain = ac.createGain();
      musicVolumeGain.gain.value = parseFloat(document.getElementById('volSlider').value) * 0.35;

      rainVolumeGain = ac.createGain();
      rainVolumeGain.gain.value = 0; // По умолчанию выключен

      masterGain.connect(ac.destination);
      musicVolumeGain.connect(masterGain);
      rainVolumeGain.connect(masterGain);

      // Шина эффектов для музыки
      const delay = ac.createDelay(1.5);
      delay.delayTime.value = 0.5;
      const fb = ac.createGain(); fb.gain.value = 0.4;
      const damp = ac.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 1000;
      const wet = ac.createGain(); wet.gain.value = 0.6;

      delay.connect(damp); damp.connect(fb); fb.connect(delay); damp.connect(wet); wet.connect(musicVolumeGain);
      sendBus = delay;

      // Генератор шума дождя (Pink Noise)
      createRainNoise();
    }

    function createRainNoise() {
      if (!ac || rainSource) return;
      
      const bufferSize = ac.sampleRate * 2;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      
      let lastOut = 0;
      for (let i = 0; i < bufferSize; i++) {
        let white = Math.random() * 2 - 1;
        data[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = data[i];
        data[i] *= 3.5;
      }

      rainSource = ac.createBufferSource();
      rainSource.buffer = buffer;
      rainSource.loop = true;

      // Фильтр для дождя
      const rainFilter = ac.createBiquadFilter();
      rainFilter.type = "lowpass";
      rainFilter.frequency.value = 400; // Глухой звук

      const rainHighpass = ac.createBiquadFilter();
      rainHighpass.type = "highpass";
      rainHighpass.frequency.value = 200;

      rainSource.connect(rainFilter);
      rainFilter.connect(rainHighpass);
      rainHighpass.connect(rainVolumeGain);
      
      rainSource.start(0);
    }

    function playChord(freqs, dur) {
      if (!ac) return;
      const t0 = ac.currentTime + 0.05;
      freqs.forEach((f, i) => {
        const osc = ac.createOscillator();
        osc.type = "sine";
        osc.frequency.value = f;
        activeOscs.push(osc);

        const g = ac.createGain();
        const peak = 0.15 / (1 + i * 0.5);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 4.0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
        if (pan) {
          pan.pan.value = (i % 2 ? 0.6 : -0.6);
          osc.connect(g); g.connect(pan); pan.connect(musicVolumeGain); pan.connect(sendBus);
        } else {
          osc.connect(g); g.connect(musicVolumeGain); g.connect(sendBus);
        }
        osc.start(t0); osc.stop(t0 + dur + 0.5);
      });
    }

    function playBell(scale) {
      if (!ac) return;
      const t0 = ac.currentTime + 0.05;
      const f = scale[Math.floor(Math.random() * scale.length)];
      const o1 = ac.createOscillator();
      o1.type = "sine"; o1.frequency.value = f;
      activeOscs.push(o1);

      const env = ac.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(0.03, t0 + 0.8);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.0);

      o1.connect(env); env.connect(musicVolumeGain); env.connect(sendBus);
      o1.start(t0); o1.stop(t0 + 4.5);
    }

    function killAllMusic() {
      activeOscs.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
      activeOscs = [];
      if (musicVolumeGain) musicVolumeGain.gain.cancelScheduledValues(ac.currentTime);
    }

    function startGen() {
      init();
      if (ac.state === "suspended") ac.resume();
      playing = true;
      step = 0;
      const cfg = VIBES[currentVibe];

      const now = ac.currentTime;
      musicVolumeGain.gain.cancelScheduledValues(now);
      musicVolumeGain.gain.setValueAtTime(0.0001, now);
      // Восстанавливаем громкость с учетом ползунка
      const targetVol = parseFloat(document.getElementById('volSlider').value) * 0.35;
      musicVolumeGain.gain.linearRampToValueAtTime(targetVol, now + 2.0);

      playChord(cfg.chords[0], cfg.chordDur);
      step = 1;

      chordTimer = setInterval(() => {
        playChord(cfg.chords[step % cfg.chords.length], cfg.chordDur);
        step++;
      }, cfg.chordInt);

      noteTimer = setInterval(() => {
        if (Math.random() < 0.6) playBell(cfg.scale);
      }, cfg.bellInt);
    }

    function stopGen() {
      playing = false;
      clearInterval(chordTimer);
      clearInterval(noteTimer);
      chordTimer = noteTimer = null;

      if (!ac) return;
      const now = ac.currentTime;
      musicVolumeGain.gain.cancelScheduledValues(now);
      musicVolumeGain.gain.setValueAtTime(musicVolumeGain.gain.value, now);
      musicVolumeGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
      
      setTimeout(killAllMusic, 200);
    }

    function setVibe(vibe) {
      const wasPlaying = playing || !webAudio.paused;
      stopGen();
      webAudio.pause();
      currentVibe = vibe;
      vibeName.textContent = VIBES[vibe].name;

      if (wasPlaying) {
        setTimeout(() => {
          if (currentVibe === 'internet') {
            webAudio.volume = parseFloat(document.getElementById('volSlider').value);
            webAudio.play();
            updatePlayState(true);
          } else {
            startGen();
            updatePlayState(true);
          }
        }, 250);
      } else {
        updatePlayState(false);
      }
    }

    return {
      toggle() {
        if (currentVibe === 'internet') {
          if (webAudio.paused) { webAudio.volume = parseFloat(document.getElementById('volSlider').value); webAudio.play(); return true; }
          else { webAudio.pause(); return false; }
        } else {
          if (playing) { stopGen(); return false; }
          startGen(); return true;
        }
      },
      setVolume(val) {
        if (!ac) return;
        if (currentVibe === 'internet') {
          webAudio.volume = val;
        } else {
          musicVolumeGain.gain.setTargetAtTime(val * 0.35, ac.currentTime, 0.1);
        }
      },
      toggleRain(isOn) {
        init(); // На случай, если AudioContext еще не создан
        if (ac.state === "suspended") ac.resume();
        
        isRainPlaying = isOn;
        const now = ac.currentTime;
        rainVolumeGain.gain.cancelScheduledValues(now);
        rainVolumeGain.gain.setValueAtTime(rainVolumeGain.gain.value, now);
        
        if (isOn) {
          // Плавно включаем дождь
          rainVolumeGain.gain.linearRampToValueAtTime(0.15, now + 2.0);
        } else {
          // Плавно выключаем
          rainVolumeGain.gain.linearRampToValueAtTime(0.0001, now + 1.5);
        }
      },
      setVibe
    };
  })();

  /* =========================================================
     5. UI ПЛЕЕРА И НАСТРОЕК
     ========================================================= */
  const btn = document.getElementById("musicBtn");
  const iconPlay = document.getElementById("iconPlay");
  const iconPause = document.getElementById("iconPause");
  const volSlider = document.getElementById("volSlider");
  const vibeBtns = document.querySelectorAll(".vibe-btn");

  function handleVolumeChange() {
    const val = volSlider.value;
    volSlider.style.setProperty('--vol-pct', `${val * 100}%`);
    AudioSystem.setVolume(val);
  }
  volSlider.addEventListener('input', handleVolumeChange);
  handleVolumeChange();

  function updatePlayState(isPlaying) {
    if (isPlaying) {
      btn.classList.add("playing");
      nowPlaying.classList.add("visible", "playing");
      iconPlay.style.display = "none";
      iconPause.style.display = "block";
    } else {
      btn.classList.remove("playing");
      nowPlaying.classList.remove("playing");
      if (vibeName.textContent) nowPlaying.classList.add("visible");
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
    }
  }

  btn.addEventListener("click", () => {
    const isOn = AudioSystem.toggle();
    updatePlayState(isOn);
  });

  vibeBtns.forEach(b => {
    b.addEventListener("click", () => {
      vibeBtns.forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      AudioSystem.setVibe(b.dataset.vibe);
    });
  });

  webAudio.addEventListener('play', () => updatePlayState(true));
  webAudio.addEventListener('pause', () => updatePlayState(false));

  // Обработка переключателя дождя
  rainToggle.addEventListener('change', (e) => {
    AudioSystem.toggleRain(e.target.checked);
  });

  // Инициализация
  nowPlaying.classList.add("visible");

})();
</script>
</body>
