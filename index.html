<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<title>noclipov</title>
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!-- Локальный генератор QR-кодов -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
		<style>
			:root {
				--primary: #c084fc;
				--secondary: #38bdf8;
				--accent: #f472b6;
				--txt: #e2e8f0;
				--muted: #8b95a8;
				--bg: #020006;
				--card-bg: rgba(15, 10, 25, 0.65);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				-webkit-tap-highlight-color: transparent;
			}

			::-webkit-scrollbar {
				width: 6px;
			}
			::-webkit-scrollbar-track {
				background: var(--bg);
			}
			::-webkit-scrollbar-thumb {
				background: var(--primary);
				border-radius: 10px;
			}

			html,
			body {
				height: 100%;
				overflow: hidden;
			}

			body {
				font-family:
					'Inter',
					-apple-system,
					sans-serif;
				background:
					radial-gradient(
						1200px 800px at 50% -20%,
						#170a2e 0%,
						transparent 60%
					),
					radial-gradient(
						1000px 600px at 100% 120%,
						#061b2b 0%,
						transparent 60%
					),
					var(--bg);
				color: var(--txt);
				display: grid;
				place-items: center;
				position: relative;
				-webkit-font-smoothing: antialiased;
			}

			/* Background */
			.aurora {
				position: fixed;
				inset: 0;
				overflow: hidden;
				pointer-events: none;
				z-index: 0;
				filter: blur(100px);
				opacity: 0.25;
			}
			.blob {
				position: absolute;
				border-radius: 50%;
				mix-blend-mode: screen;
			}
			.b1 {
				width: 60vw;
				height: 60vw;
				background: #4c1d95;
				top: -20%;
				left: -10%;
				animation: drift 25s infinite alternate;
			}
			.b2 {
				width: 50vw;
				height: 50vw;
				background: #0e7490;
				bottom: -20%;
				right: -10%;
				animation: drift 30s infinite alternate-reverse;
			}

			@keyframes drift {
				0% {
					transform: translate(0, 0) scale(1);
				}
				100% {
					transform: translate(10%, 10%) scale(1.1);
				}
			}

			#bg {
				position: fixed;
				inset: 0;
				z-index: 1;
				pointer-events: none;
			}

			/* Profile Card */
			.card {
				position: relative;
				z-index: 2;
				width: min(90vw, 380px);
				border-radius: 28px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				backdrop-filter: blur(24px) saturate(160%);
				box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.9);
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 40px 24px;
				animation: rise 1s cubic-bezier(0.2, 0.85, 0.25, 1) both;
			}
			@keyframes rise {
				from {
					opacity: 0;
					transform: translateY(30px) scale(0.95);
				}
				to {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}

			.avatar {
				position: relative;
				width: 100px;
				height: 100px;
				margin-bottom: 20px;
			}
			.avatar::before {
				content: '';
				position: absolute;
				inset: -4px;
				border-radius: 50%;
				background: conic-gradient(
					from 0deg,
					var(--primary),
					var(--secondary),
					var(--accent),
					var(--primary)
				);
				filter: blur(10px);
				opacity: 0.6;
				animation: spin 10s linear infinite;
			}
			.avatar-inner {
				position: absolute;
				inset: 0;
				border-radius: 50%;
				background: #020006;
				overflow: hidden;
				border: 2px solid rgba(255, 255, 255, 0.1);
				z-index: 1;
				display: grid;
				place-items: center;
				font-size: 40px;
				font-weight: 700;
			}
			.avatar-inner img {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			.name {
				font-size: 26px;
				font-weight: 700;
				background: linear-gradient(
					100deg,
					#fff 10%,
					#d8b4fe 40%,
					#7dd3fc 60%,
					#fff 90%
				);
				background-size: 250% 100%;
				-webkit-background-clip: text;
				background-clip: text;
				color: transparent;
				animation: shimmer 6s linear infinite;
			}
			@keyframes shimmer {
				to {
					background-position: -250% 0;
				}
			}
			.tagline {
				margin-top: 6px;
				font-size: 13px;
				color: var(--muted);
			}

			/* Settings Panel */
			.settings-btn {
				position: fixed;
				top: 20px;
				right: 20px;
				z-index: 100;
				width: 44px;
				height: 44px;
				border-radius: 50%;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				color: var(--muted);
				display: grid;
				place-items: center;
				cursor: pointer;
				backdrop-filter: blur(10px);
				transition: all 0.3s;
			}
			.settings-btn:hover {
				color: #fff;
				transform: rotate(90deg);
			}
			.settings-menu {
				position: fixed;
				top: 70px;
				right: 20px;
				z-index: 99;
				width: 220px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 20px;
				padding: 16px;
				backdrop-filter: blur(24px);
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
				opacity: 0;
				pointer-events: none;
				transform: translateY(-10px);
				transition: all 0.3s;
			}
			.settings-menu.open {
				opacity: 1;
				pointer-events: auto;
				transform: translateY(0);
			}
			.settings-title {
				font-size: 11px;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 8px;
				font-weight: 600;
			}
			.grid-btns {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 6px;
				margin-bottom: 16px;
			}
			.s-btn {
				background: rgba(255, 255, 255, 0.03);
				border: 1px solid rgba(255, 255, 255, 0.05);
				color: var(--muted);
				padding: 8px;
				border-radius: 10px;
				font-size: 11px;
				cursor: pointer;
				transition: all 0.2s;
			}
			.s-btn:hover {
				background: rgba(255, 255, 255, 0.08);
				color: #fff;
			}
			.s-btn.active {
				background: rgba(192, 132, 252, 0.15);
				border-color: rgba(192, 132, 252, 0.4);
				color: #fff;
			}

			/* Toggle */
			.toggle-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
				font-size: 12px;
				padding-top: 10px;
				border-top: 1px solid rgba(255, 255, 255, 0.08);
			}
			.switch {
				position: relative;
				width: 34px;
				height: 18px;
			}
			.switch input {
				opacity: 0;
			}
			.slider {
				position: absolute;
				inset: 0;
				background: rgba(255, 255, 255, 0.1);
				border-radius: 20px;
				transition: 0.3s;
				cursor: pointer;
			}
			.slider::before {
				content: '';
				position: absolute;
				width: 14px;
				height: 14px;
				left: 2px;
				bottom: 2px;
				background: #fff;
				border-radius: 50%;
				transition: 0.3s;
			}
			input:checked + .slider {
				background: var(--secondary);
			}
			input:checked + .slider::before {
				transform: translateX(16px);
			}

			/* Floating Player */
			.floating-player {
				position: fixed;
				bottom: 24px;
				right: 24px;
				z-index: 100;
				display: flex;
				align-items: center;
				gap: 16px;
				padding: 12px 20px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-radius: 24px;
				backdrop-filter: blur(24px);
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
			}

			.visualizer {
				display: flex;
				align-items: flex-end;
				gap: 3px;
				height: 18px;
				width: 24px;
			}
			.vis-bar {
				width: 3px;
				background: var(--secondary);
				border-radius: 3px;
				height: 20%;
				transition: height 0.2s;
			}
			.playing .vis-bar:nth-child(1) {
				animation: eq 0.8s infinite alternate;
			}
			.playing .vis-bar:nth-child(2) {
				animation: eq 0.5s infinite alternate 0.2s;
				background: var(--primary);
			}
			.playing .vis-bar:nth-child(3) {
				animation: eq 0.7s infinite alternate 0.1s;
			}
			.playing .vis-bar:nth-child(4) {
				animation: eq 0.6s infinite alternate 0.3s;
				background: var(--accent);
			}
			@keyframes eq {
				0% {
					height: 20%;
				}
				100% {
					height: 100%;
				}
			}

			.ctrl-btn {
				background: transparent;
				border: none;
				color: var(--muted);
				cursor: pointer;
				display: grid;
				place-items: center;
				transition: 0.2s;
			}
			.ctrl-btn:hover {
				color: #fff;
			}
			.play-btn {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				color: #fff;
				box-shadow: 0 4px 15px rgba(192, 132, 252, 0.4);
			}
			.play-btn:hover {
				transform: scale(1.05);
				box-shadow: 0 6px 20px rgba(192, 132, 252, 0.6);
			}
			.play-btn svg {
				width: 18px;
				height: 18px;
			}

			.track-info {
				display: flex;
				flex-direction: column;
				min-width: 90px;
				max-width: 120px;
			}
			.track-name {
				font-size: 13px;
				font-weight: 600;
				color: #fff;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.track-status {
				font-size: 10px;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.05em;
			}

			.vol-wrap {
				display: flex;
				align-items: center;
				gap: 8px;
				width: 70px;
			}
			.vol-wrap svg {
				width: 14px;
				height: 14px;
				color: var(--muted);
			}
			input[type='range'] {
				-webkit-appearance: none;
				width: 100%;
				background: transparent;
			}
			input[type='range']::-webkit-slider-runnable-track {
				width: 100%;
				height: 4px;
				background: rgba(255, 255, 255, 0.15);
				border-radius: 2px;
			}
			input[type='range']::-webkit-slider-thumb {
				-webkit-appearance: none;
				height: 10px;
				width: 10px;
				border-radius: 50%;
				background: #fff;
				margin-top: -3px;
				box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
			}

			/* Slide-out Social Panel */
			.social-trigger {
				position: fixed;
				left: 0;
				top: 50%;
				transform: translateY(-50%);
				z-index: 100;
				width: 20px;
				height: 80px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-left: none;
				border-radius: 0 12px 12px 0;
				display: grid;
				place-items: center;
				cursor: pointer;
				color: var(--muted);
				transition: 0.3s;
			}
			.social-trigger:hover {
				color: #fff;
				width: 24px;
				background: rgba(192, 132, 252, 0.2);
			}

			.social-panel {
				position: fixed;
				left: 0;
				top: 50%;
				transform: translate(-100%, -50%);
				z-index: 99;
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 16px;
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.08);
				border-left: none;
				border-radius: 0 20px 20px 0;
				backdrop-filter: blur(24px);
				transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
			}
			.social-panel.open {
				transform: translate(0, -50%);
				box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
			}

			.soc-item {
				width: 44px;
				height: 44px;
				border-radius: 14px;
				background: rgba(255, 255, 255, 0.03);
				display: grid;
				place-items: center;
				color: var(--muted);
				cursor: pointer;
				transition: 0.3s;
			}
			.soc-item:hover {
				background: rgba(192, 132, 252, 0.15);
				color: #fff;
				transform: scale(1.05);
			}
			.soc-item svg {
				width: 20px;
				height: 20px;
			}

			/* QR Modal */
			.modal-overlay {
				position: fixed;
				inset: 0;
				z-index: 200;
				background: rgba(0, 0, 0, 0.7);
				backdrop-filter: blur(10px);
				display: flex;
				align-items: center;
				justify-content: center;
				opacity: 0;
				pointer-events: none;
				transition: 0.3s;
			}
			.modal-overlay.open {
				opacity: 1;
				pointer-events: auto;
			}
			.modal-content {
				background: var(--card-bg);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 24px;
				padding: 24px;
				display: flex;
				flex-direction: column;
				align-items: center;
				transform: translateY(20px);
				transition: 0.3s;
			}
			.modal-overlay.open .modal-content {
				transform: translateY(0);
			}
			.qr-wrapper {
				background: #0c0d12;
				padding: 16px;
				border-radius: 20px;
				margin-bottom: 16px;
				border: 1px solid rgba(255, 255, 255, 0.05);
			}
			#qr-canvas {
				display: block;
				border-radius: 8px;
			}
			.modal-btn {
				background: linear-gradient(135deg, var(--primary), var(--secondary));
				color: #fff;
				padding: 10px 30px;
				border-radius: 12px;
				text-decoration: none;
				font-weight: 600;
				font-size: 14px;
			}

			/* Mobile Adaptations */
			@media (max-width: 768px) {
				.floating-player {
					bottom: 0;
					right: 0;
					left: 0;
					border-radius: 24px 24px 0 0;
					justify-content: space-between;
					padding: 16px 20px;
				}
				.vol-wrap {
					display: none;
				}
				.social-trigger {
					top: auto;
					bottom: 100px;
					transform: none;
					width: 44px;
					height: 44px;
					border-radius: 0 12px 12px 0;
				}
				.social-panel {
					top: auto;
					bottom: 160px;
					transform: translate(-100%, 0);
					border-radius: 0 20px 20px 0;
				}
				.social-panel.open {
					transform: translate(0, 0);
				}
				.settings-btn {
					top: 10px;
					right: 10px;
				}
				.settings-menu {
					top: 60px;
					right: 10px;
				}
			}
		</style>
	</head>
	<body>
		<!-- Canvas Background -->
		<canvas id="bg"></canvas>
		<div class="aurora">
			<div class="blob b1"></div>
			<div class="blob b2"></div>
		</div>

		<!-- Profile Card -->
		<div class="card">
			<div class="avatar">
				<div class="avatar-inner">
					<img
						src="https://github.com/noclipov.png"
						alt="avatar"
						onerror="
							this.style.display = 'none';
							this.parentElement.innerText = 'n';
						"
					/>
				</div>
			</div>
			<h1 class="name">noclipov</h1>
			<p class="tagline">where the light fades and echoes remain</p>
		</div>

		<!-- Settings -->
		<button class="settings-btn" id="settingsBtn">
			<svg
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				width="20"
				height="20"
			>
				<circle cx="12" cy="12" r="3"></circle>
				<path
					d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
				></path>
			</svg>
		</button>

		<div class="settings-menu" id="settingsMenu">
			<div class="settings-title">Музыка</div>
			<div class="grid-btns" id="musicModes">
				<button class="s-btn active" data-mode="ambient">Ambient</button>
				<button class="s-btn" data-mode="deep">Deep Space</button>
				<button class="s-btn" data-mode="rain">Lo-Fi</button>
				<button class="s-btn" data-mode="playlist">Playlist</button>
			</div>
			<div class="settings-title">Фон</div>
			<div class="grid-btns" id="bgModes">
				<button class="s-btn active" data-effect="stars">Звезды</button>
				<button class="s-btn" data-effect="snow">Пыль</button>
				<button class="s-btn" data-effect="rain">Дождь</button>
				<button class="s-btn" data-effect="vertices">Сеть</button>
			</div>
			<div class="toggle-row">
				<span>Звук дождя</span>
				<label class="switch"
					><input type="checkbox" id="rainToggle" /><span class="slider"></span
				></label>
			</div>
		</div>

		<!-- Socials Trigger & Panel -->
		<div class="social-trigger" id="socialTrigger">
			<svg
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				width="16"
				height="16"
			>
				<path d="M9 18l6-6-6-6" />
			</svg>
		</div>
		<div class="social-panel" id="socialPanel">
			<div
				class="soc-item"
				data-url="https://github.com/noclipov"
				data-name="GitHub"
			>
				<svg viewBox="0 0 24 24" fill="currentColor">
					<path
						d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"

		<!-- Player -->

		<!-- QR Modal -->
		<div class="modal-overlay" id="qrModal">
			<div class="modal-content">

				<h3 id="qrTitle" style="margin-bottom: 20px; color: #fff">Профиль</h3>

		<audio id="webAudio" loop></audio>

		<script>
			const CONFIG = {
				playlist: [
					{ title: 'марионетка познала безумие', src: 'music/track1.mp3' },
					{ title: 'Набросок (Alternative Version).', src: 'music/track2.mp3' },
					{ title: 'волны', src: 'music/track3.mp3' },
					{ title: 'Слишком хороший', src: 'music/track4.mp3' },
					{ title: 'я понял что значит любить', src: 'music/track5.mp3' },
					{ title: 'Метеорит', src: 'music/track6.mp3' },
					{ title: 'provod', src: 'music/track7.mp3' },
				],
			};

			class BackgroundEngine {
				constructor(canvas) {
					this.canvas = canvas;
					this.ctx = canvas.getContext('2d');
					this.w = 0;
					this.h = 0;
					this.particles = [];
					this.effect = 'stars';
					this.animId = null;

					window.addEventListener('resize', () => this.resize());
					this.resize();
					this.loop();
				}

				resize() {
					this.w = this.canvas.width =
						innerWidth * (window.devicePixelRatio > 1 ? 2 : 1);
					this.h = this.canvas.height =
						innerHeight * (window.devicePixelRatio > 1 ? 2 : 1);
					this.canvas.style.width = innerWidth + 'px';
					this.canvas.style.height = innerHeight + 'px';
					this.initParticles();
				}

				setEffect(mode) {
					this.effect = mode;
					this.initParticles();
				}

				initParticles() {
					this.particles = [];
					let count = 0;
					if (this.effect === 'rain') count = Math.min(100, innerWidth / 15);
					else if (this.effect === 'vertices')
						count = Math.min(40, innerWidth / 30);
					else count = Math.min(80, innerWidth / 20);

					for (let i = 0; i < count; i++) {
						this.particles.push({
							x: Math.random() * this.w,
							y: Math.random() * this.h,
							vx:
								this.effect === 'rain'
									? -2 - Math.random() * 2
									: (Math.random() - 0.5) * 0.2,
							vy:
								this.effect === 'rain'
									? 15 + Math.random() * 10
									: Math.random() * 0.3 + 0.1,
							r:
								this.effect === 'snow'
									? Math.random() * 2 + 1
									: Math.random() * 1.5,
							a: Math.random() * 0.5 + 0.2,
							length: Math.random() * 20 + 15,
						});
					}
				}

				draw() {
					this.ctx.clearRect(0, 0, this.w, this.h);

					if (this.effect === 'rain') {
						this.ctx.strokeStyle = 'rgba(200, 210, 230, 0.25)';
						this.ctx.lineWidth = 1.5;
						this.ctx.lineCap = 'round';
					} else {
						this.ctx.shadowBlur = 10;
						this.ctx.shadowColor = 'rgba(192,132,252,0.3)';
					}

					for (let i = 0; i < this.particles.length; i++) {
						let p = this.particles[i];

						if (this.effect === 'rain') {
							p.x += p.vx * 2;
							p.y += p.vy;
						} else if (this.effect === 'vertices') {
							p.x += p.vx;
							p.y += p.vy;
							if (p.x < 0 || p.x > this.w) p.vx *= -1;
							if (p.y < 0 || p.y > this.h) p.vy *= -1;
						} else {
							p.x += p.vx;
							p.y += p.vy;
						}

						if (p.y > this.h + 50) {
							p.y = -50;
							p.x = Math.random() * this.w;
						}
						if (p.y < -50) {
							p.y = this.h + 50;
							p.x = Math.random() * this.w;
						}
						if (p.x < -50) p.x = this.w + 50;
						if (p.x > this.w + 50) p.x = -50;

						if (this.effect === 'rain') {
							this.ctx.beginPath();
							this.ctx.moveTo(p.x, p.y);
							this.ctx.lineTo(p.x - p.vx * 2, p.y - p.length);
							this.ctx.stroke();
						} else if (this.effect === 'snow') {
							this.ctx.fillStyle = `rgba(255,255,255,${p.a})`;
							this.ctx.beginPath();
							this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
							this.ctx.fill();
						} else if (this.effect === 'stars') {
							this.ctx.fillStyle = `rgba(192,132,252,${p.a * (0.5 + 0.5 * Math.sin(Date.now() * 0.002 + i))})`;
							this.ctx.beginPath();
							this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
							this.ctx.fill();
						} else if (this.effect === 'vertices') {
							this.ctx.fillStyle = 'rgba(56,189,248,0.6)';
							this.ctx.beginPath();
							this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
							this.ctx.fill();
							for (let j = i + 1; j < this.particles.length; j++) {
								let p2 = this.particles[j];
								let dx = p.x - p2.x,
									dy = p.y - p2.y;
								let dist = Math.sqrt(dx * dx + dy * dy);
								if (dist < this.w * 0.15) {
									this.ctx.beginPath();
									this.ctx.moveTo(p.x, p.y);
									this.ctx.lineTo(p2.x, p2.y);
									this.ctx.strokeStyle = `rgba(56,189,248,${0.15 * (1 - dist / (this.w * 0.15))})`;
									this.ctx.lineWidth = 1;
									this.ctx.stroke();
								}
							}
						}
					}
					this.ctx.shadowBlur = 0;
					this.animId = requestAnimationFrame(() => this.draw());
				}

				loop() {
					cancelAnimationFrame(this.animId);
					this.draw();
				}
			}

			class AudioEngine {
				constructor() {
					this.ac = null;
					this.musicGain = null;
					this.rainGain = null;
					this.isPlaying = false;
					this.mode = 'ambient';
					this.playlist = CONFIG.playlist;
					this.currentTrack = 0;
					this.isPlaylistMode = false;
					this.webAudio = document.getElementById('webAudio');
					this.rainTimer = null;

					this.vibes = {
						ambient: {
							chords: [
								[174.61, 220.0, 261.63],
								[130.81, 164.81, 196.0],
								[146.83, 174.61, 220.0],
							],
						},
						deep: {
							chords: [
								[110.0, 130.81, 164.81],
								[87.31, 110.0, 130.81],
								[98.0, 123.47, 146.83],
							],
						},
						rain: {
							chords: [
								[146.83, 174.61, 220.0],
								[130.81, 164.81, 196.0],
								[110.0, 130.81, 164.81],
							],
						},
					};
				}

				init() {
					if (this.ac) return;
					const AC = window.AudioContext || window.webkitAudioContext;
					this.ac = new AC();
					this.musicGain = this.ac.createGain();
					this.rainGain = this.ac.createGain();
					this.musicGain.gain.value = 0.3;
					this.rainGain.gain.value = 0;
					this.musicGain.connect(this.ac.destination);
					this.rainGain.connect(this.ac.destination);
				}

				// Инициализация звука дождя и грома
				buildRain() {
					if (this.rainInitialized) return;
					this.rainInitialized = true;

					// Гул дождя (Brown noise)
					const bufferSize = this.ac.sampleRate * 2;
					const buffer = this.ac.createBuffer(
						1,
						bufferSize,
						this.ac.sampleRate,
					);
					const data = buffer.getChannelData(0);
					let lastOut = 0;
					for (let i = 0; i < bufferSize; i++) {
						let white = Math.random() * 2 - 1;
						data[i] = (lastOut + 0.02 * white) / 1.02;
						lastOut = data[i];
						data[i] *= 3.5;
					}
					const rainNode = this.ac.createBufferSource();
					rainNode.buffer = buffer;
					rainNode.loop = true;
					const filter = this.ac.createBiquadFilter();
					filter.type = 'lowpass';
					filter.frequency.value = 600; // Убрали резкие частоты
					rainNode.connect(filter);
					filter.connect(this.rainGain);
					rainNode.start(0);
				}

				playThunder() {
					if (!this.ac) return;
					const t0 = this.ac.currentTime;
					const osc = this.ac.createOscillator();
					const gain = this.ac.createGain();
					osc.type = 'sine';
					osc.frequency.setValueAtTime(60, t0);
					osc.frequency.exponentialRampToValueAtTime(30, t0 + 1.5);

					gain.gain.setValueAtTime(0, t0);
					gain.gain.linearRampToValueAtTime(0.8, t0 + 0.2); // Резкий раскат
					gain.gain.exponentialRampToValueAtTime(0.01, t0 + 2.5); // Долгое затухание

					osc.connect(gain);
					gain.connect(this.rainGain);
					osc.start(t0);
					osc.stop(t0 + 3);
				}

				startRainSounds() {
					this.buildRain();
					this.rainGain.gain.setTargetAtTime(0.4, this.ac.currentTime, 1);

					const scheduleThunder = () => {
						if (!this.isPlayingRain) return;
						this.playThunder();
						const nextThunder = 15000 + Math.random() * 20000; // Гром раз в 15-35 сек
						this.rainTimer = setTimeout(scheduleThunder, nextThunder);
					};
					if (!this.rainTimer)
						this.rainTimer = setTimeout(scheduleThunder, 5000);
					this.isPlayingRain = true;
				}

				stopRainSounds() {
					if (!this.ac) return;
					this.isPlayingRain = false;
					this.rainGain.gain.setTargetAtTime(0, this.ac.currentTime, 0.5);
					clearTimeout(this.rainTimer);
					this.rainTimer = null;
				}

				playChord(freqs) {
					const t0 = this.ac.currentTime;
					freqs.forEach((f, i) => {
						const osc = this.ac.createOscillator();
						osc.type = 'sine';
						osc.frequency.value = f;
						const g = this.ac.createGain();
						g.gain.setValueAtTime(0.0001, t0);
						g.gain.exponentialRampToValueAtTime(0.1 / (i + 1), t0 + 3);
						g.gain.exponentialRampToValueAtTime(0.0001, t0 + 10);
						osc.connect(g);
						g.connect(this.musicGain);
						osc.start(t0);
						osc.stop(t0 + 11);
					});
				}

				startGen() {
					this.init();
					if (this.ac.state === 'suspended') this.ac.resume();
					this.isPlaying = true;

					const chords = this.vibes[this.mode].chords;
					this.playChord(chords[0]);
					let step = 1;

					clearInterval(this.genTimer);
					this.genTimer = setInterval(() => {
						this.playChord(chords[step % chords.length]);
						step++;
					}, 8000);
				}

				stopGen() {
					this.isPlaying = false;
					clearInterval(this.genTimer);
				}

				setMode(mode) {
					this.stopGen();
					this.webAudio.pause();
					this.mode = mode;
					this.isPlaylistMode = mode === 'playlist';

					if (this.isPlaylistMode) {
						if (this.playlist.length > 0) this.playTrack(this.currentTrack);
						else this.setMode('ambient');
					} else {
						this.startGen();
					}
					UI.updatePlayState(this.isPlaying || !this.webAudio.paused);
				}

				playTrack(index) {
					this.currentTrack = index;
					this.webAudio.src = this.playlist[index].src;
					this.webAudio.volume = parseFloat(
						document.getElementById('volSlider').value,
					);
					this.webAudio
						.play()
						.catch(() =>
							UI.updateTrackInfo(this.playlist[index].title, 'Ошибка'),
						);
					UI.updateTrackInfo(this.playlist[index].title, 'Локальный трек');
				}

				togglePlay() {
					if (this.isPlaylistMode) {
						if (this.webAudio.paused) {
							this.webAudio.play();
							return true;
						} else {
							this.webAudio.pause();
							return false;
						}
					} else {
						if (this.isPlaying) {
							this.stopGen();
							return false;
						} else {
							this.startGen();
							return true;
						}
					}
				}

				nextTrack() {
					if (this.isPlaylistMode)
						this.playTrack((this.currentTrack + 1) % this.playlist.length);
				}
				prevTrack() {
					if (this.isPlaylistMode)
						this.playTrack(
							(this.currentTrack - 1 + this.playlist.length) %
								this.playlist.length,
						);
				}

				setVolume(val) {
					if (this.isPlaylistMode) this.webAudio.volume = val;
					else if (this.ac)
						this.musicGain.gain.setTargetAtTime(
							val * 0.4,
							this.ac.currentTime,
							0.1,
						);
				}
			}

			const UI = {
				init() {
					this.engine = new AudioEngine();
					this.bg = new BackgroundEngine(document.getElementById('bg'));

					this.els = {
						player: document.getElementById('player'),
						settingsBtn: document.getElementById('settingsBtn'),
						settingsMenu: document.getElementById('settingsMenu'),
						socialTrigger: document.getElementById('socialTrigger'),
						socialPanel: document.getElementById('socialPanel'),
						rainToggle: document.getElementById('rainToggle'),
						playBtn: document.getElementById('playBtn'),
						iconPlay: document.getElementById('iconPlay'),
						iconPause: document.getElementById('iconPause'),
						trackName: document.getElementById('trackName'),
						trackStatus: document.getElementById('trackStatus'),
						qrModal: document.getElementById('qrModal'),
						qrTitle: document.getElementById('qrTitle'),
						qrLink: document.getElementById('qrLink'),
					};

					this.bindEvents();
				},

				bindEvents() {
					const { els, engine, bg } = this;

					// Настройки
					els.settingsBtn.onclick = () =>
						els.settingsMenu.classList.toggle('open');
					document.querySelectorAll('[data-mode]').forEach((btn) => {
						btn.onclick = (e) => {
							document
								.querySelectorAll('[data-mode]')
								.forEach((b) => b.classList.remove('active'));
							e.target.classList.add('active');
							engine.setMode(e.target.dataset.mode);
							if (e.target.dataset.mode !== 'playlist') {
								const names = {
									ambient: 'Ambient',
									deep: 'Deep Space',
									rain: 'Lo-Fi',
								};
								this.updateTrackInfo(names[e.target.dataset.mode], 'Генератор');
							}
						};
					});

					document.querySelectorAll('[data-effect]').forEach((btn) => {
						btn.onclick = (e) => {
							document
								.querySelectorAll('[data-effect]')
								.forEach((b) => b.classList.remove('active'));
							e.target.classList.add('active');
							bg.setEffect(e.target.dataset.effect);
						};
					});

					els.rainToggle.onchange = (e) => {
						if (e.target.checked) engine.startRainSounds();
						else engine.stopRainSounds();
					};

					// Плеер
					els.playBtn.onclick = () => {
						const isPlaying = engine.togglePlay();
						this.updatePlayState(isPlaying);
					};
					document.getElementById('nextBtn').onclick = () => engine.nextTrack();
					document.getElementById('prevBtn').onclick = () => engine.prevTrack();

					document.getElementById('volSlider').oninput = (e) =>
						engine.setVolume(e.target.value);
					els.webAudio = document.getElementById('webAudio');
					els.webAudio.onplay = () => this.updatePlayState(true);
					els.webAudio.onpause = () => this.updatePlayState(false);
					els.webAudio.onended = () => engine.nextTrack();

					// Соцсети
					els.socialTrigger.onclick = () =>
						els.socialPanel.classList.toggle('open');
					document.querySelectorAll('.soc-item').forEach((item) => {
						item.onclick = () => {
							const url = item.dataset.url;
							els.qrTitle.innerText = item.dataset.name;
							els.qrLink.href = url;
							els.qrModal.classList.add('open');

							// Локальная генерация QR-кода
							const canvas = document.getElementById('qr-canvas');
							QRCode.toCanvas(
								canvas,
								url,
								{
									width: 180,
									margin: 2,
									color: { dark: '#c084fc', light: '#0c0d12' },
								},
								(err) => {
									if (err) console.error(err);
								},
							);
						};
					});

					els.qrModal.onclick = (e) => {
						if (e.target === els.qrModal) els.qrModal.classList.remove('open');
					};
				},

				updatePlayState(isPlaying) {
					if (isPlaying) {
						this.els.iconPlay.style.display = 'none';
						this.els.iconPause.style.display = 'block';
						this.els.player.classList.add('playing');
					} else {
						this.els.iconPlay.style.display = 'block';
						this.els.iconPause.style.display = 'none';
						this.els.player.classList.remove('playing');
					}
				},

				updateTrackInfo(name, status) {
					this.els.trackName.innerText = name;
					this.els.trackStatus.innerText = status;
				},
			};

			document.addEventListener('DOMContentLoaded', () => UI.init());
		</script>
