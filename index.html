<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noclipov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#8b5cf6;
    --cyan:#22d3ee;
    --pink:#f472b6;
    --txt:#e9eaf5;
    --muted:#8b8fab;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #171a35 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #101a2c 0%, transparent 60%),
      #05060c;
    color:var(--txt);
    display:grid;
    place-items:center;
    padding:32px 16px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- фон ---------- */
  .aurora{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    filter:blur(90px); opacity:.55;
  }
  .blob{ position:absolute; border-radius:50%; mix-blend-mode:screen; will-change:transform; }
  .b1{ width:520px; height:520px; background:#6d28d9; top:-160px; left:-120px; animation:drift1 20s ease-in-out infinite; }
  .b2{ width:460px; height:460px; background:#0891b2; bottom:-160px; right:-100px; animation:drift2 26s ease-in-out infinite; }
  .b3{ width:380px; height:380px; background:#be185d; top:45%; left:65%; animation:drift3 32s ease-in-out infinite; opacity:.7; }

  @keyframes drift1{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%    { transform:translate3d(120px,80px,0) scale(1.15); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate3d(0,0,0) scale(1.1); }
    50%    { transform:translate3d(-140px,-70px,0) scale(.9); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate3d(0,0,0) scale(.95); }
    50%    { transform:translate3d(-90px,110px,0) scale(1.2); }
  }

  #bg{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- карточка ---------- */
  .wrap{ position:relative; z-index:2; animation:rise 1s cubic-bezier(.2,.85,.25,1) both; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(34px) scale(.96); filter:blur(8px); }
    to  { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }

  .card{
    position:relative;
    width:min(92vw, 360px);
    padding:40px 32px 32px;
    border-radius:32px;
    background:linear-gradient(165deg, rgba(255,255,255,.06), rgba(255,255,255,.01) 40%, rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    box-shadow:
      0 40px 100px -20px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.1) inset;
    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
    text-align:center;
  }

  .card::before{
    content:"";
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(360px circle at var(--mx,50%) var(--my,0%), rgba(139,92,246,.18), transparent 65%);
    opacity:0; transition:opacity .45s;
  }
  .card:hover::before{ opacity:1; }

  .card::after{
    content:"";
    position:absolute; left:20%; right:20%; top:-1px; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(167,139,250,.8), rgba(34,211,238,.6), transparent);
    filter:blur(.5px); opacity:.7;
  }

  /* ---------- аватар ---------- */
  .avatar{
    position:relative;
    width:104px; height:104px;
    margin:0 auto 24px;
    transform:translateZ(40px);
  }
  .avatar::before{
    content:""; position:absolute; inset:-5px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    filter:blur(14px); opacity:.65;
    animation:spin 10s linear infinite;
  }
  .avatar::after{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    animation:spin 10s linear infinite;
  }
  .avatar-inner{
    position:absolute; inset:3px; border-radius:50%; z-index:1;
    background:#0a0b16;
    overflow:hidden;
    display:grid; place-items:center;
    font-size:40px; font-weight:700;
    color:#fff;
    text-shadow:0 0 24px rgba(139,92,246,.95);
  }
  .avatar-inner img{
    width:100%; height:100%; object-fit:cover;
    border-radius:50%;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- профиль ---------- */
  .name-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    transform:translateZ(26px);
  }

  .name{
    font-size:28px;
    font-weight:700;
    letter-spacing:-.03em;
    background:linear-gradient(100deg, #ffffff 10%, #a78bfa 40%, #22d3ee 60%, #ffffff 90%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    animation:shimmer 6s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:-250% 0; } }

  .status-dot{
    width:10px; height:10px;
    border-radius:50%;
    background:#22d3ee;
    box-shadow: 0 0 12px #22d3ee, 0 0 20px rgba(34,211,238,.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(.85); opacity:.7; }
  }

  .tagline{
    margin-top:10px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--muted);
    letter-spacing:.01em;
    transform:translateZ(18px);
  }

  /* ---------- соц-кнопки ---------- */
  .socials{
    display:flex; gap:12px; justify-content:center;
    margin:28px 0 24px;
    transform:translateZ(22px);
  }
  .soc{
    width:44px; height:44px;
    display:grid; place-items:center;
    border-radius:15px;
    color:#9ea2c0;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    text-decoration:none;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), color .3s, background .3s, border-color .3s, box-shadow .3s;
  }
  .soc:hover{
    transform:translateY(-4px) scale(1.05);
    color:#fff;
    background:rgba(34,211,238,.12);
    border-color:rgba(34,211,238,.45);
    box-shadow:0 10px 28px -10px rgba(34,211,238,.8);
  }
  .soc:active{ transform:translateY(-1px) scale(.98); }
  .soc svg{ width:19px; height:19px; }

  /* ---------- аудио-плеер ---------- */
  .player{
    display:flex; align-items:center; gap:16px;
    width:100%;
    padding:12px 16px;
    border-radius:18px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    transform:translateZ(30px);
    transition:border-color .3s, background .3s;
  }
  .player:hover{
    background:rgba(255,255,255,.05);
    border-color:rgba(255,255,255,.12);
  }

  .music-btn{
    flex-shrink:0;
    width:36px; height:36px;
    display:grid; place-items:center;
    border-radius:50%;
    color:#cfd2e8;
    background:linear-gradient(135deg, rgba(139,92,246,.2), rgba(34,211,238,.15));
    border:1px solid rgba(167,139,250,.3);
    cursor:pointer;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  .music-btn:hover{
    color:#fff;
    border-color:rgba(167,139,250,.8);
    box-shadow:0 0 20px rgba(139,92,246,.4);
    transform:scale(1.05);
  }
  .music-btn:active{ transform:scale(.95); }
  .music-btn svg{ width:14px; height:14px; margin-left:2px; }
  
  .music-btn.playing svg{ margin-left:0; }

  /* Ползунок громкости */
  .vol-wrap{
    flex-grow:1;
    display:flex; align-items:center;
  }
  
  input[type=range]{
    -webkit-appearance:none;
    width:100%;
    background:transparent;
  }
  input[type=range]:focus{
    outline:none;
  }
  input[type=range]::-webkit-slider-runnable-track{
    width:100%;
    height:4px;
    cursor:pointer;
    background:rgba(255,255,255,.1);
    border-radius:2px;
    transition:background .3s;
  }
  input[type=range]::-webkit-slider-thumb{
    height:12px;
    width:12px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    -webkit-appearance:none;
    margin-top:-4px;
    box-shadow:0 0 10px rgba(139,92,246,.8);
    transition:transform .2s, box-shadow .2s;
  }
  input[type=range]:hover::-webkit-slider-runnable-track{
    background:rgba(255,255,255,.2);
  }
  input[type=range]:hover::-webkit-slider-thumb{
    transform:scale(1.2);
    box-shadow:0 0 16px rgba(34,211,238,.9);
  }

  input[type=range]::-moz-range-track{
    width:100%;
    height:4px;
    cursor:pointer;
    background:rgba(255,255,255,.1);
    border-radius:2px;
  }
  input[type=range]::-moz-range-thumb{
    height:12px;
    width:12px;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    border:none;
    box-shadow:0 0 10px rgba(139,92,246,.8);
    transition:transform .2s, box-shadow .2s;
  }
  input[type=range]:hover::-moz-range-thumb{
    transform:scale(1.2);
    box-shadow:0 0 16px rgba(34,211,238,.9);
  }

  /* ---------- адаптив ---------- */
  @media (max-width:420px){
    .card{ padding:32px 24px 24px; border-radius:26px; }
    .name{ font-size:25px; }
    .avatar{ width:92px; height:92px; }
    .socials{ margin:24px 0 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<canvas id="bg"></canvas>

<div class="wrap">
  <section class="card" id="card">
    
    <div class="avatar">
      <div class="avatar-inner">
        <!-- Подтягиваем аватарку с GitHub -->
        <img src="https://github.com/noclipov.png" alt="noclipov avatar" onerror="this.style.display='none'; this.parentElement.innerText='n';">
      </div>
    </div>

    <div class="name-row">
      <h1 class="name">noclipov</h1>
      <div class="status-dot" title="Online"></div>
    </div>
    
    <p class="tagline">where the light fades and echoes remain</p>

    <div class="socials">
      <a class="soc" href="https://github.com/noclipov" aria-label="GitHub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
        </svg>
      </a>

      <a class="soc" href="#" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.6 3.4 2.9 10.7c-.94.37-.93 1.7.02 2.04l4.7 1.66 1.8 5.55c.27.84 1.32 1.03 1.86.34l2.5-3.2 4.72 3.48c.72.53 1.75.13 1.9-.75l2.9-15.2c.17-.9-.72-1.6-1.4-1.22zM9.6 14.1l-.3 3.2-1.2-3.7 9.2-6.3-7.7 6.8z"/>
        </svg>
      </a>

      <a class="soc" href="#" aria-label="Mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3.2"/>
          <path d="m3.4 7.6 7.6 5.4a1.8 1.8 0 0 0 2 0l7.6-5.4"/>
        </svg>
      </a>
    </div>

    <!-- Улучшенный плеер с громкостью -->
    <div class="player">
      <button class="music-btn" id="musicBtn" aria-label="Включить музыку">
        <!-- Иконка Play -->
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Иконка Pause (скрыта по умолчанию) -->
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>
      
      <div class="vol-wrap">
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.5" title="Громкость">
      </div>
    </div>

  </section>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     1. ЧАСТИЦЫ НА ФОНЕ
     ========================================================= */
  const canvas = document.getElementById("bg");
  const c2d = canvas.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0, parts = [];

  function resizeCanvas() {
    W = canvas.width  = Math.floor(innerWidth  * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width  = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    const count = Math.round(Math.min(80, Math.max(35, innerWidth / 18)));
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (Math.random() * 1.2 + 0.5) * DPR,
      vy: -(Math.random() * 0.15 + 0.04) * DPR,
      vx: (Math.random() - 0.5) * 0.08 * DPR,
      a: Math.random() * 0.45 + 0.1,
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.01 + 0.003
    }));
  }

  function drawStars() {
    c2d.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx;
      p.y += p.vy;
      p.ph += p.sp;

      if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      const alpha = p.a * (0.6 + 0.4 * Math.sin(p.ph));

      c2d.beginPath();
      c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c2d.fillStyle = "rgba(200,210,255," + alpha.toFixed(3) + ")";
      c2d.shadowBlur = 10 * DPR;
      c2d.shadowColor = "rgba(139,92,246,0.7)";
      c2d.fill();
    }
    c2d.shadowBlur = 0;
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  drawStars();
  addEventListener("resize", resizeCanvas);

  /* =========================================================
     2. 3D-НАКЛОН + ПОДСВЕТКА
     ========================================================= */
  const card = document.getElementById("card");
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let raf = null;

  function move(e) {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;

      const rx = (0.5 - ny) * 8;
      const ry = (nx - 0.5) * 10;

      card.style.transform =
        "perspective(900px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
      card.style.setProperty("--mx", (nx * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (ny * 100).toFixed(1) + "%");
    });
  }

  function reset() {
    card.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg)";
    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "0%");
  }

  if (fine) {
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseleave", reset);
  }

  /* =========================================================
     3. МЯГКАЯ ГЕНЕРАТИВНАЯ МУЗЫКА
     ========================================================= */
  const Music = (() => {
    let ac = null;
    let masterGain = null;  // Плавное появление/исчезновение
    let volumeGain = null;  // Управление громкостью
    let sendBus = null;
    let playing = false;
    let chordTimer = null;
    let noteTimer = null;
    let step = 0;

    const CHORDS = [
      [174.61, 220.00, 261.63],  // Fmaj7
      [130.81, 164.81, 196.00],  // Cmaj
      [196.00, 246.94, 293.66],  // G
      [146.83, 174.61, 220.00]   // Dm
    ];
    // Более мягкие высокие ноты (мажорная пентатоника)
    const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00]; 

    function init() {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();

      masterGain = ac.createGain();
      masterGain.gain.value = 0;

      volumeGain = ac.createGain();
      // Ставим громкость из слайдера (по умолчанию 0.5)
      volumeGain.gain.value = parseFloat(document.getElementById('volSlider').value) * 0.4;

      // Мягкий фильтр, убирающий резкие высокие частоты
      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 1800;
      lp.Q.value = 0.2;

      masterGain.connect(lp);
      lp.connect(volumeGain);
      volumeGain.connect(ac.destination);

      // Мягкое эхо
      const delay = ac.createDelay(1.5);
      delay.delayTime.value = 0.6;

      const fb = ac.createGain();
      fb.gain.value = 0.35;

      const damp = ac.createBiquadFilter();
      damp.type = "lowpass";
      damp.frequency.value = 1200; // Очень глухое эхо

      const wet = ac.createGain();
      wet.gain.value = 0.5;

      delay.connect(damp);
      damp.connect(fb);
      fb.connect(delay);
      damp.connect(wet);
      wet.connect(masterGain);

      sendBus = delay;
    }

    function playChord(freqs) {
      const t0 = ac.currentTime + 0.1;
      const dur = 10.0;

      freqs.forEach((f, i) => {
        // Только мягкие синусоиды
        const osc = ac.createOscillator();
        osc.type = "sine";
        osc.frequency.value = f;

        const g = ac.createGain();
        const peak = 0.12 / (1 + i * 0.5); // Тише для высоких нот

        // ОЧЕНЬ плавная атака и затухание (без щелчков)
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 4.0); // 4 секунды на разгон
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
        if (pan) {
          pan.pan.value = (i % 2 ? 0.6 : -0.6);
          osc.connect(g);
          g.connect(pan);
          pan.connect(masterGain);
          pan.connect(sendBus);
        } else {
          osc.connect(g);
          g.connect(masterGain);
          g.connect(sendBus);
        }

        osc.start(t0);
        osc.stop(t0 + dur + 0.5);
      });
    }

    function playBell() {
      const t0 = ac.currentTime + 0.05;
      const f = SCALE[Math.floor(Math.random() * SCALE.length)];

      const o1 = ac.createOscillator();
      o1.type = "sine";
      o1.frequency.value = f;

      const env = ac.createGain();
      // Очень тихая и плавная нота
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(0.04, t0 + 0.5); // Медленный разгон
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.5);

      o1.connect(env);
      env.connect(masterGain);
      env.connect(sendBus);

      o1.start(t0); o1.stop(t0 + 4.0);
    }

    function start() {
      init();
      if (ac.state === "suspended") ac.resume();

      playing = true;
      step = 0;

      const now = ac.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(masterGain.gain.value, 0.0001), now);
      masterGain.gain.linearRampToValueAtTime(1.0, now + 3.0); // Очень плавное появление

      playChord(CHORDS[0]);
      step = 1;

      chordTimer = setInterval(() => {
        playChord(CHORDS[step % CHORDS.length]);
        step++;
      }, 8000); // Смена аккорда каждые 8 секунд (плавный кроссфейд)

      noteTimer = setInterval(() => {
        if (Math.random() < 0.6) playBell();
      }, 3500); // Редкие ноты
    }

    function stop() {
      playing = false;
      clearInterval(chordTimer);
      clearInterval(noteTimer);
      chordTimer = noteTimer = null;

      if (!ac) return;
      const now = ac.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 2.0); // Плавное затухание
    }

    return {
      toggle() {
        if (playing) { stop(); return false; }
        start();
        return true;
      },
      setVolume(val) {
        if (!ac || !volumeGain) return;
        // Максимальная громкость 0.4, чтобы не было перегруза
        volumeGain.gain.setTargetAtTime(val * 0.4, ac.currentTime, 0.1);
      }
    };
  })();

  /* =========================================================
     4. УПРАВЛЕНИЕ ПЛЕЕРОМ (Кнопка и Громкость)
     ========================================================= */
  const btn = document.getElementById("musicBtn");
  const iconPlay = document.getElementById("iconPlay");
  const iconPause = document.getElementById("iconPause");
  const volSlider = document.getElementById("volSlider");

  // Инициализация ползунка (визуально)
  function updateSliderStyle() {
    const val = (volSlider.value - volSlider.min) / (volSlider.max - volSlider.min) * 100;
    volSlider.style.background = `linear-gradient(to right, var(--cyan) ${val}%, rgba(255,255,255,.1) ${val}%)`;
  }
  
  // Применяем стили для трека (для WebKit ползунков)
  const style = document.createElement('style');
  style.innerHTML = `
    input[type=range]::-webkit-slider-runnable-track {
      background: linear-gradient(to right, var(--cyan) var(--vol-pct, 50%), rgba(255,255,255,.1) var(--vol-pct, 50%));
    }
  `;
  document.head.appendChild(style);
  
  function handleVolumeChange() {
    const val = volSlider.value;
    volSlider.style.setProperty('--vol-pct', `${val * 100}%`);
    Music.setVolume(val);
  }

  volSlider.addEventListener('input', handleVolumeChange);
  handleVolumeChange(); // init

  btn.addEventListener("click", () => {
    const isOn = Music.toggle();
    
    if (isOn) {
      btn.classList.add("playing");
      btn.setAttribute("aria-label", "Поставить на паузу");
      iconPlay.style.display = "none";
      iconPause.style.display = "block";
    } else {
      btn.classList.remove("playing");
      btn.setAttribute("aria-label", "Включить музыку");
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
    }
  });

})();
</script>
</body>
