<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noclipov</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#8b5cf6;
    --cyan:#22d3ee;
    --pink:#f472b6;
    --txt:#e9eaf5;
    --muted:#8b8fab;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #171a35 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 110%, #101a2c 0%, transparent 60%),
      #05060c;
    color:var(--txt);
    display:grid;
    place-items:center;
    padding:32px 16px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- фон ---------- */
  .aurora{
    position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    filter:blur(80px); opacity:.55;
  }
  .blob{ position:absolute; border-radius:50%; mix-blend-mode:screen; will-change:transform; }
  .b1{ width:520px; height:520px; background:#6d28d9; top:-160px; left:-120px; animation:drift1 20s ease-in-out infinite; }
  .b2{ width:460px; height:460px; background:#0891b2; bottom:-160px; right:-100px; animation:drift2 26s ease-in-out infinite; }
  .b3{ width:380px; height:380px; background:#be185d; top:45%; left:65%; animation:drift3 32s ease-in-out infinite; opacity:.7; }

  @keyframes drift1{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%    { transform:translate3d(120px,80px,0) scale(1.15); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate3d(0,0,0) scale(1.1); }
    50%    { transform:translate3d(-140px,-70px,0) scale(.9); }
  }
  @keyframes drift3{
    0%,100%{ transform:translate3d(0,0,0) scale(.95); }
    50%    { transform:translate3d(-90px,110px,0) scale(1.2); }
  }

  #bg{ position:fixed; inset:0; z-index:1; pointer-events:none; }

  /* ---------- карточка ---------- */
  .wrap{ position:relative; z-index:2; animation:rise 1s cubic-bezier(.2,.85,.25,1) both; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(34px) scale(.96); filter:blur(8px); }
    to  { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }

  .card{
    position:relative;
    width:min(92vw, 400px);
    padding:38px 30px 28px;
    border-radius:30px;
    background:linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 45%, rgba(255,255,255,.045));
    border:1px solid rgba(255,255,255,.09);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    backdrop-filter:blur(22px) saturate(150%);
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,.95),
      0 0 0 1px rgba(255,255,255,.03) inset,
      0 1px 0 rgba(255,255,255,.12) inset;
    transform-style:preserve-3d;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    text-align:center;
  }

  .card::before{
    content:"";
    position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%), rgba(139,92,246,.20), transparent 62%);
    opacity:0; transition:opacity .45s;
  }
  .card:hover::before{ opacity:1; }

  .card::after{
    content:"";
    position:absolute; left:15%; right:15%; top:-1px; height:1px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(167,139,250,.9), rgba(34,211,238,.7), transparent);
    filter:blur(.5px); opacity:.75;
  }

  /* ---------- аватар ---------- */
  .avatar{
    position:relative;
    width:104px; height:104px;
    margin:0 auto 20px;
    transform:translateZ(40px);
  }
  .avatar::before{
    content:""; position:absolute; inset:-4px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    filter:blur(12px); opacity:.7;
    animation:spin 9s linear infinite;
  }
  .avatar::after{
    content:""; position:absolute; inset:-1px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--violet), var(--cyan), var(--pink), var(--violet));
    animation:spin 9s linear infinite;
  }
  .avatar-inner{
    position:absolute; inset:3px; border-radius:50%; z-index:1;
    display:grid; place-items:center;
    background:radial-gradient(circle at 32% 26%, #2b2d4d, #0a0b16 72%);
    font-size:44px; font-weight:700; letter-spacing:-.05em;
    color:#fff;
    text-shadow:0 0 24px rgba(139,92,246,.95), 0 0 46px rgba(34,211,238,.45);
    user-select:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- текст ---------- */
  .name{
    font-size:29px;
    font-weight:700;
    letter-spacing:-.025em;
    background:linear-gradient(100deg, #ffffff 8%, #a78bfa 34%, #22d3ee 56%, #ffffff 84%);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    animation:shimmer 7s linear infinite;
    transform:translateZ(26px);
  }
  @keyframes shimmer{ to{ background-position:-260% 0; } }

  .tagline{
    margin-top:10px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
    letter-spacing:.01em;
    transform:translateZ(18px);
  }

  /* ---------- теги ---------- */
  .tags{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin:22px 0 26px;
    transform:translateZ(14px);
  }
  .tag{
    font-size:11.5px; font-weight:500; letter-spacing:.04em;
    padding:6px 13px;
    border-radius:999px;
    color:#b9bcd6;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), color .3s, border-color .3s, box-shadow .3s, background .3s;
    cursor:default;
  }
  .tag:hover{
    transform:translateY(-3px);
    color:#fff;
    background:rgba(139,92,246,.16);
    border-color:rgba(167,139,250,.55);
    box-shadow:0 8px 24px -8px rgba(139,92,246,.85), 0 0 0 1px rgba(167,139,250,.2) inset;
  }

  /* ---------- соц-кнопки ---------- */
  .socials{
    display:flex; gap:12px; justify-content:center;
    transform:translateZ(22px);
  }
  .soc{
    width:44px; height:44px;
    display:grid; place-items:center;
    border-radius:14px;
    color:#9ea2c0;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    text-decoration:none;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), color .3s, background .3s, border-color .3s, box-shadow .3s;
  }
  .soc:hover{
    transform:translateY(-4px) scale(1.06);
    color:#fff;
    background:rgba(34,211,238,.14);
    border-color:rgba(34,211,238,.5);
    box-shadow:0 10px 28px -10px rgba(34,211,238,.9);
  }
  .soc:active{ transform:translateY(-1px) scale(.98); }
  .soc svg{ width:19px; height:19px; }

  /* ---------- музыка ---------- */
  .music{
    margin-top:26px;
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:13px 20px;
    border-radius:16px;
    font-family:inherit;
    font-size:13px; font-weight:600; letter-spacing:.02em;
    color:#cfd2e8;
    background:linear-gradient(120deg, rgba(139,92,246,.14), rgba(34,211,238,.10));
    border:1px solid rgba(167,139,250,.28);
    cursor:pointer;
    overflow:hidden;
    position:relative;
    transition:color .3s, border-color .3s, box-shadow .3s, transform .25s cubic-bezier(.2,.8,.2,1);
    transform:translateZ(30px);
  }
  .music::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, rgba(139,92,246,.5), rgba(34,211,238,.42), rgba(244,114,182,.42));
    opacity:0; transition:opacity .35s;
    z-index:-1;
  }
  .music:hover{
    color:#fff;
    border-color:rgba(167,139,250,.65);
    box-shadow:0 14px 40px -14px rgba(139,92,246,.95);
    transform:translateZ(30px) translateY(-2px);
  }
  .music:hover::before{ opacity:.35; }
  .music:active{ transform:translateZ(30px) translateY(0) scale(.985); }

  .eq{ display:inline-flex; align-items:flex-end; gap:3px; height:16px; }
  .eq i{
    display:block;
    width:3px; height:16px;
    border-radius:2px;
    background:linear-gradient(180deg, #a78bfa, #22d3ee);
    transform-origin:bottom;
    transform:scaleY(.28);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .music.playing .eq i{ animation:eqb .95s ease-in-out infinite; }
  .music.playing .eq i:nth-child(2){ animation-delay:.14s; }
  .music.playing .eq i:nth-child(3){ animation-delay:.30s; }
  .music.playing .eq i:nth-child(4){ animation-delay:.08s; }

  @keyframes eqb{
    0%,100%{ transform:scaleY(.28); }
    50%    { transform:scaleY(1); }
  }

  .music .label{ pointer-events:none; }

  /* ---------- адаптив ---------- */
  @media (max-width:420px){
    .card{ padding:32px 22px 24px; border-radius:26px; }
    .name{ font-size:25px; }
    .avatar{ width:92px; height:92px; }
    .avatar-inner{ font-size:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<canvas id="bg"></canvas>

<div class="wrap">
  <section class="card" id="card">
    <div class="avatar">
      <div class="avatar-inner">n</div>
    </div>

    <h1 class="name">noclipov</h1>
    <p class="tagline">где-то между звёздами и пустотой</p>

    <div class="tags">
      <span class="tag">chill</span>
      <span class="tag">night</span>
      <span class="tag">ambient</span>
      <span class="tag">floating</span>
    </div>

    <div class="socials">
      <a class="soc" href="https://github.com/noclipov" aria-label="GitHub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
        </svg>
      </a>

      <a class="soc" href="#" aria-label="Telegram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.6 3.4 2.9 10.7c-.94.37-.93 1.7.02 2.04l4.7 1.66 1.8 5.55c.27.84 1.32 1.03 1.86.34l2.5-3.2 4.72 3.48c.72.53 1.75.13 1.9-.75l2.9-15.2c.17-.9-.72-1.6-1.4-1.22zM9.6 14.1l-.3 3.2-1.2-3.7 9.2-6.3-7.7 6.8z"/>
        </svg>
      </a>

      <a class="soc" href="#" aria-label="Mail">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.6" y="4.6" width="18.8" height="14.8" rx="3.2"/>
          <path d="m3.4 7.6 7.6 5.4a1.8 1.8 0 0 0 2 0l7.6-5.4"/>
        </svg>
      </a>
    </div>

    <button class="music" id="musicBtn" aria-pressed="false">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="label" id="musicLabel">включить музыку</span>
    </button>
  </section>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     1. ЧАСТИЦЫ НА ФОНЕ
     ========================================================= */
  const canvas = document.getElementById("bg");
  const c2d = canvas.getContext("2d");
  const DPR = Math.min(window.devicePixelRatio || 1, 2);

  let W = 0, H = 0, parts = [];

  function resizeCanvas() {
    W = canvas.width  = Math.floor(innerWidth  * DPR);
    H = canvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width  = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    const count = Math.round(Math.min(90, Math.max(38, innerWidth / 16)));
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (Math.random() * 1.5 + 0.6) * DPR,
      vy: -(Math.random() * 0.22 + 0.05) * DPR,
      vx: (Math.random() - 0.5) * 0.12 * DPR,
      a: Math.random() * 0.55 + 0.15,
      ph: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.015 + 0.004
    }));
  }

  function drawStars() {
    c2d.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx;
      p.y += p.vy;
      p.ph += p.sp;

      if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      const alpha = p.a * (0.55 + 0.45 * Math.sin(p.ph));

      c2d.beginPath();
      c2d.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      c2d.fillStyle = "rgba(190,200,255," + alpha.toFixed(3) + ")";
      c2d.shadowBlur = 12 * DPR;
      c2d.shadowColor = "rgba(139,92,246,0.85)";
      c2d.fill();
    }
    c2d.shadowBlur = 0;
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  drawStars();
  addEventListener("resize", resizeCanvas);

  /* =========================================================
     2. 3D-НАКЛОН + ПОДСВЕТКА КАРТОЧКИ
     ========================================================= */
  const card = document.getElementById("card");
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  let raf = null;

  function move(e) {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;

      const rx = (0.5 - ny) * 9;
      const ry = (nx - 0.5) * 11;

      card.style.transform =
        "perspective(900px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
      card.style.setProperty("--mx", (nx * 100).toFixed(1) + "%");
      card.style.setProperty("--my", (ny * 100).toFixed(1) + "%");
    });
  }

  function reset() {
    card.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg)";
    card.style.setProperty("--mx", "50%");
    card.style.setProperty("--my", "0%");
  }

  if (fine) {
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseleave", reset);
  }

  /* =========================================================
     3. ГЕНЕРАТИВНАЯ ЭМБИЕНТ-МУЗЫКА (Web Audio API)
     ========================================================= */
  const Music = (() => {
    let ac = null;
    let master = null;
    let sendBus = null;
    let playing = false;
    let chordTimer = null;
    let noteTimer = null;
    let step = 0;

    const CHORDS = [
      [220.00, 261.63, 329.63],  // Am
      [174.61, 220.00, 261.63],  // F
      [261.63, 329.63, 392.00],  // C
      [196.00, 246.94, 293.66]   // G
    ];
    const SCALE = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function init() {
      if (ac) return;

      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();

      master = ac.createGain();
      master.gain.value = 0;

      const lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 2800;
      lp.Q.value = 0.4;

      master.connect(lp);
      lp.connect(ac.destination);

      // эхо-шина для "воздуха"
      const delay = ac.createDelay(1.0);
      delay.delayTime.value = 0.42;

      const fb = ac.createGain();
      fb.gain.value = 0.36;

      const damp = ac.createBiquadFilter();
      damp.type = "lowpass";
      damp.frequency.value = 1900;

      const wet = ac.createGain();
      wet.gain.value = 0.4;

      delay.connect(damp);
      damp.connect(fb);
      fb.connect(delay);
      damp.connect(wet);
      wet.connect(master);

      sendBus = delay;
    }

    function chord(freqs) {
      const t0 = ac.currentTime + 0.06;
      const dur = 9.4;

      freqs.forEach((f, i) => {
        [1, 1.0035].forEach((det, k) => {
          const osc = ac.createOscillator();
          osc.type = k === 0 ? "sine" : "triangle";
          osc.frequency.value = f * det;

          const g = ac.createGain();
          const peak = 0.055 / (1 + i * 0.4);

          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(peak, t0 + 3.2);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

          const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
          if (pan) {
            pan.pan.value = (k ? 0.45 : -0.45) * (i % 2 ? 1 : -1);
            osc.connect(g);
            g.connect(pan);
            pan.connect(master);
            pan.connect(sendBus);
          } else {
            osc.connect(g);
            g.connect(master);
            g.connect(sendBus);
          }

          osc.start(t0);
          osc.stop(t0 + dur + 0.2);
        });
      });
    }

    function bell() {
      const t0 = ac.currentTime + 0.03;
      const f = SCALE[Math.floor(Math.random() * SCALE.length)];

      const o1 = ac.createOscillator();
      o1.type = "sine";
      o1.frequency.value = f;

      const o2 = ac.createOscillator();
      o2.type = "sine";
      o2.frequency.value = f * 2.01;

      const g2 = ac.createGain();
      g2.gain.value = 0.22;

      const env = ac.createGain();
      env.gain.setValueAtTime(0.0001, t0);
      env.gain.exponentialRampToValueAtTime(0.085, t0 + 0.03);
      env.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.8);

      o1.connect(env);
      o2.connect(g2);
      g2.connect(env);

      env.connect(master);
      env.connect(sendBus);

      o1.start(t0); o1.stop(t0 + 3.0);
      o2.start(t0); o2.stop(t0 + 3.0);
    }

    function start() {
      init();
      if (ac.state === "suspended") ac.resume();

      playing = true;
      step = 0;

      const now = ac.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), now);
      master.gain.linearRampToValueAtTime(0.9, now + 2.5);

      chord(CHORDS[0]);
      step = 1;

      chordTimer = setInterval(() => {
        chord(CHORDS[step % CHORDS.length]);
        step++;
      }, 9000);

      noteTimer = setInterval(() => {
        if (Math.random() < 0.78) bell();
      }, 2300);
    }

    function stop() {
      playing = false;
      clearInterval(chordTimer);
      clearInterval(noteTimer);
      chordTimer = noteTimer = null;

      if (!ac) return;
      const now = ac.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(0.0001, now + 1.4);
    }

    return {
      toggle() {
        if (playing) { stop(); return false; }
        start();
        return true;
      }
    };
  })();

  /* =========================================================
     4. КНОПКА МУЗЫКИ
     ========================================================= */
  const btn = document.getElementById("musicBtn");
  const label = document.getElementById("musicLabel");

  btn.addEventListener("click", () => {
    const isOn = Music.toggle();
    btn.classList.toggle("playing", isOn);
    btn.setAttribute("aria-pressed", String(isOn));
    label.textContent = isOn ? "играет эмбиент" : "включить музыку";
  });
})();
</script>
</body>
</html>
